name: 자격증 상태 변경
description: 합격 처리, 응시 일정 변경, 자격증 추가·삭제 → 자동으로 PR 생성 (저장소 소유자만 처리)
title: "[자격증] "
labels: ["cert"]
body:
  - type: dropdown
    id: action
    attributes:
      label: 작업
      options:
        - 합격
        - 응시 일정 변경
        - 추가
        - 삭제
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 자격증
      description: 목록에 있는 이름 일부만 적어도 찾습니다. 예) CKA
      placeholder: CKA
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 날짜 (선택)
      description: 합격이면 취득일, 일정 변경이면 응시 예정일. 비우면 오늘.
      placeholder: "2026-12-15"
  - type: input
    id: org
    attributes:
      label: 발급 기관 (선택)
      placeholder: 예) CNCF / Linux Foundation
  - type: input
    id: note
    attributes:
      label: 메모 (선택)
      placeholder: 예) 1차 응시
