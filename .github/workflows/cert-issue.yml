# 자격증 이슈(폼) → config/portfolio.yml 의 자격증 목록 수정 PR 자동 생성
# - 저장소 소유자가 연 이슈만 처리(공개 저장소라 다른 사람의 이슈는 무시하고 닫음)
# - 본인이 폼에 적은 값이 설정 파일에 그대로 들어가는 변경이라 PR 생성 후 자동 머지한다
#   (기록은 PR 로 남으므로 잘못되면 그 PR 만 되돌리면 된다)
name: Cert from issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: cert-issue
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.issue.labels.*.name, 'cert')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Only repository owner
        if: github.event.issue.user.login != github.repository_owner
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue close "$NUM" -R "$GITHUB_REPOSITORY" -c "자격증 변경은 저장소 소유자만 할 수 있습니다." --reason "not planned"
          exit 1

      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Update portfolio.yml
        id: upd
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -o pipefail
          python tools/cert_issue.py --config config/portfolio.yml | tail -1 > /tmp/result.json
          echo "summary=$(python -c 'import json;print(json.load(open("/tmp/result.json"))["summary"])')" >> "$GITHUB_OUTPUT"

      - name: Open PR
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          SUMMARY: ${{ steps.upd.outputs.summary }}
        run: |
          branch="cert/issue-$NUM"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add config/portfolio.yml
          git commit -m "자격증: $SUMMARY (#$NUM)"
          git push -u origin "$branch"
          url=$(gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$branch" \
                --title "자격증: $SUMMARY" \
                --body "이슈 #$NUM 의 요청을 config/portfolio.yml 에 반영했습니다. 확인 후 머지하면 다음 배포부터 소개 페이지에 표시됩니다. Closes #$NUM")
          # 설정 파일만 바뀌는 변경이라 바로 머지한다. 실패하면 PR 을 열어 둔 채 알린다.
          if gh pr merge "$url" -R "$GITHUB_REPOSITORY" --squash --delete-branch; then
            gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" -b "반영했습니다($url). 다음 배포(5분 내외)부터 소개 페이지에 표시됩니다."
          else
            gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" -b "PR을 만들었지만 자동 머지에 실패했습니다. 직접 머지해 주세요: $url"
          fi

      - name: Report failure
        if: failure() && github.event.issue.user.login == github.repository_owner
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" -b "처리하지 못했습니다. Actions 로그를 확인해 주세요(자격증 이름이 목록에 없거나 날짜 형식 오류 등): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
