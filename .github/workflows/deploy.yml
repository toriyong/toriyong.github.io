name: Collect & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"      # 매일 07:00 KST
    - cron: "30 7 * * 1-5"    # 평일 16:30 KST (장 마감 후)
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # 수집 실패 시 화면이 비지 않도록, 현재 배포된 원천 데이터를 먼저 받아 둔다
      - name: Fetch previous data
        run: |
          curl -fsS "${{ steps.pages.outputs.base_url }}/market/data/raw_ipo.json" -o /tmp/prev_raw_ipo.json \
            && echo "previous data found" || echo "no previous data"

      - name: Collect IPO filings (DART)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python collect/market/dart_ipo.py \
            --out site/market/data/raw_ipo.json \
            --prev /tmp/prev_raw_ipo.json

      - name: Grade IPOs
        run: |
          python process/market/grade_ipo.py \
            --raw site/market/data/raw_ipo.json \
            --out site/market/data/ipo.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
