name: Collect & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"      # 매일 07:00 KST (아침 브리핑 시간)
    - cron: "30 7 * * 1-5"    # 평일 16:30 KST (장 마감 후)
    - cron: "0 1,4,10,13 * * *"  # 10:00 · 13:00 · 19:00 · 22:00 KST (보안 뉴스 갱신)
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # PR을 연달아 머지하면 대기열에 있던 '이전 커밋' 실행이 나중에 끝나 최신 배포를 덮어쓸 수 있다.
      # 어떤 실행이든 시작 시점의 main 최신 커밋으로 빌드해, 마지막 배포가 항상 최신 코드가 되게 한다.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # 수집 실패 시 화면이 비지 않도록, 현재 배포된 원천 데이터를 먼저 받아 둔다
      - name: Fetch previous data
        run: |
          base="${{ steps.pages.outputs.base_url }}"
          curl -fsS "$base/market/data/raw_ipo.json" -o /tmp/prev_raw_ipo.json && echo "prev ipo ok" || echo "no prev ipo"
          curl -fsS "$base/security/data/secinfra.json" -o /tmp/prev_secinfra.json && echo "prev secinfra ok" || echo "no prev secinfra"
          curl -fsS "$base/market/data/results.json" -o /tmp/prev_results.json && echo "prev results ok" || echo "no prev results"
          curl -fsS "$base/market/data/watchlist.json" -o /tmp/prev_watchlist.json && echo "prev watchlist ok" || echo "no prev watchlist"

      # 본문 다운로드는 스크립트 안에서 시간 예산(기본 300초)으로 끊는다.
      # 그래도 멈추면 이 단계만 9분에 종료하고, 아래 단계에서 직전 데이터로 대체한다.
      - name: Collect IPO filings (DART)
        timeout-minutes: 9
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python collect/market/dart_ipo.py \
            --out site/market/data/raw_ipo.json \
            --prev /tmp/prev_raw_ipo.json

      - name: Grade IPOs
        run: |
          if [ ! -s site/market/data/raw_ipo.json ] && [ -s /tmp/prev_raw_ipo.json ]; then
            echo "DART 수집 결과가 없어 직전 데이터를 사용합니다"
            cp /tmp/prev_raw_ipo.json site/market/data/raw_ipo.json
          fi
          python process/market/grade_ipo.py \
            --raw site/market/data/raw_ipo.json \
            --out site/market/data/ipo.json

      # 성적표: 상장 이력은 직전 results.json 을 이어받아 누적. 주가는 DATA_GO_KR_KEY 가 있을 때만
      - name: IPO results (성적표)
        timeout-minutes: 5
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python collect/market/ipo_results.py \
            --ipo site/market/data/ipo.json \
            --out site/market/data/results.json \
            --prev /tmp/prev_results.json || echo "성적표 수집 실패 → 직전 데이터 사용"
          [ -s site/market/data/results.json ] || cp /tmp/prev_results.json site/market/data/results.json 2>/dev/null || true

      - name: Watchlist (관심종목)
        timeout-minutes: 5
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python collect/market/watchlist.py \
            --out site/market/data/watchlist.json \
            --prev /tmp/prev_watchlist.json || echo "관심종목 수집 실패 → 직전 데이터 사용"
          [ -s site/market/data/watchlist.json ] || cp /tmp/prev_watchlist.json site/market/data/watchlist.json 2>/dev/null || true

      # 보안·인프라: 출처별로 독립 수집, 실패한 출처는 건너뛰고 직전 데이터 유지
      - name: Collect security & infra
        run: |
          python collect/secinfra/collect.py \
            --out site/security/data/secinfra.json \
            --prev /tmp/prev_secinfra.json

      # 브라우저·CDN 캐시 때문에 새 JS와 옛 CSS가 섞여 보이지 않도록 정적 파일 주소에 버전(커밋) 붙이기
      - name: Cache-bust assets
        run: |
          v="${GITHUB_SHA::7}"
          find site -name '*.html' -print0 | xargs -0 sed -i -E \
            -e "s#(href=\"[^\"?]+\.css)\"#\1?v=${v}\"#g" \
            -e "s#(src=\"[^\"?]+\.js)\"#\1?v=${v}\"#g"
          grep -ho '\.\(css\|js\)?v=[0-9a-f]*' site/index.html site/market/index.html | sort -u || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
