name: Collect & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"      # 매일 07:00 KST (아침 브리핑 시간)
    - cron: "30 7 * * 1-5"    # 평일 16:30 KST (장 마감 후)
    - cron: "0 1,4,10,13 * * *"  # 10:00 · 13:00 · 19:00 · 22:00 KST (보안 뉴스 갱신)
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # PR을 연달아 머지하면 대기열에 있던 '이전 커밋' 실행이 나중에 끝나 최신 배포를 덮어쓸 수 있다.
      # 어떤 실행이든 시작 시점의 main 최신 커밋으로 빌드해, 마지막 배포가 항상 최신 코드가 되게 한다.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # 화면·문서만 바뀐 배포에서는 수집기를 돌리지 않는다.
      # (수집은 하루 6회 예약 실행이 맡고, 배포는 직전 데이터를 그대로 올린다)
      - name: Decide collect mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "예약·수동 실행 → 전체 수집"; echo "collect=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          before="${{ github.event.before }}"
          files=""
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$before...${{ github.sha }}" --jq '.files[].filename' 2>/dev/null || echo "")
          fi
          if [ -z "$files" ]; then
            echo "변경 파일을 못 읽음 → 안전하게 전체 수집"; echo "collect=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "변경 파일:"; echo "$files" | sed 's/^/  /'
          # 수집기 자체나 수집 대상 설정이 바뀐 경우에만 전체 수집.
          # config/portfolio.yml·exams.yml·study.example.yml 은 빌드 단계만 쓰므로 제외.
          if echo "$files" | grep -qE '^(collect/|config/(watchlist|secinfra|grading)\.yml|requirements\.txt|\.github/workflows/)'; then
            echo "→ 수집 대상이 바뀌었으므로 전체 수집"; echo "collect=true" >> "$GITHUB_OUTPUT"
          else
            echo "→ 화면·문서만 변경. 수집 건너뛰고 직전 데이터로 배포"; echo "collect=false" >> "$GITHUB_OUTPUT"
          fi

      # 수집 실패 시 화면이 비지 않도록, 현재 배포된 원천 데이터를 먼저 받아 둔다
      - name: Fetch previous data
        run: |
          base="${{ steps.pages.outputs.base_url }}"
          curl -fsS "$base/market/data/raw_ipo.json" -o /tmp/prev_raw_ipo.json && echo "prev ipo ok" || echo "no prev ipo"
          curl -fsS "$base/security/data/secinfra.json" -o /tmp/prev_secinfra.json && echo "prev secinfra ok" || echo "no prev secinfra"
          curl -fsS "$base/market/data/results.json" -o /tmp/prev_results.json && echo "prev results ok" || echo "no prev results"
          curl -fsS "$base/market/data/watchlist.json" -o /tmp/prev_watchlist.json && echo "prev watchlist ok" || echo "no prev watchlist"
          curl -fsS "$base/market/stocks.json" -o /tmp/prev_stocks.json && echo "prev stocks ok" || echo "no prev stocks"
          curl -fsS "$base/market/data/indices.json" -o /tmp/prev_indices.json && echo "prev indices ok" || echo "no prev indices"

      # 본문 다운로드는 스크립트 안에서 시간 예산(기본 300초)으로 끊는다.
      # 그래도 멈추면 이 단계만 9분에 종료하고, 아래 단계에서 직전 데이터로 대체한다.
      - name: Collect IPO filings (DART)
        if: steps.mode.outputs.collect == 'true'
        timeout-minutes: 9
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python collect/market/dart_ipo.py \
            --out site/market/data/raw_ipo.json \
            --prev /tmp/prev_raw_ipo.json

      - name: Grade IPOs
        if: steps.mode.outputs.collect == 'true'
        run: |
          if [ ! -s site/market/data/raw_ipo.json ] && [ -s /tmp/prev_raw_ipo.json ]; then
            echo "DART 수집 결과가 없어 직전 데이터를 사용합니다"
            cp /tmp/prev_raw_ipo.json site/market/data/raw_ipo.json
          fi
          python process/market/grade_ipo.py \
            --raw site/market/data/raw_ipo.json \
            --out site/market/data/ipo.json

      # 성적표: 상장 이력은 직전 results.json 을 이어받아 누적. 주가는 DATA_GO_KR_KEY 가 있을 때만
      - name: IPO results (성적표)
        if: steps.mode.outputs.collect == 'true'
        timeout-minutes: 5
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python collect/market/ipo_results.py \
            --ipo site/market/data/ipo.json \
            --out site/market/data/results.json \
            --prev /tmp/prev_results.json || echo "성적표 수집 실패 → 직전 데이터 사용"
          [ -s site/market/data/results.json ] || cp /tmp/prev_results.json site/market/data/results.json 2>/dev/null || true

      - name: Market indices (주요 지수)
        if: steps.mode.outputs.collect == 'true'
        timeout-minutes: 5
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          cp /tmp/prev_indices.json site/market/data/indices.json 2>/dev/null || true
          python collect/market/indices.py --out site/market/data/indices.json || echo "지수 수집 실패 → 직전 데이터 사용"

      - name: Research targets (증권사 목표가)
        if: steps.mode.outputs.collect == 'true'
        timeout-minutes: 8
        continue-on-error: true
        run: |
          python collect/market/research.py \
            --config config/watchlist.yml \
            --out site/market/data/targets.json || echo "목표가 수집 실패 → 직접 입력값만 사용"

      - name: Watchlist (관심종목)
        if: steps.mode.outputs.collect == 'true'
        timeout-minutes: 5
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python collect/market/watchlist.py \
            --out site/market/data/watchlist.json \
            --targets site/market/data/targets.json \
            --prev /tmp/prev_watchlist.json || echo "관심종목 수집 실패 → 직전 데이터 사용"
          [ -s site/market/data/watchlist.json ] || cp /tmp/prev_watchlist.json site/market/data/watchlist.json 2>/dev/null || true

      - name: Stock list (종목 검색 목록)
        if: steps.mode.outputs.collect == 'true'
        timeout-minutes: 5
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          cp /tmp/prev_stocks.json site/market/stocks.json 2>/dev/null || true
          python collect/market/stock_list.py --out site/market/stocks.json || echo "종목 목록 수집 실패 → 직전 데이터 사용"
          [ -s site/market/stocks.json ] || cp /tmp/prev_stocks.json site/market/stocks.json 2>/dev/null || true

      # 보안·인프라: 출처별로 독립 수집, 실패한 출처는 건너뛰고 직전 데이터 유지
      - name: Collect security & infra
        if: steps.mode.outputs.collect == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}   # 선택: 없으면 공개 한도로 호출
        run: |
          python collect/secinfra/collect.py \
            --out site/security/data/secinfra.json \
            --prev /tmp/prev_secinfra.json

      # 학습 페이지: 시험 일정 + 공부 계획 (공개)
      # 수집을 건너뛴 배포: 현재 배포된 데이터를 그대로 올려 화면이 비지 않게 한다
      - name: Reuse previous data
        if: steps.mode.outputs.collect != 'true'
        run: |
          mkdir -p site/market/data site/security/data
          cp /tmp/prev_raw_ipo.json   site/market/data/raw_ipo.json   2>/dev/null || true
          cp /tmp/prev_results.json   site/market/data/results.json   2>/dev/null || true
          cp /tmp/prev_watchlist.json site/market/data/watchlist.json 2>/dev/null || true
          cp /tmp/prev_indices.json   site/market/data/indices.json   2>/dev/null || true
          cp /tmp/prev_secinfra.json  site/security/data/secinfra.json 2>/dev/null || true
          cp /tmp/prev_stocks.json    site/market/stocks.json         2>/dev/null || true
          curl -fsS "${{ steps.pages.outputs.base_url }}/market/data/ipo.json" -o site/market/data/ipo.json || true
          ls -la site/market/data site/security/data || true

      - name: Build study page
        env:
          STUDY_PLAN: ${{ secrets.STUDY_PLAN }}
        run: python tools/build_study.py --out site/study/data.json

      - name: Build notes (기술 노트)
        run: python tools/build_notes.py --out site/study/notes/data.json

      - name: Build portfolio (소개)
        env:
          STUDY_PLAN: ${{ secrets.STUDY_PLAN }}
        run: python tools/build_portfolio.py --out site/about/data.json

      # 브라우저·CDN 캐시 때문에 새 JS와 옛 CSS가 섞여 보이지 않도록 정적 파일 주소에 버전(커밋) 붙이기
      - name: Cache-bust assets
        run: |
          v="${GITHUB_SHA::7}"
          find site -name '*.html' -print0 | xargs -0 sed -i -E \
            -e "s#(href=\"[^\"?]+\.css)\"#\1?v=${v}\"#g" \
            -e "s#(src=\"[^\"?]+\.js)\"#\1?v=${v}\"#g"
          printf '{"v":"%s"}\n' "$v" > site/version.json
          grep -ho '\.\(css\|js\)?v=[0-9a-f]*' site/index.html site/market/index.html | sort -u || true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
