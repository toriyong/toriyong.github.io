# 정보보안기사 실기 학습 단원 — 직접 정리한 요약·연습문제(기출 원문 아님)
# 단원 구성은 정보보안기사 실기 출제기준(적용 2027.1.1~2029.12.31)에 맞춤
# ※ 법령·고시 수치는 개정될 수 있으니 시험 전 최신 조문을 확인하세요.
exam: eis
units:
  - id: eis-01
    title: "유닉스·윈도우 계정과 권한"
    points:
      - "/etc/passwd 는 7개 필드(계정:패스워드:UID:GID:설명:홈디렉터리:셸), /etc/shadow 는 9개 필드(계정:암호화된 패스워드:최종 변경일:최소·최대 사용기간:경고·비활성·만료일:예약)"
      - "UID 0 인 계정은 root 권한. root 외에 UID 0 계정이 있으면 반드시 점검"
      - "파일 권한은 소유자·그룹·기타 각 rwx(4·2·1). umask 022 이면 파일 644, 디렉터리 755 로 생성"
      - "특수 권한: SUID 4000(실행 시 소유자 권한), SGID 2000(그룹 권한), Sticky bit 1000(공용 디렉터리에서 소유자만 삭제, 예 /tmp)"
      - "SUID 파일 점검: find / -user root -perm -4000 -print"
      - "패스워드 정책: /etc/login.defs(PASS_MAX_DAYS, PASS_MIN_LEN), PAM(pam_tally2·pam_faillock 으로 실패 횟수 잠금)"
      - "윈도우: SID 끝 500 은 Administrator, 501 은 Guest. SAM 파일에 계정 해시 저장, 인증은 LSA·SAM·SRM 이 담당"
      - "root 원격 접속 제한: /etc/ssh/sshd_config 의 PermitRootLogin no, 텔넷은 /etc/securetty 에서 pts 제거"
    quiz:
      - q: "umask 가 027 일 때 새로 만든 파일과 디렉터리의 권한은?"
        a: "파일 640(666-027), 디렉터리 750(777-027)"
      - q: "SUID 가 설정된 root 소유 파일이 위험한 이유와 찾는 명령을 쓰시오."
        a: "실행하는 동안 일반 사용자가 root 권한을 얻으므로 취약한 프로그램이면 권한 상승에 악용된다. find / -user root -perm -4000 -print"
      - q: "/tmp 디렉터리에 Sticky bit 를 설정하는 이유는?"
        a: "누구나 쓸 수 있는 공용 디렉터리에서 파일 소유자(와 root)만 삭제·이름 변경을 할 수 있게 하기 위해서(chmod 1777 /tmp)"

  - id: eis-02
    title: "유닉스 로그와 시스템 점검"
    points:
      - "utmp: 현재 로그인 사용자(who, w) / wtmp: 로그인·로그아웃·재부팅 이력(last) / btmp: 로그인 실패(lastb) / lastlog: 계정별 마지막 로그인"
      - "sulog: su 명령 사용 기록(+ 성공, - 실패) / secure(auth.log): 인증 관련 / xferlog: FTP 전송 기록 / pacct: 실행 명령 기록(lastcomm)"
      - "syslog 설정 형식: facility.priority action (예: authpriv.* /var/log/secure). 우선순위는 emerg > alert > crit > err > warning > notice > info > debug"
      - "cron 형식: 분 시 일 월 요일 명령. /etc/cron.allow 가 있으면 그 목록만 허용, 없으면 cron.deny 에 없는 사용자 허용"
      - "무결성 점검 도구 tripwire: 파일 해시 DB 를 만들어 변경 여부 비교"
      - "TCP Wrapper: /etc/hosts.allow 를 먼저, 그다음 /etc/hosts.deny 적용. 기본 차단은 hosts.deny 에 ALL:ALL"
      - "불필요한 서비스는 inetd/xinetd 또는 systemctl disable 로 중지. r 계열 명령(rlogin, rsh)과 .rhosts, hosts.equiv 의 '+' 설정은 제거"
    quiz:
      - q: "로그인 실패 기록을 담는 파일과 확인 명령은?"
        a: "btmp 파일, lastb 명령"
      - q: "crontab 항목 '0 2 * * 0 /root/backup.sh' 의 의미는?"
        a: "매주 일요일 02시 00분에 /root/backup.sh 실행"
      - q: "TCP Wrapper 로 192.168.1.10 에서만 sshd 를 허용하려면?"
        a: "hosts.allow 에 'sshd : 192.168.1.10', hosts.deny 에 'ALL : ALL'(allow 가 먼저 적용됨)"

  - id: eis-03
    title: "시스템 공격과 대응"
    points:
      - "버퍼 오버플로우: 경계 검사 없이 입력을 복사해 스택의 복귀 주소(RET)를 덮어쓰는 공격. 취약 함수 strcpy, strcat, gets, sprintf, scanf"
      - "대응: 안전한 함수(strncpy, fgets, snprintf), 스택 가드(카나리), 스택 실드(RET 복사본 비교), ASLR(주소 무작위화), DEP/NX(스택 실행 금지)"
      - "포맷 스트링: printf(buf) 처럼 입력을 포맷으로 쓰면 %x 로 메모리 읽기, %n 으로 쓰기 가능. 대응은 printf(\"%s\", buf)"
      - "레이스 컨디션: SUID 프로그램이 임시 파일을 만들 때 그 사이에 심볼릭 링크로 바꿔치기. 대응은 임시 파일 생성 전 링크 검사, 예측 불가능한 이름, O_EXCL 사용"
      - "백도어·루트킷: 정상 명령(ps, ls, netstat)을 변조해 흔적을 숨김. 무결성 점검과 chkrootkit·rkhunter 로 확인"
      - "패스워드 크래킹: 사전 공격, 무차별 대입, 레인보우 테이블(미리 계산한 해시표). 솔트(salt)를 쓰면 레인보우 테이블이 무력화"
      - "리버스 셸: 내부 서버가 외부 공격자로 접속을 여는 방식이라 인바운드 방화벽을 우회. 아웃바운드 정책으로 통제"
    quiz:
      - q: "ASLR 과 DEP 를 각각 한 줄로 설명하시오."
        a: "ASLR: 스택·힙·라이브러리 주소를 실행할 때마다 무작위로 배치해 공격자가 주소를 예측하지 못하게 함. DEP(NX): 스택·힙 같은 데이터 영역에서 코드 실행을 막음"
      - q: "패스워드 저장 시 솔트를 쓰는 이유는?"
        a: "같은 패스워드라도 해시가 달라지게 해 레인보우 테이블과 사전 계산 공격을 어렵게 하기 위해"
      - q: "레이스 컨디션 공격이 성립하는 조건 두 가지는?"
        a: "SUID 등 높은 권한으로 실행되는 프로그램일 것, 실행 중 임시 파일을 만들고 그 이름을 공격자가 예측할 수 있을 것"

  - id: eis-04
    title: "네트워크 기초와 스캐닝"
    points:
      - "TCP 3-way handshake: SYN → SYN+ACK → ACK. 종료는 4-way(FIN, ACK, FIN, ACK)"
      - "TCP Connect 스캔(-sT): 연결을 완성하므로 로그가 남음. SYN 스캔(-sS, half-open): SYN+ACK 를 받으면 RST 로 끊어 로그가 덜 남음"
      - "FIN·NULL·Xmas 스캔: 열린 포트는 응답 없음, 닫힌 포트는 RST 응답(스텔스 스캔)"
      - "UDP 스캔(-sU): 닫힌 포트는 ICMP Port Unreachable, 열린 포트는 응답 없음(또는 UDP 응답)"
      - "ACK 스캔(-sA): 포트 개폐가 아니라 방화벽의 필터링 여부를 확인"
      - "ICMP 주요 타입: 0 Echo Reply, 3 Destination Unreachable, 5 Redirect, 8 Echo Request, 11 Time Exceeded(traceroute 가 이용)"
      - "주요 포트: FTP 20·21, SSH 22, Telnet 23, SMTP 25, DNS 53, HTTP 80, POP3 110, NTP 123, SNMP 161·162, HTTPS 443, RDP 3389"
    quiz:
      - q: "SYN 스캔에서 열린 포트와 닫힌 포트의 응답은?"
        a: "열린 포트: SYN+ACK(스캐너는 RST 로 종료). 닫힌 포트: RST+ACK"
      - q: "Xmas 스캔이 보내는 플래그와 열린 포트의 반응은?"
        a: "FIN, PSH, URG 플래그를 설정해 전송. 열린 포트는 응답 없음, 닫힌 포트는 RST"
      - q: "traceroute 가 경로를 알아내는 원리는?"
        a: "TTL 을 1 부터 늘려 보내면 각 라우터가 TTL 만료 시 ICMP Time Exceeded(타입 11)를 돌려주는 것을 이용"

  - id: eis-05
    title: "네트워크 공격(DoS·스푸핑·스니핑)"
    points:
      - "SYN Flooding: 위조 출발지로 SYN 만 대량 전송해 백로그 큐를 고갈. 대응은 SYN Cookie, 백로그 큐 확대, 임계치 설정"
      - "Smurf: 출발지를 피해자로 위조한 ICMP Echo Request 를 브로드캐스트 주소로 전송. 대응은 Directed Broadcast 차단"
      - "Land: 출발지와 목적지 IP·포트를 같게 / Ping of Death: 규격보다 큰 ICMP 패킷 / Teardrop: 조각 오프셋을 겹치게 조작"
      - "Slowloris: HTTP 헤더 끝(빈 줄)을 보내지 않고 연결 유지 / RUDY: 큰 Content-Length 로 본문을 아주 느리게 전송 / Slow Read: 윈도우 크기를 작게 해 느리게 수신"
      - "DRDoS: 출발지를 피해자로 위조해 DNS·NTP·SSDP·Memcached 서버에 질의, 증폭된 응답이 피해자로 향함"
      - "ARP 스푸핑: 위조 ARP Reply 로 게이트웨이 MAC 을 공격자 MAC 으로 바꿈. 대응은 정적 ARP(arp -s), ARP 감시"
      - "스니핑 탐지: 무차별(promiscuous) 모드 여부 확인(ifconfig 의 PROMISC), 가짜 MAC 으로 ping 을 보내 응답하는지 확인"
      - "세션 하이재킹: TCP 시퀀스 번호를 추측해 세션 탈취. 대응은 암호화 통신(SSH, TLS)"
    quiz:
      - q: "Slowloris 공격의 원리와 대응을 쓰시오."
        a: "HTTP 요청 헤더의 끝을 알리는 빈 줄(CRLF CRLF)을 보내지 않고 헤더를 조금씩 보내 연결을 오래 점유한다. 대응: 연결 타임아웃 단축, IP 당 동시 연결 수 제한, 웹 방화벽·부하분산 장비에서 차단"
      - q: "DRDoS 가 일반 DDoS 보다 추적이 어려운 이유는?"
        a: "공격 트래픽이 정상 서버(반사 서버)에서 오고, 공격자는 출발지 IP 를 피해자로 위조하기 때문"
      - q: "ARP 스푸핑을 막는 설정 한 가지는?"
        a: "게이트웨이 MAC 을 정적으로 등록(arp -s IP MAC)하거나 스위치의 Dynamic ARP Inspection 사용"

  - id: eis-06
    title: "보안 장비(방화벽·IDS/IPS·Snort·iptables)"
    points:
      - "방화벽 유형: 패킷 필터링(3·4계층), 상태 기반 검사(Stateful, 세션 상태 추적), 애플리케이션 게이트웨이(프록시), 스크린드 서브넷(DMZ 구성)"
      - "IDS 탐지 방식: 오용 탐지(시그니처 기반, 오탐 낮지만 새 공격 미탐) / 이상 탐지(정상 행위 기준, 제로데이 탐지 가능하지만 오탐 높음)"
      - "오탐(False Positive): 정상을 공격으로 판단 / 미탐(False Negative): 공격을 놓침"
      - "NIDS 는 네트워크 구간 전체를 감시(암호화 트래픽 분석 어려움), HIDS 는 호스트의 로그·파일 변경 감시"
      - "Snort 룰: 액션 프로토콜 출발IP 출발포트 -> 목적IP 목적포트 (옵션). 예: alert tcp any any -> 192.168.1.0/24 80 (msg:'web attack'; content:'/etc/passwd'; nocase; sid:1000001;)"
      - "Snort 옵션: content(문자열), nocase(대소문자 무시), offset·depth(검사 시작 위치·범위), threshold(횟수 임계), flags(TCP 플래그)"
      - "iptables: 체인 INPUT·OUTPUT·FORWARD, 정책 ACCEPT·DROP·REJECT. 예: iptables -A INPUT -p tcp -s 192.168.1.0/24 --dport 22 -j ACCEPT"
      - "그 밖의 장비: WAF(웹 공격 차단), NAC(단말 접근 통제), ESM·SIEM(로그 통합 분석), DLP(정보 유출 방지), UTM(통합 위협 관리)"
    quiz:
      - q: "오용 탐지와 이상 탐지의 장단점을 비교하시오."
        a: "오용 탐지: 알려진 공격 패턴과 비교하므로 오탐이 낮지만 새로운 공격은 못 잡는다. 이상 탐지: 정상 행위에서 벗어난 것을 탐지해 알려지지 않은 공격도 잡지만 오탐이 높다"
      - q: "외부에서 들어오는 텔넷(23/tcp)을 차단하는 iptables 규칙을 쓰시오."
        a: "iptables -A INPUT -p tcp --dport 23 -j DROP"
      - q: "Snort 룰에서 depth 와 offset 의 의미는?"
        a: "offset: 페이로드에서 검사를 시작할 위치, depth: 그 위치부터 검사할 바이트 수"

  - id: eis-07
    title: "VPN·TLS·무선 보안"
    points:
      - "IPsec AH: 인증·무결성(암호화 없음) / ESP: 기밀성 + 인증·무결성"
      - "전송 모드: IP 페이로드만 보호(종단 간) / 터널 모드: IP 패킷 전체를 보호하고 새 IP 헤더 추가(게이트웨이 간)"
      - "IKE 로 키를 교환하고 SA(Security Association)를 맺음. SA 는 단방향이라 양방향 통신에 2개 필요"
      - "SSL/TLS 하위 프로토콜: Handshake(협상·인증·키 교환), Change Cipher Spec(암호 적용 통지), Alert(오류 통지), Record(분할·압축·MAC·암호화)"
      - "TLS 취약점: Heartbleed(OpenSSL 하트비트 길이 미검증으로 메모리 노출), POODLE(SSL 3.0 CBC 패딩), FREAK·Logjam(수출용 약한 키로 다운그레이드), DROWN(SSLv2)"
      - "무선: WEP(RC4, 24비트 IV 재사용으로 취약), WPA(TKIP), WPA2(AES-CCMP), WPA3(SAE 로 사전 공격 방어)"
      - "무선 위협: Rogue AP, Evil Twin, 디오스(인증 해제 프레임). 대응은 WIPS, 802.1X(EAP) 인증"
    quiz:
      - q: "IPsec 터널 모드와 전송 모드의 차이는?"
        a: "전송 모드는 IP 헤더를 그대로 두고 페이로드만 보호한다. 터널 모드는 원래 IP 패킷 전체를 보호하고 새 IP 헤더를 붙인다(VPN 게이트웨이 간에 사용)"
      - q: "WEP 가 취약한 핵심 이유는?"
        a: "IV 가 24비트로 짧아 재사용되고 RC4 키 스트림이 노출되어 키를 복구할 수 있기 때문"
      - q: "Heartbleed 취약점을 한 문장으로 설명하시오."
        a: "OpenSSL 하트비트 요청의 길이 값을 검증하지 않아 서버 메모리(개인키, 세션 정보 등)가 응답에 섞여 유출되는 취약점"

  - id: eis-08
    title: "웹 애플리케이션 보안"
    points:
      - "SQL 인젝션: 입력값이 쿼리 구조를 바꿈. 대응은 Prepared Statement(바인딩), 입력 검증, DB 계정 최소 권한, 오류 메시지 노출 금지"
      - "Blind SQL 인젝션: 참·거짓 응답 차이나 시간 지연으로 한 글자씩 알아냄"
      - "XSS: Stored(저장형), Reflected(반사형), DOM 기반. 대응은 출력 시 HTML 엔티티 인코딩(< → &lt;), HttpOnly 쿠키, CSP"
      - "CSRF: 로그인한 사용자의 권한으로 원치 않는 요청을 보내게 함. 대응은 CSRF 토큰, Referer 검증, 중요 기능 재인증"
      - "파일 업로드: 웹셸 업로드 위험. 대응은 확장자 화이트리스트, 업로드 디렉터리 실행 권한 제거, 웹 루트 밖 저장, 파일명 난수화"
      - "파일 다운로드·경로 조작: ../ 로 상위 경로 접근. 대응은 경로 문자 필터링, 파일 식별자 사용"
      - "서버 설정: 디렉터리 리스팅 차단(Apache Options -Indexes), 버전 정보 숨김(ServerTokens Prod), 불필요한 메서드(PUT, DELETE, TRACE) 제한"
      - "쿠키 보안 속성: Secure(HTTPS 에서만 전송), HttpOnly(스크립트 접근 차단), SameSite(교차 사이트 전송 제한)"
    quiz:
      - q: "XSS 와 CSRF 의 차이를 설명하시오."
        a: "XSS 는 악성 스크립트가 피해자 브라우저에서 실행되는 공격(사용자가 사이트를 신뢰). CSRF 는 피해자의 인증된 세션으로 서버에 위조 요청을 보내는 공격(사이트가 사용자를 신뢰)"
      - q: "파일 업로드 취약점 대응 방법 3가지를 쓰시오."
        a: "허용 확장자만 받는 화이트리스트 검증, 업로드 디렉터리의 스크립트 실행 권한 제거, 저장 파일명을 난수로 바꾸고 웹 루트 밖에 저장"
      - q: "Prepared Statement 가 SQL 인젝션을 막는 원리는?"
        a: "쿼리 구조를 먼저 컴파일하고 입력값은 데이터로만 바인딩하므로 입력에 SQL 구문이 있어도 실행되지 않는다"

  - id: eis-09
    title: "DNS·메일·FTP 보안"
    points:
      - "DNS 캐시 포이즈닝: 위조 응답을 캐시에 넣어 가짜 사이트로 유도. 대응은 DNSSEC(응답에 전자서명), 출발 포트·트랜잭션 ID 무작위화"
      - "존 트랜스퍼는 보조 DNS 에만 허용(allow-transfer). 재귀 질의는 내부에만 허용(allow-recursion)해 DNS 증폭 공격 악용 방지"
      - "DNS 는 보통 53/udp, 응답이 크거나 존 트랜스퍼일 때 53/tcp"
      - "메일 인증: SPF(발신 서버 IP 를 DNS 로 검증), DKIM(메일에 전자서명), DMARC(SPF·DKIM 실패 시 처리 정책)"
      - "메일 암호화: PGP(신뢰망 기반), S/MIME(인증서 기반). 스팸 대응 도구 SpamAssassin, 릴레이는 내부만 허용"
      - "FTP Active: 서버 20번 포트가 클라이언트로 데이터 연결 / Passive: 서버가 임의 포트를 열고 클라이언트가 접속"
      - "FTP 위협: Bounce 공격(PORT 명령 악용), Anonymous 허용, 평문 전송. tftp(69/udp)는 인증이 없어 사용 금지 권장. 대안은 SFTP·FTPS"
    quiz:
      - q: "SPF, DKIM, DMARC 를 각각 한 줄로 설명하시오."
        a: "SPF: 도메인의 DNS 에 등록된 발신 서버 IP 와 비교해 발신 서버 검증. DKIM: 발신 도메인의 개인키로 메일에 서명하고 수신 측이 DNS 의 공개키로 검증. DMARC: SPF·DKIM 검증 실패 메일의 처리(none, quarantine, reject)와 보고 정책"
      - q: "FTP Passive 모드에서 데이터 연결은 누가 시작하는가?"
        a: "클라이언트가 서버가 알려 준 임의 포트(1024 이상)로 접속한다"
      - q: "DNS 증폭 공격에 자기 DNS 서버가 악용되지 않게 하려면?"
        a: "외부에 재귀 질의를 허용하지 않도록 설정(오픈 리졸버 금지)하고 응답 속도 제한(RRL)을 적용"

  - id: eis-10
    title: "암호학과 PKI"
    points:
      - "대칭키: DES(56비트), 3DES, AES(128·192·256), 국산 SEED·ARIA·LEA. 빠르지만 키 분배가 문제. n명이 쓰면 키 n(n-1)/2 개"
      - "블록 암호 운용 모드: ECB(같은 평문 → 같은 암호문, 패턴 노출), CBC(IV 사용, 이전 블록과 XOR), CFB·OFB·CTR(스트림처럼 동작)"
      - "공개키: RSA(소인수분해), ElGamal·DH(이산대수), ECC(타원곡선, 짧은 키로 같은 강도). n명이면 키 2n 개"
      - "Diffie-Hellman 은 키 교환 방식이며 상대 인증이 없어 중간자 공격에 취약"
      - "해시 함수 성질: 역상 저항성, 제2 역상 저항성(약한 충돌 내성), 충돌 저항성(강한 충돌 내성). MD5·SHA-1 은 사용 지양, SHA-2·SHA-3 권장"
      - "MAC·HMAC: 무결성 + 메시지 인증(대칭키 공유). 부인 방지는 제공하지 못함"
      - "전자서명: 송신자 개인키로 서명, 송신자 공개키로 검증 → 인증·무결성·부인 방지 제공(기밀성은 없음)"
      - "PKI: CA(인증서 발급), RA(신원 확인·등록), CRL(폐지 목록), OCSP(실시간 상태 확인). 인증서 표준은 X.509"
    quiz:
      - q: "10명이 서로 대칭키로 통신할 때 필요한 키 개수와 공개키 방식의 키 개수는?"
        a: "대칭키 45개(10×9/2), 공개키 방식 20개(각자 공개키·개인키 한 쌍)"
      - q: "전자서명이 제공하는 보안 서비스 3가지와 제공하지 않는 것은?"
        a: "제공: 인증, 무결성, 부인 방지. 제공하지 않음: 기밀성"
      - q: "ECB 모드의 문제점은?"
        a: "같은 평문 블록이 항상 같은 암호문 블록이 되어 데이터 패턴이 드러나고 블록 재배열·재전송 공격에 약하다"

  - id: eis-11
    title: "접근 통제와 인증"
    points:
      - "접근 통제 정책: MAC(보안 등급 기반 강제), DAC(소유자가 권한 부여, ACL), RBAC(역할 기반, 인사 이동에 유리)"
      - "BLP 모델(기밀성): No Read Up, No Write Down / Biba 모델(무결성): No Read Down, No Write Up"
      - "Clark-Wilson(무결성, 직무 분리와 잘 정의된 트랜잭션), 만리장성(Chinese Wall, 이해 충돌 방지)"
      - "인증 요소: 지식(패스워드), 소유(OTP, 스마트카드), 존재·행위(생체). 서로 다른 요소 2개 이상이 다중 인증"
      - "생체 인증 지표: FRR(본인 거부율), FAR(타인 수락율), CER(둘이 같아지는 지점, 낮을수록 우수)"
      - "커버로스: 대칭키 기반 티켓 인증. KDC = AS(인증, TGT 발급) + TGS(서비스 티켓 발급). 타임스탬프로 재전송 공격 방지, 시간 동기화 필요"
      - "SSO: 한 번 인증으로 여러 시스템 이용. 편리하지만 단일 실패 지점이 될 수 있음"
      - "접근 통제 원칙: 최소 권한, 직무 분리, 알 필요성(Need to Know)"
    quiz:
      - q: "BLP 모델의 두 가지 속성을 쓰시오."
        a: "단순 보안 속성(No Read Up: 자신보다 높은 등급을 읽지 못함), 스타(*) 속성(No Write Down: 자신보다 낮은 등급에 쓰지 못함)"
      - q: "커버로스에서 재전송 공격을 막는 수단은?"
        a: "티켓과 인증자에 포함된 타임스탬프(유효 시간). 그래서 서버 간 시간 동기화가 필요하다"
      - q: "FAR 과 FRR 중 보안이 중요한 시스템에서 더 낮춰야 하는 것은?"
        a: "FAR(타인 수락율). 권한 없는 사람을 통과시키는 오류이기 때문"

  - id: eis-12
    title: "악성코드와 침해사고 대응"
    points:
      - "바이러스(숙주 필요, 자기 복제), 웜(네트워크로 스스로 전파), 트로이 목마(정상 프로그램 위장, 자기 복제 없음), 랜섬웨어(파일 암호화 후 금전 요구)"
      - "APT: 특정 대상을 장기간 노리는 지능형 공격. 침투 → 탐색 → 수집 → 유출 단계. 스피어 피싱·워터링 홀이 주 침투 경로"
      - "사이버 킬 체인 7단계: 정찰 → 무기화 → 전달 → 익스플로잇 → 설치 → 명령·제어(C2) → 목적 달성"
      - "침해사고 대응 7단계: 사고 전 준비 → 사고 탐지 → 초기 대응 → 대응 전략 체계화 → 사고 조사 → 보고서 작성 → 해결"
      - "디지털 포렌식 원칙: 정당성, 재현, 신속성, 연계 보관성(Chain of Custody), 무결성"
      - "휘발성 높은 순서로 수집: 레지스터·캐시 → 메모리 → 네트워크 연결·프로세스 → 디스크 → 백업 매체"
      - "랜섬웨어 대응: 오프라인 포함 정기 백업, 패치, 메일 첨부·매크로 차단, 망 분리, 최소 권한"
      - "드라이브 바이 다운로드: 취약한 브라우저로 접속만 해도 악성코드 설치. 공급망 공격: 정상 업데이트·라이브러리에 악성코드 삽입"
    quiz:
      - q: "포렌식의 연계 보관성 원칙이란?"
        a: "증거의 획득 → 이송 → 분석 → 보관 → 법정 제출까지 각 단계의 담당자와 인수인계 과정을 기록해 증거가 변조되지 않았음을 보이는 것"
      - q: "웜과 바이러스의 가장 큰 차이는?"
        a: "바이러스는 다른 파일(숙주)에 기생해 퍼지고, 웜은 숙주 없이 네트워크를 통해 스스로 전파된다"
      - q: "휘발성 증거를 먼저 수집해야 하는 이유는?"
        a: "메모리·네트워크 연결 정보는 전원을 끄거나 시간이 지나면 사라지므로 디스크보다 먼저 확보해야 한다"

  - id: eis-13
    title: "위험 관리와 업무 연속성"
    points:
      - "위험 = 자산 × 위협 × 취약점. 위험 관리는 자산 식별 → 위험 분석 → 위험 평가 → 대책 선정 순"
      - "정량 분석: SLE(단일 손실 예상액) = 자산 가치 × 노출 계수, ALE(연간 손실 예상액) = SLE × ARO(연간 발생률)"
      - "정성 분석: 델파이법(전문가 의견), 시나리오법, 순위 결정법, 퍼지 행렬법"
      - "위험 분석 접근법: 기준선(체크리스트), 비정형(전문가 판단), 상세 위험 분석, 복합 접근법"
      - "위험 처리 전략: 수용, 감소(완화), 회피, 전가(보험·외주)"
      - "DoA(수용 가능한 위험 수준)를 경영진이 정하고, 그 이상인 위험에 대책 적용. 남은 위험이 잔여 위험"
      - "BCP 5단계: 범위 설정·기획 → 업무 영향 분석(BIA) → 복구 전략 개발 → 복구 계획 수립 → 테스트·유지보수"
      - "RTO(복구 목표 시간), RPO(복구 목표 시점). 재해 복구 사이트: 미러(즉시), 핫(수 시간), 웜(수일), 콜드(수주)"
    quiz:
      - q: "자산 가치 1억 원, 노출 계수 30%, 연간 발생률 0.5 일 때 ALE 는?"
        a: "SLE = 1억 × 0.3 = 3,000만 원, ALE = 3,000만 × 0.5 = 1,500만 원"
      - q: "위험 처리 전략 4가지를 예와 함께 쓰시오."
        a: "수용(위험이 DoA 이하라 그대로 둠), 감소(보안 대책 적용), 회피(위험한 사업·서비스 중단), 전가(보험 가입, 외부 위탁)"
      - q: "RTO 와 RPO 의 차이는?"
        a: "RTO 는 장애 후 서비스를 복구해야 하는 목표 시간, RPO 는 데이터를 어느 시점까지 복구할지(허용 가능한 데이터 손실 범위)"

  - id: eis-14
    title: "정보보호 관리체계(ISMS-P)"
    points:
      - "ISMS-P 인증 기준 3영역: 관리체계 수립 및 운영(16개), 보호대책 요구사항(64개), 개인정보 처리 단계별 요구사항(21개) — 총 101개. ISMS 만 받으면 앞의 두 영역 80개"
      - "관리체계 수립 및 운영 4분야: 관리체계 기반 마련 → 위험 관리 → 관리체계 운영 → 관리체계 점검 및 개선(PDCA)"
      - "인증 유효 기간 3년. 매년 사후 심사, 3년마다 갱신 심사"
      - "정책 기관은 과학기술정보통신부·개인정보보호위원회, 인증 기관은 KISA·금융보안원 등"
      - "경영진 참여, 최고책임자(CISO·CPO) 지정, 조직 구성, 범위 설정, 정책 수립이 기반 마련 단계의 핵심"
      - "정보보호 정책 문서 체계: 정책 → 지침 → 절차 → 매뉴얼. 정책은 경영진 승인 후 임직원에게 공표"
      - "그 밖의 기준: ISO/IEC 27001(국제 표준), CC(공통평가기준, EAL1~7), 클라우드 보안 인증(CSAP)"
    quiz:
      - q: "ISMS-P 인증 기준의 3개 영역을 쓰시오."
        a: "관리체계 수립 및 운영, 보호대책 요구사항, 개인정보 처리 단계별 요구사항"
      - q: "ISMS-P 인증 유효 기간과 심사 종류는?"
        a: "유효 기간 3년. 최초 심사, 사후 심사(매년), 갱신 심사(3년 주기)"
      - q: "정보보호 정책이 효력을 가지려면 필요한 절차는?"
        a: "이해관계자 검토 후 최고경영자(경영진)의 승인을 받고 임직원과 관련자에게 이해하기 쉬운 형태로 공표"

  - id: eis-15
    title: "개인정보보호 법규"
    points:
      - "개인정보: 살아 있는 개인을 알아볼 수 있는 정보(다른 정보와 쉽게 결합해 알아볼 수 있는 것 포함). 가명정보는 추가 정보 없이는 특정 개인을 알아볼 수 없게 처리한 정보"
      - "동의 받을 때 알릴 사항 4가지: 수집·이용 목적, 수집 항목, 보유·이용 기간, 동의 거부 권리와 거부 시 불이익"
      - "고유식별정보: 주민등록번호, 여권번호, 운전면허번호, 외국인등록번호. 주민등록번호는 법령 근거가 있을 때만 처리"
      - "민감정보: 사상·신념, 노동조합·정당 가입, 정치적 견해, 건강, 성생활, 유전정보, 범죄경력, 생체인식정보, 인종·민족 정보"
      - "유출 시 정보주체에게 지체 없이(72시간 이내) 통지: 유출 항목, 시점과 경위, 피해 최소화 방법, 대응 조치, 담당 부서·연락처"
      - "안전성 확보 조치: 내부 관리계획, 접근 권한 관리, 접근 통제, 암호화, 접속 기록 보관·점검, 악성프로그램 방지, 물리적 안전 조치"
      - "암호화 대상: 비밀번호는 일방향(해시) 암호화, 고유식별정보·생체인식정보는 안전한 알고리즘으로 암호화, 전송 구간 암호화"
      - "접속 기록은 1년 이상 보관(5만 명 이상 처리, 고유식별·민감정보 처리 시 2년 이상)하고 월 1회 이상 점검"
    quiz:
      - q: "개인정보 수집 동의를 받을 때 알려야 할 4가지는?"
        a: "수집·이용 목적, 수집하려는 항목, 보유 및 이용 기간, 동의를 거부할 권리가 있다는 사실과 거부에 따른 불이익"
      - q: "고유식별정보 4가지를 쓰시오."
        a: "주민등록번호, 여권번호, 운전면허번호, 외국인등록번호"
      - q: "비밀번호를 일방향 암호화해야 하는 이유는?"
        a: "저장된 값에서 원래 비밀번호를 복원할 수 없게 해, DB 가 유출되어도 비밀번호가 노출되지 않도록 하기 위해(솔트를 함께 사용)"

  # ---- 2027~2029 출제기준(실기)에 새로 명시된 항목 ----
  - id: eis-16
    title: "클라우드·가상화·API 보안 (2027 출제기준 신규)"
    points:
      - "서비스 모델: IaaS(가상 서버·네트워크), PaaS(실행 환경), SaaS(애플리케이션). 책임 공유 모델 — 사업자는 클라우드 '자체'의 보안, 이용자는 클라우드 '안'의 보안(데이터, 계정, 설정)을 책임"
      - "VPC: 클라우드 안의 논리적으로 격리된 사설 네트워크. 서브넷(공인·사설), 라우팅 테이블, 게이트웨이로 구성"
      - "Security Group(NCP 는 ACG): 서버(인스턴스) 단위, 상태 저장(Stateful, 응답 트래픽 자동 허용), 허용 규칙 중심 / Network ACL: 서브넷 단위, 상태 비저장(Stateless, 인·아웃 각각 규칙 필요), 허용·거부 모두 가능"
      - "하이퍼바이저: Type 1(베어메탈, 하드웨어 위에서 직접 실행 — ESXi, Hyper-V, Xen), Type 2(호스트 OS 위 — VirtualBox, VMware Workstation). 위협은 VM 탈출(VM Escape), 하이퍼바이저 취약점"
      - "컨테이너는 호스트 커널을 공유. 대응: 이미지 취약점 스캔, root 실행 금지, 최소 권한, 신뢰할 수 있는 레지스트리"
      - "클라우드 보안 도구: CASB(클라우드 접근 보안 중개), CSPM(설정 오류 점검), CWPP(워크로드 보호)"
      - "OWASP API Security Top 10(2023) 상위 항목: 객체 수준 인가 실패(BOLA), 인증 실패, 객체 속성 수준 인가 실패, 무제한 자원 소비, 기능 수준 인가 실패"
      - "REST API 보안: 토큰(OAuth 2.0, JWT) 인증, 요청마다 인가 검사, 호출 횟수 제한(Rate Limiting), 입력 검증, TLS, API 목록(인벤토리) 관리"
    quiz:
      - q: "Security Group 과 Network ACL 의 차이를 3가지 쓰시오."
        a: "적용 단위: Security Group 은 서버(인스턴스), NACL 은 서브넷. 상태: Security Group 은 상태 저장(응답 자동 허용), NACL 은 상태 비저장(인바운드·아웃바운드 각각 설정). 규칙: Security Group 은 허용 규칙 중심, NACL 은 허용과 거부 모두 설정"
      - q: "BOLA(객체 수준 인가 실패) 취약점과 대응을 설명하시오."
        a: "API 요청의 객체 식별자(예: /orders/123 의 123)를 다른 값으로 바꾸면 남의 데이터에 접근되는 취약점. 대응: 요청마다 로그인 사용자가 해당 객체의 소유자·권한자인지 서버에서 인가 검사, 추측하기 어려운 식별자 사용"
      - q: "클라우드 책임 공유 모델에서 IaaS 이용자가 책임지는 것 3가지는?"
        a: "게스트 운영체제 패치와 보안 설정, 계정·접근 권한(IAM) 관리, 데이터 암호화와 방화벽(Security Group) 설정"

  - id: eis-17
    title: "네트워크·보안 장비 운영 (VLAN·NAT·SNMP·ACL·EDR)"
    points:
      - "VLAN: 스위치에서 논리적으로 브로드캐스트 도메인을 분리. VLAN 호핑 공격(스위치 스푸핑, 이중 태깅) 대응은 미사용 포트 비활성, 트렁크 자동 협상(DTP) 끄기, 네이티브 VLAN 변경"
      - "NAT 종류: Static NAT(사설 1 : 공인 1 고정), Dynamic NAT(공인 주소 풀에서 할당), PAT(포트로 구분해 여러 사설 주소가 공인 1개 공유)"
      - "SNMP: 161/udp(질의), 162/udp(트랩). v1·v2c 는 커뮤니티 문자열이 평문 — 기본값 public·private 변경, 접근 IP 제한, 가능하면 v3(인증·암호화) 사용"
      - "라우터 ACL: Standard(1~99, 출발지 IP 만), Extended(100~199, 출발·목적 IP·프로토콜·포트). 위에서부터 순서대로 적용, 마지막에 암묵적 deny any"
      - "ACL 예: access-list 101 deny tcp any host 10.1.1.1 eq 23 / access-list 101 permit ip any any → 인터페이스에 ip access-group 101 in"
      - "EPP(백신): 알려진 악성코드를 시그니처 등으로 사전 차단(예방) / EDR: 단말 행위를 계속 기록·분석해 침해를 탐지하고 격리·조사(탐지와 대응)"
      - "Anti-DDoS: 임계치·행위 기반으로 공격 트래픽을 걸러 내고 정상 트래픽만 전달 / Anti-APT: 의심 파일을 샌드박스(가상 환경)에서 실행해 행위 분석"
      - "네트워크 장비 관리자 보안: 기본 계정·비밀번호 변경, enable secret 사용, 텔넷 대신 SSH, VTY 접근 IP 제한, 세션 타임아웃"
    quiz:
      - q: "EPP 와 EDR 의 차이를 설명하시오."
        a: "EPP 는 시그니처 등으로 알려진 위협이 단말에서 실행되기 전에 막는 예방 중심 솔루션이고, EDR 은 단말의 프로세스·파일·네트워크 행위를 지속적으로 수집·분석해 침투한 위협을 탐지하고 격리·추적·대응하는 솔루션이다"
      - q: "SNMP 사용 시 보안 조치 3가지를 쓰시오."
        a: "기본 커뮤니티 문자열(public, private) 변경, SNMP 접근 허용 IP 제한(ACL), 인증·암호화를 지원하는 SNMPv3 사용(불필요하면 서비스 중지)"
      - q: "외부에서 내부 서버 192.168.10.5 로 가는 FTP(21/tcp)만 차단하고 나머지는 허용하는 확장 ACL 을 쓰시오."
        a: "access-list 110 deny tcp any host 192.168.10.5 eq 21 / access-list 110 permit ip any any"

  - id: eis-18
    title: "DB 보안과 최신 암호 기술 (양자내성·동형·경량)"
    points:
      - "DB 보안 통제: 접근 통제(계정·권한 최소화, 뷰로 필요한 열만 노출), 암호화, 감사(접속·쿼리 기록), 추론(집계 결과로 개별 값 유추)·집성 방지"
      - "DB 암호화 방식: API 방식(애플리케이션에서 암호화), Plug-in 방식(DB 서버에 모듈 설치), TDE(DBMS 가 파일 단위로 투명하게 암호화), 파일·디스크 암호화"
      - "양자 컴퓨터 위협: 쇼어 알고리즘은 RSA·ECC(소인수분해·이산대수)를 깨뜨림. 그로버 알고리즘은 대칭키 강도를 절반으로 줄임 → AES-256 등 긴 키 사용"
      - "양자내성암호(PQC): 양자 컴퓨터로도 풀기 어려운 수학 문제(격자, 해시, 부호 등) 기반. NIST 표준 — ML-KEM(키 교환, 격자), ML-DSA(전자서명, 격자), SLH-DSA(전자서명, 해시)"
      - "'지금 수집하고 나중에 해독(Harvest Now, Decrypt Later)' 위협 때문에 장기 보관 데이터부터 PQC 전환 필요"
      - "동형암호: 암호화한 상태 그대로 연산하고 복호화하면 평문 연산 결과와 같음. 클라우드에 맡긴 데이터 분석, 개인정보 결합에 활용. 단점은 연산 속도와 암호문 크기"
      - "경량암호: IoT·센서처럼 자원이 적은 기기용. 국산 LEA·HIGHT, NIST 경량암호 표준 Ascon"
    quiz:
      - q: "양자 컴퓨터가 RSA 와 AES 에 미치는 영향을 각각 쓰시오."
        a: "RSA: 쇼어 알고리즘으로 소인수분해가 빨라져 안전성이 무너진다(양자내성암호로 교체 필요). AES: 그로버 알고리즘으로 키 탐색이 제곱근 수준으로 줄어 강도가 절반이 된다(AES-256 처럼 키를 늘려 대응)"
      - q: "동형암호의 특징과 활용 예를 쓰시오."
        a: "데이터를 복호화하지 않고 암호문 상태에서 덧셈·곱셈 등 연산을 할 수 있다. 활용: 클라우드에 암호화한 데이터를 맡기고 분석, 기관 간 개인정보를 노출하지 않는 통계·결합 분석"
      - q: "TDE 방식 DB 암호화의 장점과 한계는?"
        a: "장점: 애플리케이션 수정 없이 DBMS 가 데이터 파일을 자동으로 암·복호화한다. 한계: DB 에 정상 접속한 계정에는 평문으로 보이므로 접근 통제와 함께 써야 한다"
