# 정보처리기사 실기 — 단원별 설명(읽는 순서: 설명 → 핵심 정리 → 연습문제). 직접 작성한 해설입니다.
notes_for: eip
notes:
  eip-01:
    - h: "이 단원에서 묻는 것"
      p:
        - "정처기 실기에서 프로그래밍 문제는 배점이 가장 큽니다. 그리고 출제 방식이 거의 하나입니다. 코드를 주고 '출력 결과를 쓰시오'. 문법을 설명하라는 문제는 거의 없습니다."
        - "그래서 공부 방법도 하나입니다. 코드를 눈으로 읽지 말고, 변수 값을 종이에 적으면서 한 줄씩 따라가는 연습을 합니다. 눈으로 읽으면 맞은 것 같은데 틀립니다."
        - "C 언어 첫 주에는 자료형, 입출력 서식, 연산자만 확실히 합니다. 이 셋이 흔들리면 뒤의 배열·포인터 문제를 아무리 봐도 답이 안 나옵니다."
    - h: "정수 나눗셈이 함정입니다"
      code: |
        int a = 7, b = 2;
        printf("%d", a / b);        // 3   ← 3.5 가 아닙니다
        printf("%.1f", a / b);      // 3.0 ← 이미 3이 된 뒤라 소용없습니다
        printf("%.1f", (float)a / b);  // 3.5 ← 나누기 전에 실수로 바꿔야 합니다
      p:
        - "C 에서 정수 ÷ 정수는 결과도 정수입니다. 소수점 이하는 버립니다. 평균을 구하는 문제에서 가장 많이 틀리는 부분입니다."
        - "나머지 연산 % 는 왼쪽 피연산자의 부호를 따릅니다. -7 % 2 는 -1 입니다. 1 이 아닙니다."
    - h: "증감 연산자는 손으로 적어야 합니다"
      code: |
        int a = 5;
        printf("%d %d %d", a++, ++a, a);
        // a++ : 지금 값 5 를 쓰고 → a 는 6
        // ++a : a 를 7 로 올린 뒤 → 7 을 씀
        // a   : 7
        // 출력 5 7 7
      p:
        - "한 printf 안에 같은 변수가 여러 번 나오면 반드시 왼쪽부터 순서대로 값을 적어 가며 계산합니다. 암산하면 거의 틀립니다."
    - h: "비트 연산 복습"
      code: |
        5 & 3  →  101 & 011 = 001 = 1   (둘 다 1일 때만 1)
        4 ^ 1  →  100 ^ 001 = 101 = 5   (다를 때만 1)
        5 | 3  →  101 | 011 = 111 = 7   (하나라도 1이면 1)
        n << 1 →  2배   /   n >> 1 → 절반
      p:
        - "비트 연산 문제는 반드시 2진수로 바꿔 세로로 적고 계산합니다. 10진수 상태로 머릿속에서 하면 안 됩니다."

  eip-02:
    - h: "반복 횟수를 세는 법"
      p:
        - "for 문 문제에서 틀리는 이유는 거의 '몇 번 도는지'를 잘못 세기 때문입니다. 조건식이 거짓이 되는 순간 끝난다는 것만 기억하면 됩니다."
        - "for (i = 1; i <= 10; i++) 는 i 가 1, 2, ..., 10 까지 열 번입니다. i < 10 이면 아홉 번입니다. 부등호에 등호가 있는지부터 봅니다."
        - "반복문 안에 if 와 continue, break 가 섞이면 표를 그립니다. 왼쪽에 i, 오른쪽에 그때의 sum 을 적어 내려가면 실수가 없습니다."
    - h: "switch 의 fall-through"
      code: |
        int n = 2;
        switch (n) {
            case 1: printf("A");
            case 2: printf("B");   // 여기서 시작
            case 3: printf("C");   // break 가 없어 계속 내려옴
                    break;
            default: printf("D");
        }
        // 출력: BC
      p:
        - "case 에 break 가 없으면 다음 case 로 그대로 흘러내립니다. 출제자가 일부러 break 를 빼 놓는 단골 문제입니다."
        - "switch 문제를 보면 제일 먼저 break 위치에 동그라미를 칩니다."
    - h: "배열과 문자열"
      code: |
        int a[5] = {1, 2};      // a = {1, 2, 0, 0, 0}  나머지는 0
        char s[] = "abc";       // 실제 크기 4바이트 ('a' 'b' 'c' '\0')
        strlen(s)               // 3   ← 널 문자는 세지 않음
        sizeof(s)               // 4   ← 널 문자를 포함한 메모리 크기
      p:
        - "strlen 과 sizeof 를 구분해서 묻는 문제가 나옵니다. strlen 은 글자 수, sizeof 는 메모리 크기입니다."
        - "2차원 배열 a[2][3] 은 메모리에 a[0][0], a[0][1], a[0][2], a[1][0] ... 순서로 줄 세워 저장됩니다. 행 우선입니다."

  eip-03:
    - h: "포인터는 이 세 가지만 구분하면 됩니다"
      code: |
        int a[5] = {1, 2, 3, 4, 5};
        int *p = a + 1;      // p 는 a[1] 의 주소

        *p        →  2      (p 가 가리키는 값)
        *p + 1    →  3      (그 값에 1 을 더함)
        *(p + 1)  →  3      (다음 칸의 값 = a[2])
        p + 1     →  a[2] 의 주소
      p:
        - "시험에 나오는 포인터 문제는 거의 이 네 줄의 조합입니다. *p + 1 과 *(p + 1) 을 구분하는 것이 핵심입니다. 괄호가 어디에 있는지만 보면 됩니다."
        - "배열 이름 a 는 첫 원소의 주소입니다. 그래서 a[i] 와 *(a + i) 는 완전히 같은 뜻입니다."
    - h: "값으로 넘기느냐 주소로 넘기느냐"
      code: |
        void f(int x)  { x = 10; }      // 복사본만 바뀜 → 원본 그대로
        void g(int *x) { *x = 10; }     // 주소를 받아 원본을 바꿈

        int a = 1;
        f(a);    // a 는 여전히 1
        g(&a);   // a 는 10
      p:
        - "swap 함수 문제가 자주 나옵니다. 매개변수가 int 면 안 바뀌고, int* 면 바뀝니다. 함수 선언부의 별표 유무만 확인하면 답이 나옵니다."
    - h: "재귀 함수 추적법"
      code: |
        int f(int n) {
            if (n <= 1) return 1;
            return n * f(n - 1);
        }
        f(5) = 5 * f(4)
             = 5 * 4 * f(3)
             = 5 * 4 * 3 * f(2)
             = 5 * 4 * 3 * 2 * f(1)
             = 5 * 4 * 3 * 2 * 1 = 120
      p:
        - "재귀는 위처럼 펼쳐 쓰는 것이 가장 빠릅니다. 종료 조건(n <= 1)을 먼저 찾고, 거기까지 내려간 다음 거꾸로 곱해 올라옵니다."
        - "피보나치 재귀가 나오면 f(0), f(1) 값을 먼저 적고 표를 만들어 올라갑니다."

  eip-04:
    - h: "Java 문제의 출제 포인트"
      p:
        - "Java 문제는 C 보다 '객체'를 묻습니다. 다만 첫 주에 볼 기본 문법에서도 두 가지는 반드시 나옵니다. 문자열 비교와 배열 길이입니다."
        - "== 는 주소를 비교합니다. 내용을 비교하려면 equals() 를 써야 합니다. new String(\"hi\") 로 만들면 리터럴과 주소가 달라 == 는 false 입니다."
        - "배열은 a.length(괄호 없음), 문자열은 s.length()(괄호 있음). 이걸 반대로 쓰면 컴파일 오류입니다. 서술형에서 코드를 쓰라고 할 때 감점 요인입니다."
    - h: "기본값은 외워 둡니다"
      code: |
        int[]     → 0
        double[]  → 0.0
        boolean[] → false
        char[]    → '\u0000'
        String[]  → null        (참조형은 모두 null)
      p:
        - "배열을 선언만 하고 값을 넣지 않은 자리의 출력을 묻는 문제가 나옵니다."
    - h: "String 과 StringBuilder"
      p:
        - "String 은 한 번 만들면 내용을 바꿀 수 없습니다(immutable). s = s + \"a\" 를 반복하면 매번 새 객체가 생깁니다."
        - "그래서 반복해서 이어 붙일 때는 StringBuilder 의 append 를 씁니다. '효율적인 문자열 처리 클래스를 쓰시오' 형태로 단답형에 나옵니다."

  eip-05:
    - h: "생성자 실행 순서"
      code: |
        class A { A() { print("A"); } }
        class B extends A { B() { print("B"); } }

        A obj = new B();    // 출력: AB
        // new B() 를 호출하면 B 생성자 첫 줄에서 super() 가 자동 호출되어
        // 상위 클래스 A 의 생성자가 먼저 실행됩니다.
      p:
        - "상속 문제의 절반은 이 순서를 묻습니다. '위에서 아래로'입니다. 상위 → 하위."
    - h: "동적 바인딩 — 메서드는 객체 기준, 필드는 변수 기준"
      code: |
        A obj = new B();
        obj.show();   // B 의 show 가 실행됨   (오버라이딩 → 실제 객체 기준)
        obj.x;        // A 의 x 가 읽힘        (필드 → 변수 타입 기준)
      p:
        - "이 차이가 함정입니다. 메서드는 재정의한 쪽(B)이 실행되고, 필드와 static 메서드는 선언한 타입(A)을 따릅니다."
        - "답을 쓸 때는 '변수 타입은 A, 실제 객체는 B' 라고 먼저 적어 놓고 각 줄을 판단하면 틀리지 않습니다."
    - h: "오버로딩과 오버라이딩"
      code: |
        오버로딩(Overloading) : 같은 이름, 매개변수가 다름.  같은 클래스 안.
            void f(int a) {}
            void f(int a, int b) {}

        오버라이딩(Overriding) : 같은 이름, 같은 매개변수. 상속 관계에서 재정의.
            class A { void f() {} }
            class B extends A { void f() {} }
      p:
        - "이름이 비슷해서 서술형에서 바꿔 쓰기 쉽습니다. '로드(load, 짐을 더 싣는다) = 매개변수 추가', '라이드(ride, 올라타서 덮는다) = 재정의' 로 외우면 헷갈리지 않습니다."
    - h: "try-catch-finally"
      p:
        - "finally 는 예외가 나든 안 나든, 심지어 try 안에 return 이 있어도 실행됩니다. '반드시 실행되는 블록'을 묻는 단답형이 나옵니다."

  eip-06:
    - h: "슬라이싱이 절반입니다"
      code: |
        a = [1, 2, 3, 4, 5]
        a[1:4]    → [2, 3, 4]    끝 인덱스 4 는 포함하지 않음
        a[:3]     → [1, 2, 3]
        a[2:]     → [3, 4, 5]
        a[::-1]   → [5, 4, 3, 2, 1]   뒤집기
        a[-1]     → 5    마지막
        a[-2]     → 4    뒤에서 두 번째
      p:
        - "Python 문제의 상당수가 슬라이싱입니다. '끝 인덱스는 포함하지 않는다'만 기억하면 대부분 풀립니다."
        - "a[::2] 처럼 간격이 들어가면 0, 2, 4 번째를 뽑습니다. 음수 간격 a[::-1] 은 거꾸로입니다."
    - h: "자료형 네 가지 구분"
      code: |
        리스트  [1, 2, 3]      순서 O, 변경 O, 중복 O
        튜플    (1, 2, 3)      순서 O, 변경 X, 중복 O
        집합    {1, 2, 3}      순서 X, 변경 O, 중복 X   ← 중복 제거에 사용
        딕셔너리 {'a': 1}       키-값 쌍
      p:
        - "set(리스트) 로 중복을 없애는 문제, len() 으로 개수를 묻는 문제가 자주 나옵니다."
    - h: "들여쓰기가 블록입니다"
      p:
        - "Python 은 중괄호가 없고 들여쓰기로 블록을 나눕니다. 시험지에서 들여쓰기 칸 수를 세어 어디까지가 for 문 안인지 표시해 두고 읽습니다."
        - "for 문 바깥에 있는 print 와 안에 있는 print 는 출력 횟수가 완전히 다릅니다. 가장 많이 틀리는 지점입니다."

  eip-07:
    - h: "왜 자료구조를 따로 보는가"
      p:
        - "최근 실기에서 자료구조가 독립 문제로 나옵니다. 코드를 주고 연결 리스트의 결과를 묻거나, 스택·큐 동작 후 남은 값을 묻습니다."
        - "그림을 그리면 거의 다 맞습니다. 노드를 네모로, 포인터를 화살표로 그려 가면서 따라가세요."
    - h: "배열 vs 연결 리스트"
      code: |
        구분            배열            연결 리스트
        i번째 접근      O(1) 바로       O(n) 처음부터 따라감
        중간 삽입/삭제  O(n) 밀어야 함   O(1) 포인터만 수정
        메모리          연속            흩어져 있음 + 포인터 공간
      p:
        - "'중간 삽입이 잦으면 무엇을 쓰는가' 같은 문제가 나옵니다. 답은 연결 리스트입니다."
    - h: "노드 삽입 순서 — 이 순서를 바꾸면 끊깁니다"
      code: |
        A → B 사이에 N 을 넣을 때

        ① N->next = A->next;   (먼저 N 이 B 를 가리키게)
        ② A->next = N;         (그 다음 A 가 N 을 가리키게)

        ②를 먼저 하면 B 로 가는 유일한 연결이 끊겨 B 이후가 사라집니다.
      p:
        - "빈칸 채우기로 자주 나옵니다. '새 노드부터 연결한다'로 외우세요."
    - h: "원형 큐의 핵심 식"
      code: |
        rear = (rear + 1) % n      삽입 위치
        front = (front + 1) % n    삭제 위치

        크기 5, rear 가 4 → (4 + 1) % 5 = 0   맨 앞으로 돌아감
      p:
        - "나머지 연산으로 한 바퀴 돌리는 것이 원형 큐의 전부입니다. 보통 한 칸을 비워 두어 '가득 참'과 '비어 있음'을 구분합니다."
    - h: "후위 표기식"
      code: |
        중위 A + B * C   →   후위 A B C * +
          (곱셈 우선순위가 높아 B C * 가 먼저 묶임)

        후위 3 4 + 2 *  계산
          3, 4 를 스택에 push → + 만나면 두 개 꺼내 3 + 4 = 7 push
          2 push → * 만나면 7 × 2 = 14
      p:
        - "후위 표기식 계산은 스택에 숫자를 쌓다가 연산자를 만나면 두 개를 꺼내 계산하고 결과를 다시 넣는 것의 반복입니다. 꺼내는 순서가 중요합니다. 나중에 넣은 것이 오른쪽 피연산자입니다."

  eip-08:
    - h: "순회는 루트를 언제 방문하는지로 외웁니다"
      code: |
        트리 모양
                 A
               /   \
              B     C
             / \
            D   E

        전위(Pre)  : 루트 → 왼쪽 → 오른쪽   A B D E C
        중위(In)   : 왼쪽 → 루트 → 오른쪽   D B E A C
        후위(Post) : 왼쪽 → 오른쪽 → 루트   D E B C A
      p:
        - "'전·중·후'는 루트를 앞에 쓰느냐, 가운데 쓰느냐, 뒤에 쓰느냐입니다. 왼쪽이 오른쪽보다 먼저인 것은 셋 다 같습니다."
        - "이진 탐색 트리를 중위 순회하면 반드시 오름차순으로 나옵니다. 이 성질을 묻는 문제가 나옵니다."
    - h: "힙"
      p:
        - "힙은 완전 이진 트리이면서, 최대 힙은 부모 ≥ 자식, 최소 힙은 부모 ≤ 자식입니다. 형제끼리는 아무 관계가 없습니다. 이 점을 착각해 '왼쪽이 더 작아야 한다'고 생각하면 틀립니다."
        - "루트가 항상 최댓값(또는 최솟값)이라 우선순위 큐 구현에 씁니다. 힙 정렬은 루트를 꺼내고 다시 정리하는 것의 반복입니다."
    - h: "DFS 와 BFS"
      code: |
        DFS(깊이 우선) : 스택 또는 재귀.  한 길로 끝까지 갔다가 돌아옴
        BFS(너비 우선) : 큐.             가까운 것부터 한 겹씩 넓혀 감
                                        → 간선 수 기준 최단 경로는 BFS
      p:
        - "탐색 순서를 쓰라는 문제가 나옵니다. 방문한 노드에 번호를 적어 가며 풀고, 이미 방문한 노드는 다시 안 간다는 것을 꼭 표시하세요."
    - h: "정렬 시간 복잡도 표"
      code: |
        정렬      평균          최악          안정성
        선택      O(n²)         O(n²)         불안정
        삽입      O(n²)         O(n²)         안정
        버블      O(n²)         O(n²)         안정
        퀵        O(n log n)    O(n²)         불안정   ← 최악 주의
        병합      O(n log n)    O(n log n)    안정
        힙        O(n log n)    O(n log n)    불안정
      p:
        - "퀵 정렬만 평균과 최악이 다릅니다. 이미 정렬된 배열에서 피벗을 한쪽 끝으로 잡으면 O(n²) 가 됩니다. 이 점이 가장 자주 출제됩니다."

  eip-09:
    - h: "SQL 은 '쓰는' 문제입니다"
      p:
        - "다른 과목은 답을 고르거나 단어를 쓰지만, SQL 은 문장을 직접 씁니다. 세미콜론, 대소문자, 따옴표까지 보고 채점합니다."
        - "그래서 눈으로 보지 말고 손으로 써 보는 연습이 필요합니다. SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY 순서를 입으로 외울 정도가 되어야 합니다."
    - h: "실행 순서가 작성 순서와 다릅니다"
      code: |
        작성 순서  SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY
        실행 순서  FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY
      p:
        - "SELECT 가 거의 마지막에 실행됩니다. 그래서 SELECT 에서 붙인 별칭을 WHERE 에서는 쓸 수 없고 ORDER BY 에서는 쓸 수 있습니다."
        - "WHERE 는 묶기 전 개별 행을, HAVING 은 묶은 뒤 그룹을 거릅니다. '집계 함수 조건은 HAVING' 으로 외우세요."
    - h: "자주 나오는 SQL 형태"
      code: |
        -- 부서별 평균 급여가 300 이상인 부서
        SELECT 부서, AVG(급여)
        FROM 사원
        GROUP BY 부서
        HAVING AVG(급여) >= 300;

        -- 권한 부여와 회수
        GRANT SELECT, INSERT ON 사원 TO 홍길동;
        REVOKE SELECT ON 사원 FROM 홍길동;

        -- 테이블 구조 변경
        ALTER TABLE 사원 ADD 전화번호 VARCHAR(20);
      p:
        - "GRANT/REVOKE 의 전치사를 틀리지 마세요. GRANT ... TO, REVOKE ... FROM 입니다."
    - h: "DELETE · TRUNCATE · DROP"
      code: |
        DELETE   FROM 사원;   행을 지움. 조건 가능. 롤백 가능. 느림
        TRUNCATE TABLE 사원;  전체를 비움. 조건 불가. 되돌리기 어려움. 빠름
        DROP     TABLE 사원;  테이블 자체가 사라짐(구조까지)
      p:
        - "세 개를 비교하라는 서술형이 단골입니다. '행만 / 전부 비우기 / 구조까지' 로 구분해 적으면 됩니다."

  eip-10:
    - h: "계산 문제부터 확실히"
      p:
        - "운영체제는 암기가 많지만 점수가 되는 것은 계산 문제입니다. HRN 우선순위, 페이지 부재 횟수, 평균 대기 시간 — 이 셋은 반드시 풀 수 있어야 합니다."
    - h: "HRN"
      code: |
        우선순위 = (대기 시간 + 서비스 시간) ÷ 서비스 시간

        대기 10, 서비스 5  →  (10 + 5) / 5 = 3
        대기  5, 서비스 5  →  (5 + 5) / 5  = 2
        값이 큰 쪽이 먼저 실행됩니다.
      p:
        - "짧은 작업이 유리하되, 오래 기다린 작업도 밀리지 않게 하는 방식입니다(에이징)."
    - h: "페이지 교체 추적표"
      code: |
        프레임 3개, 참조열 1 2 3 1 4  —  FIFO

        참조  1   2   3   1   4
        프레임 [1] [1,2] [1,2,3] [1,2,3] [2,3,4]
        부재   O   O     O       X(적중)  O   → 부재 4회
      p:
        - "반드시 위와 같은 표를 그립니다. 가로로 참조열, 세로로 프레임 상태를 적고 부재면 O 를 칩니다."
        - "LRU 는 '가장 오래 안 쓴 것', LFU 는 '가장 적게 쓴 것', OPT 는 '앞으로 가장 늦게 쓸 것' 을 내보냅니다. OPT 는 미래를 알아야 해서 실제로는 쓸 수 없고 비교 기준으로만 씁니다."
    - h: "교착 상태 4조건"
      p:
        - "상호 배제, 점유와 대기, 비선점, 환형 대기. 네 개가 모두 성립해야 교착이 생기므로, 하나만 깨면 예방됩니다."
        - "회피 기법으로 은행원 알고리즘(Banker's Algorithm)을 묻는 단답형이 자주 나옵니다."

  eip-11:
    - h: "서브넷 계산 방법"
      code: |
        192.168.1.0/24 를 /26 으로 나누면

        /26 → 네트워크 비트 26, 호스트 비트 6개
        주소 개수 = 2^6 = 64
        사용 가능 호스트 = 64 - 2 = 62   (네트워크 주소, 브로드캐스트 주소 제외)
        서브넷 개수 = 2^(26-24) = 4

        0 ~ 63 / 64 ~ 127 / 128 ~ 191 / 192 ~ 255
      p:
        - "서브넷 문제는 매 회차 나옵니다. '호스트 비트 = 32 − 프리픽스' 로 시작해 2의 거듭제곱을 구하고 2를 빼는 순서를 고정해 두세요."
        - "특정 IP 가 몇 번째 서브넷에 속하는지 묻는 문제는 위처럼 구간을 나열한 뒤 찾습니다."
    - h: "OSI 7계층 — 전송 단위와 장비를 묶어서"
      code: |
        7 응용      데이터
        6 표현      데이터
        5 세션      데이터
        4 전송      세그먼트    (TCP, UDP)
        3 네트워크   패킷        라우터      (IP, ICMP, ARP)
        2 데이터링크 프레임      스위치, 브리지
        1 물리      비트        허브, 리피터
      p:
        - "'~계층의 전송 단위는?' 또는 '~장비는 몇 계층인가?' 형태로 나옵니다. 위 표를 통째로 외우는 것이 가장 빠릅니다."
        - "게이트웨이는 전 계층에서 동작하며 서로 다른 네트워크를 연결합니다."
    - h: "TCP 와 UDP"
      p:
        - "TCP 는 3-way handshake 로 연결을 맺고 순서 보장·재전송·흐름 제어를 합니다. UDP 는 그런 것이 없어 빠르지만 신뢰성이 없습니다."
        - "'실시간 스트리밍에 적합한 프로토콜' 같은 문제의 답은 UDP 입니다."

  eip-12:
    - h: "서버 3계층 구조"
      code: |
        [클라이언트] → [웹 서버] → [WAS] → [DB 서버]
                      Apache      Tomcat    MySQL
                      Nginx       WebLogic  Oracle
                      IIS         JEUS
      p:
        - "웹 서버는 HTML·이미지 같은 정적 파일을, WAS 는 프로그램 실행과 트랜잭션 같은 동적 처리를 맡습니다. 역할을 구분해 쓰라는 서술형이 나옵니다."
        - "실무에서 웹 서버를 WAS 앞에 두는 이유는 정적 파일 처리 부담을 덜고 보안 경계를 하나 더 두기 위해서입니다."
    - h: "형상 관리 4단계"
      code: |
        형상 식별 → 형상 통제 → 형상 감사 → 형상 기록
        (대상 선정)  (변경 심사·승인)  (반영 확인)   (이력 보고)
      p:
        - "'식별 → 통제 → 감사 → 기록' 순서를 그대로 묻습니다. 변경 요청을 심사하는 단계가 통제입니다."
    - h: "Git 과 SVN"
      p:
        - "SVN 은 중앙 서버 한 곳에 이력이 있고, Git 은 개발자마다 전체 이력을 가진 지역 저장소가 있습니다. 그래서 Git 은 네트워크가 끊겨도 커밋할 수 있습니다."
        - "용어도 묻습니다. 체크아웃(받아 오기), 커밋(반영), 임포트(최초 등록), 업데이트(동기화)."

  eip-13:
    - h: "모델별 한 줄 요약"
      code: |
        폭포수     단계를 순서대로. 앞 단계로 되돌아가기 어려움
        프로토타입  시제품을 먼저 만들어 요구사항을 확인
        나선형     계획 → 위험 분석 → 개발·검증 → 고객 평가 를 반복
        애자일     짧은 주기로 반복하며 변화를 받아들임
      p:
        - "나선형의 4단계 순서는 거의 매번 나옵니다. '위험 분석'이 들어가는 유일한 모델이라는 점도 기억하세요."
    - h: "애자일 — XP 와 스크럼"
      code: |
        XP 5가지 가치 : 용기, 단순성, 의사소통, 피드백, 존중
        XP 실천법     : 짝 프로그래밍, 테스트 주도 개발, 지속적 통합, 리팩토링

        스크럼 흐름   : 제품 백로그 → 스프린트 계획 → 스프린트(2~4주)
                       → 일일 스크럼 → 스프린트 검토 → 회고
        스크럼 역할   : 제품 책임자(PO), 스크럼 마스터(SM), 개발팀
      p:
        - "XP 의 가치 5개는 글자만 외우면 됩니다. '용단의피존' 처럼 앞 글자로 묶어 두세요."
    - h: "비용 산정"
      p:
        - "COCOMO 의 세 유형은 규모 순입니다. 조직형(소규모) → 반분리형(중간) → 내장형(대규모·실시간)."
        - "기능 점수(FP)는 코드 양이 아니라 기능 개수로 산정해 언어에 독립적입니다. LOC 는 코드 라인 수 기반이라 언어에 따라 달라집니다."
    - h: "일정과 위험"
      p:
        - "WBS 로 작업을 잘게 나누고, PERT/CPM 으로 가장 긴 경로(임계 경로)를 구하며, 간트 차트로 막대 그래프를 그립니다. 임계 경로가 지연되면 전체 일정이 지연됩니다."
        - "위험 관리는 식별 → 분석·평가 → 계획 수립 → 감시·조치 순입니다."

  eip-14:
    - h: "UML 다이어그램 분류"
      code: |
        구조(정적)  클래스, 객체, 컴포넌트, 배치, 복합체 구조, 패키지
        행위(동적)  유스케이스, 시퀀스, 커뮤니케이션, 상태, 활동, 타이밍
      p:
        - "'다음 중 구조 다이어그램은?' 또는 '~을 표현하는 다이어그램은?' 형태로 나옵니다. 구조는 6개, 행위는 6개로 개수까지 외워 두면 빠뜨리지 않습니다."
        - "시간 순서로 메시지를 주고받는 것은 시퀀스, 객체 간 관계 중심이면 커뮤니케이션입니다."
    - h: "관계 기호와 의미"
      code: |
        연관(Association)   ──────   단순 연결
        집합(Aggregation)   ◇──────  전체-부분. 부분이 독립적으로 존재 가능
        포함(Composition)   ◆──────  전체-부분. 전체가 없어지면 부분도 소멸
        일반화(Generalization) ──▷   상속
        의존(Dependency)    ------>  일시적 사용
        실체화(Realization) ----▷    인터페이스 구현
      p:
        - "집합과 포함의 차이가 단골입니다. 빈 마름모는 독립, 채운 마름모는 생명주기를 함께합니다. '회사와 직원'은 집합, '사람과 심장'은 포함입니다."
    - h: "유스케이스의 include 와 extend"
      p:
        - "include 는 항상 실행되는 공통 기능입니다. 예를 들어 '주문하기'는 항상 '로그인 확인'을 포함합니다."
        - "extend 는 조건에 따라 실행됩니다. '주문하기'에서 쿠폰이 있을 때만 '할인 적용'이 일어납니다."

  eip-15:
    - h: "UI 유형 네 가지"
      code: |
        CLI  명령어를 텍스트로 입력          (터미널)
        GUI  그래픽 환경에서 마우스로 조작     (윈도우 바탕화면)
        NUI  신체를 이용 — 터치, 음성, 동작   (스마트폰)
        OUI  현실의 사물이 입출력 장치가 됨    (IoT)
      p:
        - "VUI(음성)를 따로 묻기도 합니다. NUI 에 음성이 포함되지만 별도 용어로 나올 수 있습니다."
    - h: "설계 원칙 4개 — 직·유·학·유"
      p:
        - "직관성(누구나 쉽게 이해), 유효성(목적을 정확·완전하게 달성), 학습성(쉽게 배울 수 있음), 유연성(요구를 수용하고 오류를 최소화)."
        - "네 단어와 각각의 한 줄 설명을 세트로 외우세요. '원칙 4가지를 쓰고 설명하시오' 형태로 나옵니다."
    - h: "설계 도구 — 상세도 순서"
      code: |
        와이어프레임 → 목업 → 스토리보드 → 프로토타입
        (뼈대 스케치)  (정적 모형)  (화면+설명)   (동작하는 시제품)
      p:
        - "와이어프레임과 프로토타입의 차이를 묻는 문제가 가장 많습니다. '움직이는가'가 기준입니다."

  eip-16:
    - h: "결합도와 응집도 — 방향이 반대입니다"
      code: |
        좋은 설계 = 결합도 낮음(Low Coupling) + 응집도 높음(High Cohesion)

        결합도 낮음 → 높음
          자료 → 스탬프 → 제어 → 외부 → 공통 → 내용
          (자스제외공내)

        응집도 높음 → 낮음
          기능적 → 순차적 → 교환적 → 절차적 → 시간적 → 논리적 → 우연적
          (기순교절시논우)
      p:
        - "순서를 뒤집어 묻는 문제가 나옵니다. 결합도는 '자스제외공내'가 좋은 것부터, 응집도는 '기순교절시논우'가 좋은 것부터라고 방향을 함께 외우세요."
        - "제어 결합도는 플래그 같은 제어 신호를 넘기는 것, 내용 결합도는 다른 모듈 내부를 직접 참조하는 최악의 경우입니다."
    - h: "디자인 패턴 분류 — 23개를 셋으로"
      code: |
        생성(5)  추상 팩토리, 빌더, 팩토리 메서드, 프로토타입, 싱글톤
        구조(7)  어댑터, 브리지, 컴포지트, 데코레이터, 퍼사드, 플라이웨이트, 프록시
        행위(11) 옵서버, 전략, 템플릿 메서드, 커맨드, 상태, 반복자,
                 중재자, 책임 연쇄, 방문자, 메멘토, 인터프리터
      p:
        - "전부 외울 필요는 없고 자주 나오는 것만 확실히 합니다. 싱글톤(하나만), 옵서버(변화 통보), 어댑터(인터페이스 변환), 데코레이터(기능 덧붙이기), 팩토리 메서드(생성 위임), 전략(알고리즘 교체)."
        - "설명을 주고 패턴 이름을 쓰게 합니다. 그래서 '한 줄 설명 → 이름' 방향으로 외워야 합니다."
    - h: "MVC"
      p:
        - "모델(데이터와 로직), 뷰(화면), 컨트롤러(입력 처리와 중개). 아키텍처 패턴이지 디자인 패턴이 아니라는 점을 구분해 묻기도 합니다."

  eip-17:
    - h: "정규화는 '무엇을 없애는가'로 외웁니다"
      code: |
        1NF   모든 속성이 원자값        (한 칸에 값 하나)
        2NF   부분 함수 종속 제거        (복합키 일부에만 의존하는 속성 분리)
        3NF   이행 함수 종속 제거        (A → B → C 에서 A → C 를 분리)
        BCNF  모든 결정자가 후보키       (후보키가 아닌 결정자 제거)
        4NF   다치 종속 제거
        5NF   조인 종속 제거
      p:
        - "'부.이.결.다.조' 로 묶어 외우면 순서가 섞이지 않습니다. 2부터 차례로 부분 → 이행 → 결정자 → 다치 → 조인입니다."
        - "표를 주고 '몇 정규형인가, 다음 정규형으로 만들려면 어떻게 나누는가'를 묻습니다. 복합키가 있는지부터 확인하세요."
    - h: "키 정리"
      code: |
        슈퍼키   유일성 O, 최소성 X     (학번+이름)
        후보키   유일성 O, 최소성 O     (학번), (주민번호)
        기본키   후보키 중 선택한 것
        대체키   선택되지 않은 나머지 후보키
        외래키   다른 릴레이션의 기본키를 참조
      p:
        - "'유일성과 최소성을 모두 만족하는 키는?' → 후보키. 가장 자주 나오는 단답형입니다."
    - h: "무결성 세 가지"
      p:
        - "개체 무결성은 기본키가 NULL 이거나 중복될 수 없다는 것, 참조 무결성은 외래키 값이 참조 대상에 실제로 있거나 NULL 이어야 한다는 것, 도메인 무결성은 속성 값이 정의된 범위 안에 있어야 한다는 것입니다."
    - h: "반정규화"
      p:
        - "정규화를 하면 테이블이 쪼개져 조인이 늘고 느려집니다. 그래서 성능이 필요하면 일부러 중복을 허용합니다. 테이블 통합·분할, 중복 칼럼 추가, 파생 칼럼 추가가 대표적입니다."

  eip-18:
    - h: "EAI 네 가지 유형 — 그림으로 외웁니다"
      code: |
        Point-to-Point   A─B  A─C  B─C      1:1 직접 연결. 연결 수가 폭증
        Hub & Spoke      A─[허브]─B          중앙 허브 경유. 허브 장애 시 전체 영향
        Message Bus      A─┬─B─┬─C          버스(ESB)를 통해 통신. 확장성 좋음
        Hybrid           그룹 안은 버스, 그룹 간은 허브
      p:
        - "네 개를 나열하고 각각의 특징을 한 줄로 쓰라는 문제가 나옵니다. 연결 형태만 그리면 설명이 따라옵니다."
    - h: "웹 서비스 3요소"
      code: |
        SOAP  메시지를 주고받는 프로토콜 (XML 기반)
        WSDL  이 서비스가 뭘 하고 어떻게 부르는지 적은 명세서
        UDDI  서비스를 등록하고 찾는 저장소(전화번호부)
      p:
        - "'명세'는 WSDL, '등록·검색'은 UDDI, '메시지 교환'은 SOAP 으로 연결해 외우세요."
        - "REST 는 이와 달리 HTTP 메서드(GET/POST/PUT/DELETE)로 자원을 다루는 가벼운 방식입니다."
    - h: "JSON 과 XML"
      code: |
        JSON                          XML
        {"이름": "홍길동",            <사람>
         "나이": 20,                    <이름>홍길동</이름>
         "취미": ["독서", "등산"]}      <나이>20</나이>
                                      </사람>
      p:
        - "JSON 은 키-값 쌍, 중괄호로 시작·끝, 배열은 대괄호입니다. 'AJAX 에서 많이 쓰이며 XML 을 대체하는 경량 포맷'이라는 설명으로 단답형에 나옵니다."
    - h: "인터페이스 보안 — 계층으로 구분"
      p:
        - "네트워크 계층은 IPSec, 전송 계층은 SSL/TLS, 응용 계층은 S-HTTP. '어느 계층에서 동작하는가'를 함께 묻습니다."

  eip-19:
    - h: "정보보안기사와 겹치는 단원입니다"
      p:
        - "두 시험을 같이 준비한다면 이 단원이 가장 이득입니다. 보안기사 쪽에서 더 깊게 보게 되므로, 정처기에서는 용어와 대응 방법을 한 줄로 쓸 수 있는 수준이면 충분합니다."
        - "다만 정처기는 '시큐어 코딩' 관점에서 묻습니다. 공격 원리보다 '개발자가 코드에서 어떻게 막는가'에 초점을 두세요."
    - h: "자주 나오는 보안 약점과 대응"
      code: |
        SQL 삽입      입력값에 SQL 구문 주입
                     → 입력값 검증, Prepared Statement(매개변수화 질의)
        XSS          스크립트 주입 후 사용자 브라우저에서 실행
                     → 입력값 검증, 출력 시 이스케이프(HTML 인코딩)
        CSRF         사용자 권한으로 위조된 요청 전송
                     → CSRF 토큰, Referer 검증, 재인증
        경로 조작     ../ 로 상위 디렉터리 접근
                     → 입력값에서 경로 문자 제거, 화이트리스트
        버퍼 오버플로  할당된 메모리를 넘겨 덮어씀
                     → 경계 검사, 안전한 함수 사용(strncpy 등)
      p:
        - "'공격 이름 → 대응 방법' 한 쌍으로 외우면 어떤 방향으로 물어도 답할 수 있습니다."
    - h: "인증과 접근 통제"
      code: |
        인증 유형   지식 기반(비밀번호) / 소유 기반(OTP, 카드)
                   / 생체 기반(지문) / 위치 기반

        접근 통제   DAC  소유자가 권한 부여       (임의)
                   MAC  관리자가 보안 등급 강제   (강제)
                   RBAC 역할에 따라 부여         (역할 기반)
      p:
        - "DAC·MAC·RBAC 세 글자 뜻을 풀어 쓸 수 있어야 합니다. 임의·강제·역할."
    - h: "암호 방식"
      p:
        - "대칭키는 같은 키로 암·복호화해 빠릅니다(AES, SEED, ARIA, DES). 비대칭키는 공개키·개인키 쌍으로 키 분배 문제를 해결합니다(RSA, ECC)."
        - "해시는 복호화할 수 없습니다. 무결성 검증과 비밀번호 저장에 씁니다. MD5 와 SHA-1 은 충돌이 발견되어 쓰지 않습니다."

  eip-20:
    - h: "테스트 원리 7가지 — 이름만 묻습니다"
      code: |
        결함 존재를 밝히는 활동     없다는 것은 증명 못 함
        완벽한 테스트는 불가능      경우의 수가 무한
        초기 집중                 일찍 할수록 비용 절감(요르돈 법칙)
        결함 집중                 20% 모듈에 80% 결함(파레토)
        살충제 역설               같은 테스트만 반복하면 더는 결함이 안 나옴
        정황 의존                 상황에 따라 다르게 수행
        오류-부재의 궤변           결함이 없어도 요구에 안 맞으면 쓸모없음
      p:
        - "'80 대 20 법칙이 적용되는 원리는?' → 결함 집중. '같은 테스트 케이스를 반복하면 결함 발견률이 떨어지는 현상은?' → 살충제 역설."
    - h: "화이트박스 vs 블랙박스"
      code: |
        화이트박스(내부 구조를 봄)
          문장 / 분기(결정) / 조건 / 분기조건 / 변형 조건결정 커버리지
          기본 경로 검사, 루프 검사

        블랙박스(입출력만 봄)
          동등 분할, 경곗값 분석, 결정 테이블, 상태 전이,
          유스케이스, 원인-결과 그래프, 오류 예측
      p:
        - "기법 이름을 주고 어느 쪽인지 고르게 합니다. '경곗값 분석은 블랙박스'처럼 묶어서 외우세요."
        - "경곗값 분석은 최솟값·최댓값과 그 바로 앞뒤를 테스트합니다. 오류가 경계에서 몰려 나오기 때문입니다."
    - h: "통합 테스트 — 스텁과 드라이버"
      code: |
        하향식(Top-down)  위에서 아래로. 아직 없는 하위 모듈 자리에 스텁(Stub)
        상향식(Bottom-up) 아래에서 위로. 아직 없는 상위 모듈 자리에 드라이버(Driver)
      p:
        - "'하향식 = 스텁' 을 세트로 외우세요. 매번 나오고, 바꿔 쓰면 바로 오답입니다."
    - h: "순환 복잡도"
      code: |
        V(G) = 간선 수 − 노드 수 + 2

        노드 6, 간선 8  →  8 − 6 + 2 = 4
      p:
        - "맥케이브의 순환 복잡도입니다. 제어 흐름 그래프를 주고 계산하게 합니다. 식 하나만 외우면 끝납니다."

  eip-21:
    - h: "마지막 단원, 암기 위주입니다"
      p:
        - "분량이 적고 외울 것이 정해져 있습니다. 릴리스 노트 항목과 DRM 구성 요소, 품질 특성 6가지 — 이 세 덩어리만 확실히 하면 됩니다."
    - h: "릴리스 노트 항목"
      code: |
        헤더(문서명·제품명·버전·날짜) / 개요 / 목적 / 이슈 요약
        재현 항목 / 수정·개선 내용 / 사용자 영향도
        노트 / 면책 조항 / 연락처
      p:
        - "'5가지만 쓰시오' 형태로 나오므로 앞쪽 항목부터 확실히 외워 두면 됩니다."
    - h: "DRM 구성 요소"
      code: |
        콘텐츠 제공자 → 패키저(암호화해 묶음) → 콘텐츠 분배자 → 콘텐츠 소비자
                                  ↑
                         클리어링 하우스(키·라이선스 관리)
                         DRM 컨트롤러 / 보안 컨테이너
      p:
        - "'키 관리와 라이선스 발급을 맡는 요소는?' → 클리어링 하우스. 거의 이 하나만 나옵니다."
    - h: "품질 특성과 국제 표준"
      p:
        - "ISO/IEC 9126 의 6가지는 기능성, 신뢰성, 사용성, 효율성, 유지 보수성, 이식성입니다. '기신사효유이' 로 외우세요."
        - "표준 번호도 묻습니다. 12207은 생명주기 프로세스, 15504는 SPICE(프로세스 평가), 25000은 SQuaRE(품질 통합)."
