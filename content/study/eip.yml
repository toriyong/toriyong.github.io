# 정보처리기사 실기 학습 단원 — 직접 정리한 요약·연습문제(기출 원문 아님)
# ※ 출제기준은 개정될 수 있으니 큐넷 공고의 최신 출제기준을 확인하세요.
exam: eip
units:
  - id: eip-01
    title: "요구사항 확인과 UML"
    points:
      - "생명주기 모델: 폭포수(단계별 순차), 프로토타입(시제품으로 요구 확인), 나선형(위험 분석 반복: 계획 → 위험 분석 → 개발 → 고객 평가), 애자일(짧은 반복, 변화 수용)"
      - "XP 의 5가지 가치: 용기, 단순성, 의사소통, 피드백, 존중. 실천법: 짝 프로그래밍, 테스트 주도 개발, 지속적 통합, 리팩토링"
      - "스크럼: 제품 백로그 → 스프린트 계획 → 스프린트(2~4주) → 일일 스크럼 → 스프린트 검토·회고. 역할은 제품 책임자, 스크럼 마스터, 개발팀"
      - "요구사항 개발 절차: 도출 → 분석 → 명세 → 확인. 기능 요구사항(무엇을 하는가)과 비기능 요구사항(성능, 보안, 품질)"
      - "UML 구조 다이어그램: 클래스, 객체, 컴포넌트, 배치, 복합체 구조, 패키지 / 행위 다이어그램: 유스케이스, 시퀀스, 커뮤니케이션, 상태, 활동, 타이밍"
      - "UML 관계: 연관, 집합(전체-부분, 독립), 포함(합성, 전체와 생명주기 공유), 일반화(상속), 의존, 실체화(인터페이스 구현)"
      - "유스케이스 관계: 포함(include, 반드시 실행), 확장(extend, 조건부 실행), 일반화"
    quiz:
      - q: "나선형 모델의 4단계를 순서대로 쓰시오."
        a: "계획 수립 → 위험 분석 → 개발 및 검증 → 고객 평가"
      - q: "UML 에서 집합 관계와 포함(합성) 관계의 차이는?"
        a: "둘 다 전체-부분 관계지만, 집합은 부분이 전체와 독립적으로 존재할 수 있고, 포함(합성)은 전체가 없어지면 부분도 함께 없어진다"
      - q: "XP 의 5가지 가치를 쓰시오."
        a: "용기, 단순성, 의사소통, 피드백, 존중"

  - id: eip-02
    title: "데이터 모델링과 정규화"
    points:
      - "데이터 모델링 순서: 개념(ERD) → 논리(정규화, 테이블 구조) → 물리(인덱스, 파티션, 저장 구조)"
      - "키: 슈퍼키(유일성만), 후보키(유일성 + 최소성), 기본키(후보키 중 선택), 대체키(남은 후보키), 외래키(다른 릴레이션의 기본키 참조)"
      - "무결성: 개체 무결성(기본키는 NULL·중복 불가), 참조 무결성(외래키는 참조 대상에 있는 값이거나 NULL), 도메인 무결성"
      - "이상 현상: 삽입 이상, 삭제 이상, 갱신 이상 — 정규화로 해소"
      - "정규화: 1NF(원자값), 2NF(부분 함수 종속 제거), 3NF(이행 함수 종속 제거), BCNF(모든 결정자가 후보키), 4NF(다치 종속 제거), 5NF(조인 종속 제거)"
      - "반정규화: 성능을 위해 중복·통합·분할을 허용. 테이블 병합, 테이블 분할, 중복 컬럼 추가"
      - "트랜잭션 ACID: 원자성(전부 또는 전무), 일관성, 격리성(독립성), 영속성"
      - "관계 대수: 셀렉트 σ(행), 프로젝트 π(열), 조인 ⋈, 디비전 ÷, 합집합·차집합·교집합·카티션 프로덕트"
    quiz:
      - q: "제2정규형과 제3정규형에서 각각 제거하는 종속은?"
        a: "2NF: 부분 함수 종속(기본키의 일부에만 종속) 제거. 3NF: 이행 함수 종속(A→B, B→C 이면 A→C) 제거"
      - q: "후보키가 만족해야 하는 두 성질은?"
        a: "유일성(튜플을 유일하게 식별)과 최소성(식별에 꼭 필요한 속성만으로 구성)"
      - q: "트랜잭션의 원자성이란?"
        a: "트랜잭션의 연산은 모두 반영(Commit)되거나 전혀 반영되지 않아야(Rollback) 한다는 성질"

  - id: eip-03
    title: "통합 구현과 인터페이스"
    points:
      - "EAI 구축 유형: Point-to-Point(1:1 직접), Hub & Spoke(중앙 허브 경유), Message Bus(버스에 미들웨어), Hybrid(그룹 안은 허브, 그룹 간은 버스)"
      - "ESB: 서비스 중심으로 느슨하게 결합하는 통합 버스. 웹 서비스 구성: SOAP(메시지 교환), WSDL(서비스 명세), UDDI(서비스 등록·검색)"
      - "연계 방식: 직접(DB Link, DB Connection, API, JDBC, 하이퍼링크) / 간접(EAI, 웹 서비스·ESB, 소켓)"
      - "데이터 표현 형식: JSON(속성-값 쌍), XML(태그 기반), YAML. AJAX 는 비동기로 서버와 데이터를 주고받는 기술"
      - "REST: 자원을 URI 로 표현하고 HTTP 메서드(GET 조회, POST 생성, PUT 수정, DELETE 삭제)로 조작"
      - "인터페이스 보안: 네트워크 구간(IPsec, SSL/TLS, S-HTTP), 애플리케이션(시큐어 코딩), DB(접근 권한, 암호화)"
      - "인터페이스 구현 검증 도구: xUnit, STAF, FitNesse, NTAF, Selenium, watir. 감시 도구(APM): 스카우터, 제니퍼"
    quiz:
      - q: "EAI 구축 유형 4가지를 쓰시오."
        a: "Point-to-Point, Hub & Spoke, Message Bus, Hybrid"
      - q: "웹 서비스의 SOAP, WSDL, UDDI 를 각각 설명하시오."
        a: "SOAP: HTTP 등으로 XML 메시지를 교환하는 프로토콜. WSDL: 웹 서비스의 기능·호출 방법을 기술한 명세 언어. UDDI: 웹 서비스를 등록하고 검색하는 저장소"
      - q: "AJAX 의 특징을 한 문장으로 쓰시오."
        a: "페이지 전체를 새로 고치지 않고 자바스크립트로 서버와 비동기 통신해 필요한 데이터만 주고받는 기술"

  - id: eip-04
    title: "모듈 설계와 디자인 패턴"
    points:
      - "좋은 모듈은 결합도는 낮게, 응집도는 높게"
      - "결합도(낮음 → 높음): 자료 < 스탬프 < 제어 < 외부 < 공통 < 내용"
      - "응집도(낮음 → 높음): 우연적 < 논리적 < 시간적 < 절차적 < 교환(통신)적 < 순차적 < 기능적"
      - "팬인(Fan-In): 나를 호출하는 모듈 수 / 팬아웃(Fan-Out): 내가 호출하는 모듈 수. 팬인은 높게, 팬아웃은 낮게"
      - "생성 패턴: Singleton(인스턴스 하나), Factory Method(하위 클래스가 생성 결정), Abstract Factory(관련 객체군 생성), Builder(조립), Prototype(복제)"
      - "구조 패턴: Adapter(인터페이스 변환), Bridge(구현과 추상 분리), Composite(트리 구조), Decorator(기능 덧붙임), Facade(단순한 창구), Flyweight(공유), Proxy(대리)"
      - "행위 패턴: Observer(상태 변화 통지), Strategy(알고리즘 교체), State, Command(요청 객체화), Iterator, Template Method(골격은 상위, 세부는 하위), Visitor, Mediator, Memento, Chain of Responsibility, Interpreter"
      - "객체지향 설계 원칙 SOLID: 단일 책임, 개방-폐쇄, 리스코프 치환, 인터페이스 분리, 의존 역전"
    quiz:
      - q: "결합도를 낮은 것부터 높은 순으로 나열하시오."
        a: "자료 → 스탬프 → 제어 → 외부 → 공통 → 내용"
      - q: "한 객체의 상태가 바뀌면 의존하는 객체들에 자동으로 알려 주는 패턴은?"
        a: "Observer(옵서버) 패턴"
      - q: "상위 클래스에서 알고리즘의 골격을 정하고 일부 단계를 하위 클래스가 구현하게 하는 패턴은?"
        a: "Template Method 패턴"

  - id: eip-05
    title: "화면 설계(UI)"
    points:
      - "UI 종류: CLI(명령어), GUI(그래픽), NUI(음성·터치 등 자연스러운 동작), OUI(현실의 모든 사물이 입출력 장치)"
      - "UI 설계 원칙 4가지: 직관성(누구나 쉽게 이해), 유효성(목적을 정확히 달성), 학습성(쉽게 배움), 유연성(요구를 최대한 수용하고 실수를 줄임)"
      - "UI 설계 도구: 와이어프레임(뼈대), 목업(실제와 비슷한 정적 모형), 스토리보드(화면 흐름과 설명), 프로토타입(동작하는 시제품), 유스케이스"
      - "UX: 사용자가 제품을 쓰며 느끼는 총체적 경험. UI 는 그 접점"
      - "품질 요구사항(ISO/IEC 9126): 기능성, 신뢰성, 사용성, 효율성, 유지보수성, 이식성"
      - "웹 접근성: 장애인·고령자도 동등하게 이용할 수 있어야 함(인식의 용이성, 운용의 용이성, 이해의 용이성, 견고성)"
    quiz:
      - q: "UI 설계 원칙 4가지를 쓰시오."
        a: "직관성, 유효성, 학습성, 유연성"
      - q: "사용자의 말이나 행동 같은 자연스러운 움직임으로 조작하는 인터페이스는?"
        a: "NUI(Natural User Interface)"
      - q: "와이어프레임과 프로토타입의 차이는?"
        a: "와이어프레임은 화면 배치를 선으로 그린 뼈대이고, 프로토타입은 실제처럼 동작(상호작용)하도록 만든 시제품"

  - id: eip-06
    title: "애플리케이션 테스트"
    points:
      - "테스트 원리: 완벽한 테스트는 불가능, 결함 집중(파레토 법칙, 20% 모듈에 80% 결함), 살충제 패러독스(같은 테스트 반복은 새 결함을 못 찾음), 오류-부재의 궤변(결함이 없어도 요구를 못 채우면 실패)"
      - "화이트박스(구조 기반): 구문, 결정(분기), 조건, 조건/결정, 변경 조건/결정(MC/DC), 다중 조건 커버리지, 기초 경로 검사"
      - "블랙박스(명세 기반): 동치 분할, 경계값 분석, 원인-결과 그래프, 오류 예측, 비교 검사, 상태 전이"
      - "테스트 단계(V 모델): 단위 → 통합 → 시스템 → 인수. 인수 테스트의 알파(개발자 환경에서 사용자가), 베타(사용자 환경에서)"
      - "통합 테스트: 하향식(상위부터, 스텁 필요), 상향식(하위부터, 드라이버 필요), 빅뱅, 샌드위치. 회귀 테스트는 수정 후 새 결함 유무 확인"
      - "테스트 오라클: 참(모든 입력에 기대 결과), 샘플링(일부 입력만), 휴리스틱(추정), 일관성 검사(변경 전후 결과 비교)"
      - "테스트 하네스 구성: 드라이버, 스텁, 테스트 슈트, 테스트 케이스, 테스트 스크립트, 목 오브젝트"
      - "성능 지표: 처리량, 응답 시간, 경과 시간, 자원 사용률"
    quiz:
      - q: "하향식 통합 테스트와 상향식 통합 테스트에 각각 필요한 것은?"
        a: "하향식: 스텁(아직 없는 하위 모듈을 대신하는 임시 모듈). 상향식: 드라이버(하위 모듈을 호출하는 임시 상위 모듈)"
      - q: "점수 0~100 을 입력받는 프로그램에 경계값 분석을 적용할 때 테스트 값의 예는?"
        a: "-1, 0, 1, 99, 100, 101 (경계와 그 바로 안팎의 값)"
      - q: "살충제 패러독스란?"
        a: "같은 테스트 케이스를 반복하면 더 이상 새로운 결함을 찾지 못하므로 테스트 케이스를 주기적으로 보완해야 한다는 원리"

  - id: eip-07
    title: "SQL 응용"
    points:
      - "DDL: CREATE, ALTER, DROP, TRUNCATE / DML: SELECT, INSERT, UPDATE, DELETE / DCL: GRANT, REVOKE / TCL: COMMIT, ROLLBACK, SAVEPOINT"
      - "SELECT 실행 순서: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY"
      - "WHERE 는 행 조건, HAVING 은 그룹 조건(집계 함수 사용 가능)"
      - "집계 함수는 NULL 을 제외. COUNT(*) 는 NULL 포함 전체 행 수, COUNT(컬럼) 은 NULL 이 아닌 값의 수"
      - "조인: INNER(양쪽 일치), LEFT/RIGHT OUTER(한쪽 전부), FULL OUTER, CROSS(카티션 곱), SELF"
      - "서브쿼리 연산자: IN, EXISTS, ANY(SOME), ALL. 패턴 검색 LIKE 의 % 는 0개 이상 문자, _ 는 한 문자"
      - "DROP 옵션: CASCADE(참조하는 개체까지 함께 삭제), RESTRICT(참조 중이면 삭제 거부)"
      - "문법 예: ALTER TABLE 학생 ADD 주소 VARCHAR(50); / GRANT SELECT ON 학생 TO kim; / CREATE INDEX idx ON 학생(이름); / CREATE VIEW v AS SELECT ..."
    quiz:
      - q: "학생(학번, 이름, 학과, 점수) 테이블에서 학과별 평균 점수가 80 이상인 학과와 평균을 구하는 SQL 을 쓰시오."
        a: "SELECT 학과, AVG(점수) FROM 학생 GROUP BY 학과 HAVING AVG(점수) >= 80;"
      - q: "점수 컬럼 값이 (90, NULL, 70) 인 3행 테이블에서 COUNT(*), COUNT(점수), AVG(점수) 의 결과는?"
        a: "COUNT(*) = 3, COUNT(점수) = 2, AVG(점수) = 80 (NULL 은 집계에서 제외)"
      - q: "학생 테이블에서 이름이 '김' 으로 시작하는 학생의 학과를 '보안' 으로 바꾸는 SQL 을 쓰시오."
        a: "UPDATE 학생 SET 학과 = '보안' WHERE 이름 LIKE '김%';"

  - id: eip-08
    title: "소프트웨어 개발 보안"
    points:
      - "보안 3요소: 기밀성(인가된 사용자만 접근), 무결성(인가된 방법으로만 수정), 가용성(필요할 때 사용 가능)"
      - "시큐어 코딩 7대 항목: 입력 데이터 검증 및 표현, 보안 기능, 시간 및 상태, 에러 처리, 코드 오류, 캡슐화, API 오용"
      - "입력 검증 관련 약점: SQL 삽입, XSS, 경로 조작, 운영체제 명령어 삽입, 위험한 형식 파일 업로드"
      - "AAA: 인증(Authentication), 인가(Authorization), 계정 관리·과금(Accounting)"
      - "암호 알고리즘: 대칭키(DES, AES, SEED, ARIA), 공개키(RSA, ECC), 해시(SHA, MD5). 해시는 단방향이라 복호화 불가"
      - "서비스 거부 공격: SYN 플러딩, 스머프, 죽음의 핑, 랜드, 티어드롭. 네트워크 침해: 스니핑, 스푸핑, 세션 하이재킹"
      - "보안 솔루션: 방화벽, IDS, IPS, WAF, VPN, NAC, ESM, DLP"
      - "접근 통제: 강제(MAC), 임의(DAC), 역할 기반(RBAC)"
    quiz:
      - q: "시큐어 코딩 가이드의 7개 항목 중 4개 이상 쓰시오."
        a: "입력 데이터 검증 및 표현, 보안 기능, 시간 및 상태, 에러 처리, 코드 오류, 캡슐화, API 오용"
      - q: "AAA 의 세 가지 요소를 쓰시오."
        a: "인증(Authentication), 인가(Authorization), 계정 관리(Accounting)"
      - q: "출발지와 목적지 IP 주소를 똑같이 만들어 보내는 공격은?"
        a: "랜드(Land) 공격"

  - id: eip-09
    title: "C 언어"
    points:
      - "배열 이름은 첫 원소의 주소. a[i] 는 *(a + i) 와 같음"
      - "포인터 연산: p + 1 은 다음 원소 주소. *p + 1 은 값에 1 을 더한 것, *(p + 1) 은 다음 원소의 값"
      - "전위(++a)는 증가 후 사용, 후위(a++)는 사용 후 증가"
      - "정수 나눗셈은 몫만(7 / 2 = 3), % 는 나머지. 비트 연산 &(AND), |(OR), ^(XOR), ~(NOT), <<, >>"
      - "static 지역 변수는 함수가 끝나도 값이 유지되고 한 번만 초기화"
      - "문자열은 '\\0' 으로 끝남. strlen 은 널 문자를 세지 않음"
      - "구조체 멤버 접근: 변수는 점(.), 포인터는 화살표(->)"
      - "재귀 함수는 종료 조건부터 확인하고 호출 순서를 종이에 적어 추적"
    quiz:
      - q: "다음 프로그램의 출력은?"
        code: |
          #include <stdio.h>
          int main() {
              int a[5] = {1, 2, 3, 4, 5};
              int *p = a + 1;
              printf("%d %d", *p + 2, *(p + 2));
              return 0;
          }
        a: "4 4  (*p 는 2 이므로 2 + 2 = 4, *(p + 2) 는 a[3] = 4)"
      - q: "다음 프로그램의 출력은?"
        code: |
          #include <stdio.h>
          int f(int n) {
              if (n <= 1) return 1;
              return n * f(n - 1);
          }
          int main() {
              printf("%d", f(5));
              return 0;
          }
        a: "120  (5 × 4 × 3 × 2 × 1)"
      - q: "다음 프로그램의 출력은?"
        code: |
          #include <stdio.h>
          int main() {
              printf("%d", (5 & 3) | (4 ^ 1));
              return 0;
          }
        a: "5  (5 & 3 = 1, 4 ^ 1 = 5, 1 | 5 = 5)"

  - id: eip-10
    title: "Java"
    points:
      - "하위 클래스 객체를 만들면 상위 클래스 생성자가 먼저 실행(super() 자동 호출)"
      - "오버라이딩: 상속받은 메서드 재정의(이름·매개변수 같음) / 오버로딩: 같은 이름, 다른 매개변수"
      - "업캐스팅(상위 타입 변수에 하위 객체)해도 오버라이딩된 메서드는 실제 객체의 것이 실행(동적 바인딩). 단, 필드와 static 메서드는 변수 타입 기준"
      - "static 멤버는 클래스에 하나만 존재하고 모든 객체가 공유"
      - "추상 클래스(abstract)는 객체 생성 불가, 인터페이스는 implements 로 구현. 클래스 상속은 extends 로 하나만"
      - "문자열 비교: == 는 참조(주소) 비교, equals() 는 내용 비교"
      - "접근 제어자: public > protected > (default) > private"
      - "예외 처리: try → catch → finally(항상 실행)"
    quiz:
      - q: "다음 프로그램의 출력은?"
        code: |
          class A {
              A() { System.out.print("A"); }
              void show() { System.out.print("1"); }
          }
          class B extends A {
              B() { System.out.print("B"); }
              void show() { System.out.print("2"); }
          }
          public class Main {
              public static void main(String[] args) {
                  A obj = new B();
                  obj.show();
              }
          }
        a: "AB2  (상위 생성자 A → 하위 생성자 B → 오버라이딩된 B 의 show)"
      - q: "다음 프로그램의 출력은?"
        code: |
          class C {
              static int cnt = 0;
              C() { cnt++; }
          }
          public class Main {
              public static void main(String[] args) {
                  new C(); new C(); new C();
                  System.out.print(C.cnt);
              }
          }
        a: "3  (static 변수는 모든 객체가 공유)"
      - q: "다음 프로그램의 출력은?"
        code: |
          public class Main {
              public static void main(String[] args) {
                  String a = "hi";
                  String b = new String("hi");
                  System.out.print((a == b) + " " + a.equals(b));
              }
          }
        a: "false true  (== 는 참조 비교, equals 는 내용 비교)"

  - id: eip-11
    title: "Python"
    points:
      - "슬라이싱 a[시작:끝:간격] 은 끝 인덱스를 포함하지 않음. a[::-1] 은 뒤집기, a[-1] 은 마지막 원소"
      - "리스트는 변경 가능, 튜플은 변경 불가, 집합(set)은 중복 없음·순서 없음, 딕셔너리는 키-값"
      - "range(a, b, c) 는 a 부터 b 직전까지 c 간격"
      - "리스트 컴프리헨션: [식 for 변수 in 반복 if 조건]"
      - "딕셔너리 d.get(키, 기본값) 은 키가 없으면 기본값 반환. d.keys(), d.values(), d.items()"
      - "람다: lambda x: x * 2. map, filter 와 자주 함께 사용"
      - "나눗셈 / 는 실수, // 는 몫, % 는 나머지, ** 는 거듭제곱"
      - "클래스 메서드의 첫 매개변수는 self, 생성자는 __init__"
    quiz:
      - q: "다음 프로그램의 출력은?"
        code: |
          a = [1, 2, 3, 4, 5]
          print(a[1:4], a[::-1][0], a[-2])
        a: "[2, 3, 4] 5 4"
      - q: "다음 프로그램의 출력은?"
        code: |
          d = {'a': 1, 'b': 2}
          d['c'] = d.get('a', 0) + d.get('z', 10)
          print(sum(d.values()))
        a: "14  (d['c'] = 1 + 10 = 11, 합계 1 + 2 + 11)"
      - q: "다음 프로그램의 출력은?"
        code: |
          print([x * x for x in range(5) if x % 2 == 0])
        a: "[0, 4, 16]"

  - id: eip-12
    title: "운영체제 기초"
    points:
      - "프로세스 상태: 생성 → 준비 → 실행 → 대기 → 종료. 준비 → 실행은 디스패치, 실행 → 준비는 타임아웃, 실행 → 대기는 블록, 대기 → 준비는 웨이크업"
      - "비선점 스케줄링: FCFS, SJF, HRN, 우선순위 / 선점: RR(시간 할당량), SRT, 다단계 큐, 다단계 피드백 큐"
      - "HRN 우선순위 = (대기 시간 + 서비스 시간) / 서비스 시간. 값이 클수록 먼저"
      - "교착 상태 4조건: 상호 배제, 점유와 대기, 비선점, 환형 대기. 해결: 예방, 회피(은행원 알고리즘), 발견, 회복"
      - "페이지 교체: FIFO, LRU(가장 오래 안 쓴 것), LFU(가장 적게 쓴 것), OPT(앞으로 가장 오래 안 쓸 것)"
      - "스래싱: 페이지 교체가 너무 잦아 처리율이 떨어지는 현상. 워킹 셋: 일정 시간 동안 자주 참조하는 페이지 집합"
      - "유닉스 명령: chmod(권한), chown(소유자), ls, cat, grep, ps, kill, fork(프로세스 생성)"
      - "기억 장치 배치 전략: 최초 적합, 최적 적합(가장 작은 공간), 최악 적합(가장 큰 공간)"
    quiz:
      - q: "대기 시간 10, 서비스 시간 5 인 작업의 HRN 우선순위는?"
        a: "(10 + 5) / 5 = 3"
      - q: "교착 상태의 필요 조건 4가지를 쓰시오."
        a: "상호 배제, 점유와 대기, 비선점, 환형 대기"
      - q: "페이지 프레임 3개, 참조열 1 2 3 1 4 일 때 FIFO 의 페이지 부재 횟수는?"
        a: "4회 (1, 2, 3 적재 시 3회 부재, 1 은 적중, 4 는 부재로 가장 먼저 들어온 1 을 교체)"

  - id: eip-13
    title: "네트워크 기초"
    points:
      - "OSI 7계층과 전송 단위: 물리(비트) → 데이터 링크(프레임) → 네트워크(패킷) → 전송(세그먼트) → 세션 → 표현 → 응용(데이터)"
      - "계층별 장비: 물리(리피터, 허브), 데이터 링크(브리지, 스위치), 네트워크(라우터), 전 계층(게이트웨이)"
      - "TCP: 연결형, 신뢰성(순서·오류·흐름 제어) / UDP: 비연결형, 빠르지만 신뢰성 없음"
      - "ARP: IP → MAC 변환 / RARP: MAC → IP 변환 / ICMP: 오류·제어 메시지(ping) / NAT: 사설 IP ↔ 공인 IP 변환"
      - "IPv4 는 32비트, IPv6 는 128비트(16비트씩 8부분, 콜론 구분). 전환 기술: 듀얼 스택, 터널링, 주소 변환"
      - "서브넷팅: /26 은 호스트 비트 6개 → 주소 64개, 사용 가능 호스트 62개(네트워크·브로드캐스트 제외)"
      - "라우팅 프로토콜: RIP(거리 벡터, 최대 15홉), OSPF(링크 상태, 다익스트라), BGP(자율 시스템 간)"
      - "흐름 제어: 정지-대기, 슬라이딩 윈도우 / 오류 제어 ARQ: Stop-and-Wait, Go-Back-N, Selective Repeat"
    quiz:
      - q: "192.168.1.0/24 를 /26 으로 나누면 서브넷 수와 서브넷당 사용 가능 호스트 수는?"
        a: "서브넷 4개, 서브넷당 62개 (64 - 2)"
      - q: "IP 주소를 MAC 주소로 바꾸는 프로토콜과 그 반대 프로토콜은?"
        a: "ARP, 반대는 RARP"
      - q: "RIP 와 OSPF 의 차이를 쓰시오."
        a: "RIP 는 홉 수 기준의 거리 벡터 방식으로 최대 15홉까지 지원하는 소규모용, OSPF 는 링크 상태 방식으로 다익스트라 알고리즘을 써 최단 경로를 계산하는 대규모용"

  - id: eip-14
    title: "제품 패키징과 형상 관리"
    points:
      - "패키징은 사용자 중심으로. 릴리스 노트에는 헤더, 개요, 목적, 이슈 요약, 재현 항목, 수정·개선 내용, 사용자 영향도, 노트, 면책 조항, 연락처"
      - "DRM 구성 요소: 콘텐츠 제공자, 콘텐츠 분배자, 패키저(암호화해 묶음), 보안 컨테이너, DRM 컨트롤러, 클리어링 하우스(키·라이선스 관리), 콘텐츠 소비자"
      - "형상 관리 절차: 형상 식별 → 형상 통제(변경 요청 검토·승인) → 형상 감사 → 형상 기록(보고)"
      - "버전 관리 방식: 공유 폴더(RCS, SCCS), 클라이언트/서버(CVS, SVN), 분산 저장소(Git)"
      - "버전 관리 용어: 체크아웃(받아 오기), 체크인·커밋(반영), 임포트(최초 등록), 동기화(업데이트)"
      - "빌드 자동화 도구: Ant, Maven, Gradle, Jenkins(지속적 통합)"
      - "매뉴얼: 설치 매뉴얼(설치 과정·환경), 사용자 매뉴얼(기능 사용법)"
    quiz:
      - q: "형상 관리의 절차 4단계를 쓰시오."
        a: "형상 식별 → 형상 통제 → 형상 감사 → 형상 기록"
      - q: "DRM 에서 키 관리와 라이선스 발급을 맡는 구성 요소는?"
        a: "클리어링 하우스(Clearing House)"
      - q: "Git 과 SVN 의 저장소 방식 차이는?"
        a: "SVN 은 중앙 서버에 저장소가 하나 있는 중앙 집중(클라이언트/서버) 방식, Git 은 각 개발자가 로컬 저장소를 가지는 분산 방식"
