# 정보처리기사 실기 학습 단원 — 직접 정리한 요약·연습문제(기출 원문·교재 내용 아님)
# 순서는 프로그래밍 언어 → 자료구조 → SQL → 운영체제·네트워크 → 설계·관리 과목 순(배점 큰 것 먼저).
# ※ 출제기준은 개정될 수 있으니 큐넷 공고의 최신 출제기준을 확인하세요.
exam: eip
units:
  - id: eip-01
    title: "C 언어 기초 — 자료형·변수·입출력·연산자"
    points:
      - "자료형 크기(32/64비트 공통): char 1, short 2, int 4, long long 8, float 4, double 8 바이트"
      - "서식 문자: %d(정수), %f(실수), %c(문자), %s(문자열), %p(주소), %x(16진수). printf 는 서식과 인자 개수·순서가 맞아야 함"
      - "정수끼리의 나눗셈은 몫만 남는다(7 / 2 = 3). 실수 결과가 필요하면 7 / 2.0 처럼 한쪽을 실수로"
      - "% 는 나머지, 음수에서는 부호가 왼쪽 피연산자를 따른다(-7 % 2 = -1)"
      - "전위 ++a 는 증가 후 사용, 후위 a++ 는 사용 후 증가. 한 문장에 같은 변수를 여러 번 쓰면 순서를 손으로 적어 추적"
      - "비트 연산: &(AND), |(OR), ^(XOR), ~(NOT), <<(왼쪽 시프트 = ×2), >>(오른쪽 시프트 = ÷2)"
      - "연산자 우선순위: 단항 → 산술 → 시프트 → 관계 → 비트 → 논리 → 삼항 → 대입. 헷갈리면 괄호로 묶어 계산"
      - "형 변환: 작은 자료형이 큰 자료형으로 자동 승격. (int)3.9 처럼 강제 변환하면 소수점 이하는 버린다"
    quiz:
      - q: "다음 프로그램의 출력은?"
        code: |
          #include <stdio.h>
          int main() {
              int a = 7, b = 2;
              printf("%d %d %.1f", a / b, a % b, (float)a / b);
              return 0;
          }
        a: "3 1 3.5  (정수 나눗셈은 몫만, % 는 나머지, 한쪽을 실수로 바꾸면 실수 나눗셈)"
      - q: "다음 프로그램의 출력은?"
        code: |
          #include <stdio.h>
          int main() {
              int a = 5;
              printf("%d %d %d", a++, ++a, a);
              return 0;
          }
        a: "5 7 7  (a++ 는 5 를 쓰고 6, ++a 는 7 로 올린 뒤 7, 마지막 a 는 7)"
      - q: "다음 프로그램의 출력은?"
        code: |
          #include <stdio.h>
          int main() {
              printf("%d", (5 & 3) | (4 ^ 1));
              return 0;
          }
        a: "5  (5 & 3 = 1, 4 ^ 1 = 5, 1 | 5 = 5)"
      - q: "정수 n 에 2 를 곱하는 연산을 비트 연산자로 쓰시오."
        a: "n << 1  (왼쪽으로 1비트 시프트하면 2배)"

  - id: eip-02
    title: "C 제어문과 배열·문자열"
    points:
      - "for(초기식; 조건식; 증감식) 은 조건식이 거짓이 되는 순간 끝난다. 반복 횟수는 '처음 값 → 마지막 값'을 적어 세는 것이 확실"
      - "while 은 조건을 먼저 검사, do-while 은 본문을 한 번 실행한 뒤 검사하므로 최소 1회 실행"
      - "switch 는 break 가 없으면 다음 case 로 계속 흘러간다(fall-through). 기출 단골"
      - "continue 는 이번 반복만 건너뛰고, break 는 반복문 자체를 빠져나온다"
      - "배열 선언 int a[5] 의 첨자는 0~4. 초기화 int a[5] = {1, 2} 면 나머지는 0 으로 채워진다"
      - "2차원 배열 a[행][열] 은 행 우선으로 저장. a[i][j] 는 *(*(a + i) + j) 와 같다"
      - "문자열은 문자 배열이고 끝에 널 문자 '\\0' 이 붙는다. char s[] = \"abc\" 의 크기는 4바이트"
      - "문자열 함수: strlen(길이, 널 제외), strcpy(복사), strcat(이어 붙이기), strcmp(비교, 같으면 0)"
    quiz:
      - q: "다음 프로그램의 출력은?"
        code: |
          #include <stdio.h>
          int main() {
              int i, sum = 0;
              for (i = 1; i <= 10; i++) {
                  if (i % 3 == 0) continue;
                  if (i > 8) break;
                  sum += i;
              }
              printf("%d", sum);
              return 0;
          }
        a: "27  (3, 6, 9 는 건너뛰고 1+2+4+5+7+8 = 27, i 가 9 일 때 continue, 10 은 break 전에 조건에서 제외)"
      - q: "다음 프로그램의 출력은?"
        code: |
          #include <stdio.h>
          int main() {
              int n = 2;
              switch (n) {
                  case 1: printf("A");
                  case 2: printf("B");
                  case 3: printf("C"); break;
                  default: printf("D");
              }
              return 0;
          }
        a: "BC  (case 2 부터 실행되고 break 가 없어 case 3 까지 흘러간다)"
      - q: "다음 프로그램의 출력은?"
        code: |
          #include <stdio.h>
          int main() {
              char s[] = "abcde";
              printf("%d %c", strlen(s), s[2]);
              return 0;
          }
        a: "5 c  (strlen 은 널 문자를 세지 않고, 첨자는 0부터이므로 s[2] 는 세 번째 문자)"

  - id: eip-03
    title: "C 함수·구조체·포인터·메모리"
    points:
      - "배열 이름은 첫 원소의 주소다. a[i] 는 *(a + i) 와 같다"
      - "포인터 연산 p + 1 은 다음 원소의 주소다. *p + 1 은 값에 1 을 더한 것, *(p + 1) 은 다음 원소의 값 — 구분해서 읽어야 한다"
      - "값에 의한 호출은 복사본이 넘어가 원본이 안 바뀌고, 주소를 넘기면(포인터 매개변수) 원본이 바뀐다"
      - "이중 포인터 **p 는 포인터의 주소를 담는다. 함수 안에서 포인터 자체를 바꿔야 할 때 쓴다"
      - "구조체 멤버 접근은 변수면 점(.), 포인터면 화살표(->)"
      - "static 지역 변수는 함수가 끝나도 값이 유지되고 초기화는 한 번만 된다"
      - "동적 할당 malloc/calloc 은 힙에 잡고 free 로 반납한다. calloc 은 0 으로 초기화한다"
      - "재귀 함수는 종료 조건을 먼저 확인하고, 호출과 복귀 순서를 종이에 적어 추적한다"
    quiz:
      - q: "다음 프로그램의 출력은?"
        code: |
          #include <stdio.h>
          int main() {
              int a[5] = {1, 2, 3, 4, 5};
              int *p = a + 1;
              printf("%d %d", *p + 2, *(p + 2));
              return 0;
          }
        a: "4 4  (*p 는 2 이므로 2 + 2 = 4, *(p + 2) 는 a[3] = 4)"
      - q: "다음 프로그램의 출력은?"
        code: |
          #include <stdio.h>
          void swap(int *x, int *y) {
              int t = *x; *x = *y; *y = t;
          }
          int main() {
              int a = 1, b = 2;
              swap(&a, &b);
              printf("%d %d", a, b);
              return 0;
          }
        a: "2 1  (주소를 넘겼으므로 원본이 바뀐다)"
      - q: "다음 프로그램의 출력은?"
        code: |
          #include <stdio.h>
          int f(int n) {
              if (n <= 1) return 1;
              return n * f(n - 1);
          }
          int main() {
              printf("%d", f(5));
              return 0;
          }
        a: "120  (5 × 4 × 3 × 2 × 1)"
      - q: "다음 프로그램의 출력은?"
        code: |
          #include <stdio.h>
          void cnt() {
              static int n = 0;
              n++;
              printf("%d", n);
          }
          int main() {
              cnt(); cnt(); cnt();
              return 0;
          }
        a: "123  (static 지역 변수는 값이 유지되고 초기화는 한 번만)"

  - id: eip-04
    title: "Java 기본 문법과 배열·문자열"
    points:
      - "모든 코드는 클래스 안에 있고 시작점은 public static void main(String[] args)"
      - "기본형(int, double, boolean, char 등)은 값을 담고, 참조형(배열, 클래스, String)은 주소를 담는다"
      - "문자열 비교는 == 가 아니라 equals(). == 는 참조(주소)를 비교한다"
      - "String 은 변경 불가(immutable)라 더하기를 반복하면 객체가 계속 생긴다. 반복 연결은 StringBuilder"
      - "배열 선언 int[] a = new int[5] 의 기본값은 0, 참조형 배열은 null, boolean 은 false"
      - "배열 길이는 a.length(괄호 없음), 문자열 길이는 s.length()(괄호 있음)"
      - "향상된 for 문: for (int x : a) 는 배열·컬렉션을 처음부터 끝까지 순회한다"
      - "형 변환: 작은 타입 → 큰 타입은 자동, 큰 타입 → 작은 타입은 (int) 처럼 명시해야 하고 값이 잘릴 수 있다"
    quiz:
      - q: "다음 프로그램의 출력은?"
        code: |
          public class Main {
              public static void main(String[] args) {
                  String a = "hi";
                  String b = new String("hi");
                  System.out.print((a == b) + " " + a.equals(b));
              }
          }
        a: "false true  (== 는 참조 비교, equals 는 내용 비교)"
      - q: "다음 프로그램의 출력은?"
        code: |
          public class Main {
              public static void main(String[] args) {
                  int[] a = {3, 1, 4, 1, 5};
                  int max = a[0];
                  for (int x : a) if (x > max) max = x;
                  System.out.print(a.length + " " + max);
              }
          }
        a: "5 5  (배열 길이는 length 필드, 최댓값은 5)"
      - q: "Java 에서 문자열을 반복해서 이어 붙일 때 String 대신 쓰는 클래스는?"
        a: "StringBuilder (String 은 변경 불가라 매번 새 객체가 생겨 비효율적)"

  - id: eip-05
    title: "Java 클래스·상속·인터페이스·예외"
    points:
      - "하위 클래스 객체를 만들면 상위 클래스 생성자가 먼저 실행된다(super() 가 자동 호출)"
      - "오버라이딩은 상속받은 메서드를 재정의(이름·매개변수 동일), 오버로딩은 같은 이름에 매개변수가 다른 메서드"
      - "업캐스팅해도 오버라이딩된 메서드는 실제 객체의 것이 실행된다(동적 바인딩). 단 필드와 static 메서드는 변수 타입 기준"
      - "static 멤버는 클래스에 하나만 존재하고 모든 객체가 공유한다"
      - "추상 클래스(abstract)는 객체를 만들 수 없고 extends 로 하나만 상속, 인터페이스는 implements 로 여러 개 구현"
      - "접근 제어자 범위: public > protected > (default, 같은 패키지) > private"
      - "예외 처리는 try → catch → finally 순이고 finally 는 예외 유무와 상관없이 항상 실행된다"
      - "this 는 자기 객체, super 는 상위 클래스를 가리킨다. 생성자에서 this(...) 와 super(...) 는 첫 줄에만 올 수 있다"
    quiz:
      - q: "다음 프로그램의 출력은?"
        code: |
          class A {
              A() { System.out.print("A"); }
              void show() { System.out.print("1"); }
          }
          class B extends A {
              B() { System.out.print("B"); }
              void show() { System.out.print("2"); }
          }
          public class Main {
              public static void main(String[] args) {
                  A obj = new B();
                  obj.show();
              }
          }
        a: "AB2  (상위 생성자 A → 하위 생성자 B → 오버라이딩된 B 의 show)"
      - q: "다음 프로그램의 출력은?"
        code: |
          class C {
              static int cnt = 0;
              C() { cnt++; }
          }
          public class Main {
              public static void main(String[] args) {
                  new C(); new C(); new C();
                  System.out.print(C.cnt);
              }
          }
        a: "3  (static 변수는 모든 객체가 공유)"
      - q: "다음 프로그램의 출력은?"
        code: |
          public class Main {
              public static void main(String[] args) {
                  try {
                      int x = 10 / 0;
                  } catch (ArithmeticException e) {
                      System.out.print("E");
                  } finally {
                      System.out.print("F");
                  }
              }
          }
        a: "EF  (0 으로 나눠 예외 발생 → catch → finally 는 항상 실행)"
      - q: "추상 클래스와 인터페이스의 차이를 쓰시오."
        a: "추상 클래스는 extends 로 하나만 상속받고 필드와 구현된 메서드를 가질 수 있으며, 인터페이스는 implements 로 여러 개를 구현할 수 있고 기본적으로 추상 메서드와 상수로 구성된다"

  - id: eip-06
    title: "Python"
    points:
      - "슬라이싱 a[시작:끝:간격] 은 끝 인덱스를 포함하지 않는다. a[::-1] 은 뒤집기, a[-1] 은 마지막 원소"
      - "리스트는 변경 가능, 튜플은 변경 불가, 집합(set)은 중복 없음·순서 없음, 딕셔너리는 키-값"
      - "range(a, b, c) 는 a 부터 b 직전까지 c 간격"
      - "리스트 컴프리헨션: [식 for 변수 in 반복 if 조건]"
      - "딕셔너리 d.get(키, 기본값) 은 키가 없으면 기본값을 돌려준다. d.keys(), d.values(), d.items()"
      - "람다는 lambda x: x * 2 형태로 map, filter 와 함께 자주 쓴다"
      - "나눗셈 / 는 실수, // 는 몫, % 는 나머지, ** 는 거듭제곱"
      - "클래스 메서드의 첫 매개변수는 self, 생성자는 __init__. 들여쓰기가 블록을 결정하므로 간격을 정확히 본다"
    quiz:
      - q: "다음 프로그램의 출력은?"
        code: |
          a = [1, 2, 3, 4, 5]
          print(a[1:4], a[::-1][0], a[-2])
        a: "[2, 3, 4] 5 4"
      - q: "다음 프로그램의 출력은?"
        code: |
          d = {'a': 1, 'b': 2}
          d['c'] = d.get('a', 0) + d.get('z', 10)
          print(sum(d.values()))
        a: "14  (d['c'] = 1 + 10 = 11, 합계 1 + 2 + 11)"
      - q: "다음 프로그램의 출력은?"
        code: |
          print([x * x for x in range(5) if x % 2 == 0])
        a: "[0, 4, 16]"
      - q: "다음 프로그램의 출력은?"
        code: |
          s = {1, 2, 2, 3}
          t = (1, 2, 3)
          print(len(s), t[1], 7 // 2, 7 / 2)
        a: "3 2 3 3.5  (집합은 중복을 없애고, // 는 몫, / 는 실수 나눗셈)"

  - id: eip-07
    title: "자료구조 ① 리스트·스택·큐"
    points:
      - "배열은 인덱스로 바로 접근(O(1))하지만 중간 삽입·삭제에 원소 이동이 필요하고, 연결 리스트는 접근이 O(n) 이지만 삽입·삭제는 포인터만 고치면 된다"
      - "단일 연결 리스트는 다음 노드만 가리켜 앞으로만 이동하고, 이중 연결 리스트는 앞뒤 포인터가 있어 양방향 이동과 삭제가 쉽다"
      - "노드 삽입은 '새 노드가 다음을 가리키게 한 뒤' 앞 노드가 새 노드를 가리키게 한다. 순서를 바꾸면 뒤쪽 연결이 끊긴다"
      - "스택은 후입선출(LIFO), push·pop·top. 함수 호출(복귀 주소), 수식 변환, 재귀, 되돌리기에 쓴다"
      - "큐는 선입선출(FIFO), enqueue·dequeue. 작업 스케줄링, 버퍼, 프린터 대기열에 쓴다"
      - "원형 큐는 rear 가 끝에 닿아도 앞의 빈 자리를 쓰도록 (rear + 1) % n 으로 순환한다. 보통 한 칸을 비워 두고 포화와 공백을 구분한다"
      - "데크(Deque)는 양쪽에서 삽입·삭제가 가능한 자료구조다"
      - "중위 → 후위 변환은 연산자를 스택에 쌓고 우선순위가 낮은 연산자를 만나면 꺼낸다. 후위 표기식 계산은 피연산자를 스택에 쌓고 연산자를 만나면 두 개를 꺼내 계산한다"
    quiz:
      - q: "스택과 큐의 입출력 방식을 각각 쓰시오."
        a: "스택은 후입선출(LIFO), 큐는 선입선출(FIFO)"
      - q: "중위 표기식 A + B * C 를 후위 표기식으로 바꾸시오."
        a: "A B C * +  (곱셈의 우선순위가 높아 먼저 처리)"
      - q: "크기 5 인 원형 큐에서 rear 가 4 일 때 다음 삽입 위치를 구하는 식을 쓰시오."
        a: "(rear + 1) % 5 = 0  (처음 자리로 돌아간다)"
      - q: "후위 표기식 3 4 + 2 * 의 계산 결과는?"
        a: "14  (3 + 4 = 7, 7 × 2 = 14)"

  - id: eip-08
    title: "자료구조 ② 트리·힙·그래프·정렬"
    points:
      - "이진 트리 순회: 전위(루트 → 왼쪽 → 오른쪽), 중위(왼쪽 → 루트 → 오른쪽), 후위(왼쪽 → 오른쪽 → 루트). 루트를 언제 방문하는지로 외운다"
      - "이진 탐색 트리는 왼쪽이 작고 오른쪽이 크다. 중위 순회하면 오름차순으로 정렬된다"
      - "노드가 n 개인 완전 이진 트리의 높이는 log2(n) 수준이고, 배열로 저장하면 i 의 자식은 2i, 2i+1(1부터 시작할 때)"
      - "힙은 완전 이진 트리로, 최대 힙은 부모가 자식보다 크거나 같고 최소 힙은 작거나 같다. 루트가 항상 최댓값 또는 최솟값이라 우선순위 큐에 쓴다"
      - "그래프 탐색: DFS 는 스택(또는 재귀)으로 깊이 우선, BFS 는 큐로 너비 우선. 최단 경로(간선 수 기준)는 BFS"
      - "그래프 표현: 인접 행렬은 간선 확인이 빠르지만 n² 메모리, 인접 리스트는 간선이 적을 때 효율적"
      - "정렬 평균 시간: 선택·삽입·버블 O(n²), 퀵·병합·힙 O(n log n). 퀵은 최악 O(n²), 병합은 항상 O(n log n) 이지만 추가 메모리가 필요"
      - "안정 정렬(같은 값의 순서 유지)은 삽입·버블·병합, 불안정 정렬은 선택·퀵·힙"
    quiz:
      - q: "전위 순회와 후위 순회의 방문 순서를 각각 쓰시오."
        a: "전위는 루트 → 왼쪽 → 오른쪽, 후위는 왼쪽 → 오른쪽 → 루트"
      - q: "이진 탐색 트리를 중위 순회하면 어떤 순서로 나오는가?"
        a: "오름차순(작은 값부터 큰 값 순)"
      - q: "퀵 정렬과 병합 정렬의 평균·최악 시간 복잡도를 각각 쓰시오."
        a: "퀵은 평균 O(n log n), 최악 O(n²) / 병합은 평균과 최악 모두 O(n log n)"
      - q: "최대 힙에서 루트 노드가 가지는 값은?"
        a: "전체에서 가장 큰 값"

  - id: eip-09
    title: "SQL 응용"
    points:
      - "DDL: CREATE, ALTER, DROP, TRUNCATE / DML: SELECT, INSERT, UPDATE, DELETE / DCL: GRANT, REVOKE, COMMIT, ROLLBACK"
      - "트랜잭션의 ACID: 원자성(전부 아니면 전무), 일관성, 격리성(동시 실행 간섭 없음), 지속성(완료 결과는 영구 저장)"
      - "트랜잭션 상태: 활동 → 부분 완료 → 완료(Commit), 실패 → 철회(Rollback)"
      - "JOIN: INNER(양쪽 모두 있는 행), LEFT OUTER(왼쪽 전부 + 오른쪽 일치), CROSS(곱집합), SELF(자기 자신과 조인)"
      - "GROUP BY 로 묶은 결과를 거를 때는 WHERE 가 아니라 HAVING 을 쓴다. 실행 순서는 FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY"
      - "집계 함수 COUNT, SUM, AVG, MAX, MIN 은 NULL 을 제외하고 계산한다. COUNT(*) 만 NULL 행도 센다"
      - "윈도 함수: ROW_NUMBER(연속 번호), RANK(동점 뒤 건너뜀), DENSE_RANK(동점 뒤 안 건너뜀)를 OVER(PARTITION BY ... ORDER BY ...) 와 함께 쓴다"
      - "뷰는 가상 테이블로 독립성과 보안에 유리하지만 인덱스를 만들 수 없고 정의 변경이 불가해 삭제 후 재생성한다"
      - "DELETE 는 행을 지우고 롤백 가능, TRUNCATE 는 전체를 비우고 빠르며 되돌리기 어렵다, DROP 은 테이블 자체를 없앤다"
    quiz:
      - q: "트랜잭션의 4가지 특성(ACID)을 쓰고 각각 한 줄로 설명하시오."
        a: "원자성(연산이 전부 수행되거나 전부 취소), 일관성(수행 전후 데이터베이스가 일관된 상태 유지), 격리성(동시 실행 트랜잭션이 서로 간섭하지 않음), 지속성(완료된 결과는 영구히 반영)"
      - q: "GROUP BY 결과에 조건을 거는 절과, WHERE 와의 차이를 쓰시오."
        a: "HAVING 절을 쓴다. WHERE 는 그룹으로 묶기 전 개별 행을 거르고, HAVING 은 묶은 뒤 그룹 단위로 거른다"
      - q: "RANK 와 DENSE_RANK 의 차이를 쓰시오."
        a: "동점이 있을 때 RANK 는 다음 순위를 건너뛰고(1, 1, 3), DENSE_RANK 는 건너뛰지 않는다(1, 1, 2)"
      - q: "사원 테이블에서 부서별 평균 급여가 300 이상인 부서와 평균을 구하는 SQL 을 쓰시오."
        a: "SELECT 부서, AVG(급여) FROM 사원 GROUP BY 부서 HAVING AVG(급여) >= 300;"

  - id: eip-10
    title: "운영체제 기초"
    points:
      - "프로세스 상태: 생성 → 준비 → 실행 → 대기 → 종료. 준비 → 실행은 디스패치, 실행 → 준비는 타임아웃, 실행 → 대기는 블록, 대기 → 준비는 웨이크업"
      - "비선점 스케줄링: FCFS, SJF, HRN, 우선순위 / 선점: RR(시간 할당량), SRT, 다단계 큐, 다단계 피드백 큐"
      - "HRN 우선순위 = (대기 시간 + 서비스 시간) / 서비스 시간. 값이 클수록 먼저 처리"
      - "교착 상태 4조건: 상호 배제, 점유와 대기, 비선점, 환형 대기. 해결은 예방, 회피(은행원 알고리즘), 발견, 회복"
      - "페이지 교체: FIFO, LRU(가장 오래 안 쓴 것), LFU(가장 적게 쓴 것), OPT(앞으로 가장 오래 안 쓸 것)"
      - "스래싱은 페이지 교체가 너무 잦아 처리율이 떨어지는 현상, 워킹 셋은 일정 시간 동안 자주 참조하는 페이지 집합"
      - "기억 장치 배치 전략: 최초 적합, 최적 적합(가장 작은 빈 공간), 최악 적합(가장 큰 빈 공간)"
      - "유닉스 명령: chmod(권한), chown(소유자), ps(프로세스), kill(종료), grep(검색), fork(프로세스 생성)"
    quiz:
      - q: "대기 시간 10, 서비스 시간 5 인 작업의 HRN 우선순위는?"
        a: "(10 + 5) / 5 = 3"
      - q: "교착 상태의 필요 조건 4가지를 쓰시오."
        a: "상호 배제, 점유와 대기, 비선점, 환형 대기"
      - q: "페이지 프레임 3개, 참조열 1 2 3 1 4 일 때 FIFO 의 페이지 부재 횟수는?"
        a: "4회 (1, 2, 3 적재 시 3회 부재, 1 은 적중, 4 는 부재로 가장 먼저 들어온 1 을 교체)"
      - q: "선점 스케줄링과 비선점 스케줄링의 차이를 쓰시오."
        a: "선점은 실행 중인 프로세스의 CPU 를 빼앗아 다른 프로세스에 줄 수 있고, 비선점은 실행이 끝날 때까지 빼앗지 않는다"

  - id: eip-11
    title: "네트워크 기초"
    points:
      - "OSI 7계층과 전송 단위: 물리(비트) → 데이터 링크(프레임) → 네트워크(패킷) → 전송(세그먼트) → 세션 → 표현 → 응용(데이터)"
      - "계층별 장비: 물리(리피터, 허브), 데이터 링크(브리지, 스위치), 네트워크(라우터), 전 계층(게이트웨이)"
      - "TCP 는 연결형으로 순서·오류·흐름 제어를 하고, UDP 는 비연결형으로 빠르지만 신뢰성이 없다"
      - "ARP 는 IP → MAC, RARP 는 MAC → IP, ICMP 는 오류·제어 메시지(ping), NAT 는 사설 IP 와 공인 IP 변환"
      - "IPv4 는 32비트, IPv6 는 128비트(16비트씩 8부분, 콜론 구분). 전환 기술은 듀얼 스택, 터널링, 주소 변환"
      - "서브넷팅: /26 은 호스트 비트 6개 → 주소 64개, 사용 가능 호스트 62개(네트워크·브로드캐스트 주소 제외)"
      - "라우팅 프로토콜: RIP(거리 벡터, 최대 15홉), OSPF(링크 상태, 다익스트라), BGP(자율 시스템 간)"
      - "흐름 제어는 정지-대기와 슬라이딩 윈도우, 오류 제어 ARQ 는 Stop-and-Wait, Go-Back-N, Selective Repeat"
    quiz:
      - q: "192.168.1.0/24 를 /26 으로 나누면 서브넷 수와 서브넷당 사용 가능 호스트 수는?"
        a: "서브넷 4개, 서브넷당 62개 (64 - 2)"
      - q: "IP 주소를 MAC 주소로 바꾸는 프로토콜과 그 반대 프로토콜은?"
        a: "ARP, 반대는 RARP"
      - q: "RIP 와 OSPF 의 차이를 쓰시오."
        a: "RIP 는 홉 수 기준의 거리 벡터 방식으로 최대 15홉까지 지원하는 소규모용, OSPF 는 링크 상태 방식으로 다익스트라 알고리즘을 써 최단 경로를 계산하는 대규모용"
      - q: "OSI 7계층에서 네트워크 계층의 전송 단위와 대표 장비는?"
        a: "전송 단위는 패킷, 대표 장비는 라우터"

  - id: eip-12
    title: "개발환경 구축과 형상 관리"
    points:
      - "개발환경 도구 분류: 빌드(Ant, Maven, Gradle), 구현(IDE), 테스트(JUnit 등), 형상 관리(Git, SVN)"
      - "서버 구성은 웹 서버(Apache, Nginx, IIS) – WAS(Tomcat, WebLogic, JEUS) – DB 서버의 3계층 구조를 실무에서 쓴다"
      - "웹 서버는 정적 콘텐츠를, WAS 는 동적 처리와 트랜잭션을 담당한다"
      - "형상 관리 절차: 형상 식별 → 형상 통제(변경 요청 검토·승인) → 형상 감사 → 형상 기록(보고)"
      - "버전 관리 방식: 공유 폴더(RCS, SCCS), 클라이언트/서버(CVS, SVN), 분산 저장소(Git)"
      - "버전 관리 용어: 체크아웃(받아 오기), 체크인·커밋(반영), 임포트(최초 등록), 동기화(업데이트)"
      - "지속적 통합(CI)은 변경을 자주 통합하고 자동 빌드·테스트로 결함을 일찍 찾는 방식이며 대표 도구는 Jenkins"
      - "빌드 자동화 도구 비교: Ant(XML, 절차 기술), Maven(의존성 관리와 생명주기), Gradle(Groovy/Kotlin 스크립트)"
    quiz:
      - q: "형상 관리의 절차 4단계를 쓰시오."
        a: "형상 식별 → 형상 통제 → 형상 감사 → 형상 기록"
      - q: "웹 서버와 WAS 의 역할 차이를 쓰시오."
        a: "웹 서버는 HTML·이미지 같은 정적 콘텐츠를 전달하고, WAS 는 애플리케이션 실행과 트랜잭션 처리 등 동적 처리를 담당한다"
      - q: "Git 과 SVN 의 저장소 방식 차이는?"
        a: "Git 은 분산 저장소 방식으로 개발자마다 전체 이력을 가진 지역 저장소를 두고, SVN 은 중앙 서버의 저장소를 공유하는 클라이언트/서버 방식이다"

  - id: eip-13
    title: "소프트웨어 개발 방법론과 프로젝트 관리"
    points:
      - "생명주기 모델: 폭포수(단계별 순차), 프로토타입(시제품으로 요구 확인), 나선형(위험 분석 반복), 애자일(짧은 반복, 변화 수용)"
      - "나선형 모델 4단계: 계획 수립 → 위험 분석 → 개발 및 검증 → 고객 평가"
      - "XP 의 5가지 가치: 용기, 단순성, 의사소통, 피드백, 존중. 실천법은 짝 프로그래밍, 테스트 주도 개발, 지속적 통합, 리팩토링"
      - "스크럼: 제품 백로그 → 스프린트 계획 → 스프린트(2~4주) → 일일 스크럼 → 스프린트 검토·회고. 역할은 제품 책임자, 스크럼 마스터, 개발팀"
      - "비용 산정: LOC(코드 라인 기반), 기능 점수(FP), COCOMO(조직형·반분리형·내장형), Putnam(Rayleigh 곡선), 전문가 판단·델파이"
      - "일정 관리: WBS 로 작업을 쪼개고, PERT/CPM 으로 임계 경로를 구하며, 간트 차트로 일정을 표시한다"
      - "위험 관리 절차: 위험 식별 → 위험 분석·평가 → 위험 계획 수립 → 위험 감시 및 조치"
      - "CMMI 단계: 초기 → 관리 → 정의 → 정량적 관리 → 최적화. SPICE 는 프로세스 능력 수준을 0~5 로 평가"
    quiz:
      - q: "나선형 모델의 4단계를 순서대로 쓰시오."
        a: "계획 수립 → 위험 분석 → 개발 및 검증 → 고객 평가"
      - q: "XP 의 5가지 가치를 쓰시오."
        a: "용기, 단순성, 의사소통, 피드백, 존중"
      - q: "COCOMO 모형의 3가지 유형을 쓰시오."
        a: "조직형(Organic), 반분리형(Semi-detached), 내장형(Embedded)"
      - q: "스크럼에서 2~4주 단위의 개발 주기를 무엇이라 하는가?"
        a: "스프린트(Sprint)"

  - id: eip-14
    title: "요구사항 확인과 UML"
    points:
      - "요구사항 개발 절차: 도출 → 분석 → 명세 → 확인. 기능 요구사항(무엇을 하는가)과 비기능 요구사항(성능, 보안, 품질)으로 나눈다"
      - "현행 시스템 파악은 구성·기능·인터페이스 파악 → 아키텍처와 소프트웨어 구성 파악 → 하드웨어·네트워크 구성 파악 순"
      - "UML 구조 다이어그램: 클래스, 객체, 컴포넌트, 배치, 복합체 구조, 패키지"
      - "UML 행위 다이어그램: 유스케이스, 시퀀스, 커뮤니케이션, 상태, 활동, 타이밍"
      - "UML 관계: 연관, 집합(전체-부분, 독립), 포함(합성, 생명주기 공유), 일반화(상속), 의존, 실체화(인터페이스 구현)"
      - "유스케이스 관계: 포함(include, 반드시 실행), 확장(extend, 조건부 실행), 일반화"
      - "시퀀스 다이어그램은 객체 사이 메시지를 시간 순서로 표현하며 생명선, 실행 박스, 메시지로 구성된다"
      - "요구사항 분석 기법: 자료 흐름도(DFD), 자료 사전(DD), 개체 관계도(ERD), 상태 전이도"
    quiz:
      - q: "요구사항 개발 절차 4단계를 순서대로 쓰시오."
        a: "도출 → 분석 → 명세 → 확인"
      - q: "UML 에서 집합 관계와 포함(합성) 관계의 차이는?"
        a: "둘 다 전체-부분 관계지만, 집합은 부분이 전체와 독립적으로 존재할 수 있고, 포함(합성)은 전체가 없어지면 부분도 함께 없어진다"
      - q: "유스케이스에서 include 와 extend 의 차이를 쓰시오."
        a: "include 는 반드시 실행되는 포함 관계이고, extend 는 특정 조건에서만 실행되는 확장 관계이다"
      - q: "객체 간 메시지를 시간 순서로 표현하는 UML 다이어그램은?"
        a: "시퀀스 다이어그램"

  - id: eip-15
    title: "화면 설계(UI)"
    points:
      - "UI 유형: CLI(명령어 텍스트), GUI(그래픽·마우스), NUI(터치·음성 등 신체), OUI(사물이 입출력 장치가 되는 유기적 상호작용), VUI(음성)"
      - "UI 설계 원칙: 직관성(쉽게 이해), 유효성(정확·완전한 목표 달성), 학습성(쉽게 배움), 유연성(오류 최소화와 수용)"
      - "UI 설계 지침: 사용자 중심, 일관성, 단순성, 결과 예측 가능, 가시성, 표준화, 접근성, 명확성, 오류 발생 해결"
      - "UI 설계 도구: 와이어프레임(화면 구조 스케치), 목업(정적 모형), 스토리보드(화면과 설명 묶음), 프로토타입(동작하는 시제품), 유스케이스"
      - "UI 품질 요구사항은 기능성, 신뢰성, 사용성, 효율성, 유지 보수성, 이식성으로 나눈다(ISO/IEC 9126 계열)"
      - "감성공학은 인간의 감성을 측정해 제품 설계에 반영하는 기술로 UI/UX 설계에 활용된다"
      - "UI 상세 설계는 시나리오 문서를 작성해 사용자 흐름, 예외, 오류 상황을 정의한다"
      - "웹 접근성은 장애 여부와 관계없이 동등하게 이용할 수 있게 하는 것으로 인식·운용·이해·견고성의 원칙을 따른다"
    quiz:
      - q: "UI 설계 원칙 4가지를 쓰고 각각 한 줄로 설명하시오."
        a: "직관성(누구나 쉽게 이해하고 사용), 유효성(목적을 정확하고 완전하게 달성), 학습성(누구나 쉽게 배우고 익힘), 유연성(사용자 요구를 수용하고 오류를 최소화)"
      - q: "와이어프레임과 프로토타입의 차이를 쓰시오."
        a: "와이어프레임은 화면 구조와 배치를 선으로 표현한 밑그림이고, 프로토타입은 실제 동작을 확인할 수 있는 시제품이다"
      - q: "터치나 음성처럼 신체를 이용해 조작하는 사용자 인터페이스를 무엇이라 하는가?"
        a: "NUI(Natural User Interface)"

  - id: eip-16
    title: "모듈 설계와 디자인 패턴"
    points:
      - "좋은 설계는 결합도가 낮고 응집도가 높다"
      - "결합도(낮음 → 높음): 자료 → 스탬프 → 제어 → 외부 → 공통 → 내용"
      - "응집도(높음 → 낮음): 기능적 → 순차적 → 교환적 → 절차적 → 시간적 → 논리적 → 우연적"
      - "팬인은 자신을 호출하는 모듈 수, 팬아웃은 자신이 호출하는 모듈 수. 팬인이 높으면 재사용성이 좋고 팬아웃이 높으면 복잡도가 올라간다"
      - "아키텍처 패턴: 계층화, 클라이언트-서버, 파이프-필터, MVC(모델·뷰·컨트롤러), 브로커, 마스터-슬레이브"
      - "생성 패턴: 추상 팩토리, 빌더, 팩토리 메서드, 프로토타입, 싱글톤(객체를 하나만)"
      - "구조 패턴: 어댑터(인터페이스 변환), 브리지, 컴포지트, 데코레이터(기능 덧붙이기), 퍼사드, 플라이웨이트, 프록시"
      - "행위 패턴: 옵서버(상태 변화 통보), 전략, 템플릿 메서드, 커맨드, 상태, 반복자, 중재자, 책임 연쇄, 방문자, 메멘토, 인터프리터"
    quiz:
      - q: "결합도를 낮은 것부터 높은 순으로 쓰시오."
        a: "자료 → 스탬프 → 제어 → 외부 → 공통 → 내용"
      - q: "응집도가 가장 높은 유형과 가장 낮은 유형을 쓰시오."
        a: "가장 높은 것은 기능적 응집도, 가장 낮은 것은 우연적 응집도"
      - q: "객체의 인스턴스를 하나만 만들어 공유하는 디자인 패턴은?"
        a: "싱글톤(Singleton) 패턴"
      - q: "한 객체의 상태가 바뀌면 그 객체에 의존하는 다른 객체들에게 자동으로 통보되는 패턴은?"
        a: "옵서버(Observer) 패턴"

  - id: eip-17
    title: "데이터 모델링과 정규화"
    points:
      - "데이터 모델링 순서: 개념(ERD) → 논리(정규화, 테이블 구조) → 물리(인덱스, 파티션, 저장 구조)"
      - "데이터 모델에 표시할 요소: 구조(Structure), 연산(Operation), 제약 조건(Constraint)"
      - "키: 슈퍼키(유일성만), 후보키(유일성 + 최소성), 기본키(후보키 중 선택), 대체키(남은 후보키), 외래키(다른 릴레이션의 기본키 참조)"
      - "무결성: 개체 무결성(기본키는 NULL·중복 불가), 참조 무결성(외래키는 참조 대상에 있는 값이거나 NULL), 도메인 무결성"
      - "이상 현상: 삽입 이상, 삭제 이상, 갱신 이상 — 정규화로 해소한다"
      - "정규화: 1NF(원자값), 2NF(부분 함수 종속 제거), 3NF(이행 함수 종속 제거), BCNF(모든 결정자가 후보키), 4NF(다치 종속 제거), 5NF(조인 종속 제거)"
      - "반정규화는 성능을 위해 중복을 허용하는 것으로 테이블 통합·분할, 중복 칼럼 추가, 파생 칼럼 추가 등이 있다"
      - "관계 대수 연산: SELECT(σ, 행 선택), PROJECT(π, 열 선택), JOIN(⋈), DIVISION(÷)"
    quiz:
      - q: "정규화 1NF 부터 BCNF 까지의 조건을 각각 한 줄로 쓰시오."
        a: "1NF 는 모든 속성이 원자값, 2NF 는 부분 함수 종속 제거, 3NF 는 이행 함수 종속 제거, BCNF 는 모든 결정자가 후보키"
      - q: "후보키가 갖춰야 할 두 가지 성질은?"
        a: "유일성과 최소성"
      - q: "개체 무결성과 참조 무결성을 각각 설명하시오."
        a: "개체 무결성은 기본키가 NULL 이거나 중복될 수 없다는 제약, 참조 무결성은 외래키 값이 참조하는 릴레이션의 기본키에 존재하거나 NULL 이어야 한다는 제약"
      - q: "성능을 위해 의도적으로 중복을 허용하는 설계 기법은?"
        a: "반정규화(역정규화)"

  - id: eip-18
    title: "통합 구현과 인터페이스"
    points:
      - "연계 방식은 직접 연계(DB 링크, API, 소켓)와 간접 연계(EAI, ESB, 웹 서비스)로 나눈다"
      - "EAI 유형: Point-to-Point(1:1), Hub & Spoke(중앙 허브), Message Bus(ESB, 버스 경유), Hybrid(그룹 내 버스 + 그룹 간 허브)"
      - "데이터 형식: XML(태그 구조, 확장 가능), JSON(키-값 쌍, 가볍고 읽기 쉬움), YAML, CSV"
      - "AJAX 는 페이지 전체를 새로 고치지 않고 서버와 비동기로 데이터를 주고받는 기술이다"
      - "웹 서비스 3요소: SOAP(메시지 교환 프로토콜), WSDL(서비스 명세), UDDI(서비스 등록·검색). REST 는 HTTP 메서드로 자원을 다루는 가벼운 방식"
      - "인터페이스 보안: IPSec(네트워크 계층), SSL/TLS(전송 계층), S-HTTP(응용 계층)"
      - "인터페이스 구현 검증 도구: xUnit, STAF, FitNesse, NTAF, Selenium, watir"
      - "인터페이스 오류는 발생 즉시 사용자 화면 알림, 로그 기록, 관리자 통보 등으로 처리하고 송수신 로그로 추적한다"
    quiz:
      - q: "EAI 구축 유형 4가지를 쓰시오."
        a: "Point-to-Point, Hub & Spoke, Message Bus(ESB), Hybrid"
      - q: "웹 서비스의 3가지 핵심 요소를 쓰고 각각의 역할을 설명하시오."
        a: "SOAP(메시지를 교환하는 프로토콜), WSDL(웹 서비스의 기능과 호출 방법을 기술하는 명세), UDDI(웹 서비스를 등록하고 검색하는 저장소)"
      - q: "JSON 의 구조를 한 줄로 설명하시오."
        a: "속성-값(키-값) 쌍으로 이루어진 데이터 객체를 사람이 읽을 수 있는 텍스트로 표현하는 개방형 표준 포맷"
      - q: "전송 계층에서 동작하는 대표적인 인터페이스 보안 프로토콜은?"
        a: "SSL/TLS"

  - id: eip-19
    title: "소프트웨어 개발 보안"
    points:
      - "SW 개발 보안 3대 요소: 기밀성, 무결성, 가용성"
      - "보안 약점: SQL 삽입, 크로스사이트 스크립팅(XSS), 크로스사이트 요청 위조(CSRF), 경로 조작, 운영체제 명령어 삽입, 메모리 버퍼 오버플로"
      - "SQL 삽입 대응은 입력값 검증과 매개변수화된 질의(Prepared Statement), XSS 대응은 입력값 검증과 출력 시 이스케이프"
      - "인증 유형: 지식 기반(비밀번호), 소유 기반(OTP·스마트카드), 생체 기반(지문·홍채), 위치 기반"
      - "접근 통제: DAC(소유자가 부여), MAC(관리자가 보안 등급으로 강제), RBAC(역할 기반)"
      - "대칭키는 암호화·복호화 키가 같고 빠르다(DES, AES, SEED, ARIA). 비대칭키는 공개키·개인키 쌍을 쓴다(RSA, ECC)"
      - "해시는 복호화할 수 없는 단방향 함수로 무결성 검증에 쓴다(SHA-256 등). MD5 와 SHA-1 은 취약해 권장하지 않는다"
      - "서비스 거부 공격: DDoS, SYN 플러딩, 스머프, 랜드(출발지와 목적지 IP 를 같게), 티어드롭(단편화 오프셋 조작)"
      - "BCP 는 재해 시 업무 연속성을 위한 계획이며, RTO(복구 목표 시간)와 RPO(복구 목표 시점)로 목표를 정한다"
    quiz:
      - q: "SQL 삽입 공격의 원리와 대응 방법을 쓰시오."
        a: "입력값에 SQL 구문을 넣어 질의를 조작하는 공격으로, 입력값 검증과 매개변수화된 질의(Prepared Statement) 사용으로 대응한다"
      - q: "접근 통제 방식 DAC, MAC, RBAC 을 각각 한 줄로 설명하시오."
        a: "DAC 은 자원 소유자가 권한을 부여하는 임의 접근 통제, MAC 은 관리자가 보안 등급에 따라 강제하는 강제 접근 통제, RBAC 은 사용자의 역할에 따라 권한을 부여하는 역할 기반 접근 통제"
      - q: "출발지와 목적지 IP 주소를 똑같이 만들어 보내는 공격은?"
        a: "랜드(Land) 공격"
      - q: "대칭키 암호와 비대칭키 암호의 차이를 쓰고 각각의 대표 알고리즘을 쓰시오."
        a: "대칭키는 암호화와 복호화에 같은 키를 써 빠르며 AES·SEED·ARIA 가 대표적이고, 비대칭키는 공개키와 개인키 쌍을 사용해 키 분배가 쉬우며 RSA·ECC 가 대표적이다"

  - id: eip-20
    title: "애플리케이션 테스트"
    points:
      - "테스트 원리: 결함 존재를 밝히는 활동, 완벽한 테스트는 불가능, 초기 집중, 결함 집중(파레토 80:20), 살충제 역설, 정황 의존, 오류-부재의 궤변"
      - "화이트박스 테스트는 내부 구조를 보고 수행한다. 문장·분기(결정)·조건·분기조건·변형 조건결정 커버리지, 기본 경로 검사"
      - "블랙박스 테스트는 입출력 중심이다. 동등 분할, 경곗값 분석, 결정 테이블, 상태 전이, 유스케이스, 원인-결과 그래프, 오류 예측"
      - "테스트 레벨: 단위 → 통합 → 시스템 → 인수. V 모델에서 각각 상세 설계, 아키텍처 설계, 시스템 설계, 요구사항 분석과 짝을 이룬다"
      - "통합 테스트: 하향식은 스텁(Stub)을 쓰고, 상향식은 드라이버(Driver)를 쓴다. 빅뱅은 한 번에 통합"
      - "검증(Verification)은 '제대로 만들고 있는가', 확인(Validation)은 '맞는 것을 만들었는가'"
      - "결함 관리 순서: 결함 등록 → 검토 → 할당 → 수정 → 재확인 → 종료. 결함 상태는 열림, 할당, 수정, 재확인, 종료, 해제, 연기"
      - "성능 측정 지표: 처리량(Throughput), 응답 시간, 경과 시간, 자원 사용률. 순환 복잡도 = 간선 수 − 노드 수 + 2"
    quiz:
      - q: "하향식 통합 테스트와 상향식 통합 테스트에서 사용하는 모듈을 각각 쓰시오."
        a: "하향식은 스텁(Stub), 상향식은 드라이버(Driver)"
      - q: "테스트 레벨 4단계를 순서대로 쓰시오."
        a: "단위 테스트 → 통합 테스트 → 시스템 테스트 → 인수 테스트"
      - q: "노드가 6개, 간선이 8개인 제어 흐름 그래프의 순환 복잡도를 구하시오."
        a: "8 − 6 + 2 = 4"
      - q: "경곗값 분석이 무엇인지 설명하시오."
        a: "입력 조건의 경계가 되는 값(최솟값, 최댓값과 그 전후)에서 오류가 자주 발생한다는 점에 착안해 경계 부근의 값을 테스트 케이스로 선정하는 블랙박스 기법"

  - id: eip-21
    title: "제품 소프트웨어 패키징"
    points:
      - "패키징은 개발이 끝난 제품을 고객에게 전달할 형태로 묶는 과정이며 사용자 중심으로 수행한다"
      - "릴리스 노트 항목: 헤더, 개요, 목적, 이슈 요약, 재현 항목, 수정·개선 내용, 사용자 영향도, 노트, 면책 조항, 연락처"
      - "DRM 구성 요소: 콘텐츠 제공자, 콘텐츠 분배자, 패키저(암호화해 묶음), 보안 컨테이너, DRM 컨트롤러, 클리어링 하우스(키·라이선스 관리), 콘텐츠 소비자"
      - "매뉴얼은 설치 매뉴얼(설치 과정과 환경)과 사용자 매뉴얼(기능 사용법)로 나눈다"
      - "소프트웨어 품질 목표(ISO/IEC 9126): 기능성, 신뢰성, 사용성, 효율성, 유지 보수성, 이식성"
      - "국제 표준: ISO/IEC 12207(생명주기 프로세스), ISO/IEC 25000(SQuaRE, 품질 통합), ISO/IEC 15504(SPICE)"
      - "버전 관리 규칙은 주 버전·부 버전·패치 번호로 올리고, 변경 이력을 릴리스 노트에 남긴다"
    quiz:
      - q: "DRM 에서 키 관리와 라이선스 발급을 맡는 구성 요소는?"
        a: "클리어링 하우스(Clearing House)"
      - q: "릴리스 노트에 반드시 들어가는 항목을 5가지만 쓰시오."
        a: "헤더(문서 이름·제품명·버전·날짜), 개요, 목적, 이슈 요약, 재현 항목 (이 밖에 수정·개선 내용, 사용자 영향도, 면책 조항, 연락처)"
      - q: "ISO/IEC 9126 의 품질 특성 6가지를 쓰시오."
        a: "기능성, 신뢰성, 사용성, 효율성, 유지 보수성, 이식성"
