# CKA 실습 학습 단원 — 강의 목록(26강)에 맞춰 구성하고, 강의에 없는 etcd·kubeadm 을 보강했다.
# 시험: 120분 / 15~20문항 / 합격 66% / Kubernetes v1.35 / 공식 문서 열람 가능
# 도메인 배점: Troubleshooting 30, Cluster Architecture 25, Services&Networking 20,
#              Workloads&Scheduling 15, Storage 10
exam: cka
units:
  - id: cka-01
    title: "시험 환경과 속도 세팅"
    points:
      - "120분에 15~20문항. 문항당 평균 7분. 아는 문제도 느리면 못 끝낸다 — 속도가 합격을 가른다"
      - "별칭과 자동완성을 먼저 건다: alias k=kubectl / source <(kubectl completion bash) / complete -F __start_kubectl k"
      - "export do='--dry-run=client -o yaml' 를 걸어두고 YAML 은 항상 생성해서 수정한다. 처음부터 쓰지 않는다"
      - "문제마다 클러스터가 다르다. 각 문제에 주어진 context 전환 명령을 반드시 먼저 실행한다"
      - "공식 문서(kubernetes.io/docs)만 열람 가능. 검색으로 3분 쓰면 그 문제는 버린 것 — 평소에 찾는 연습을 한다"
      - "어려운 문제는 넘기고 표시해 둔다. 66%면 합격이므로 전부 풀 필요가 없다"
    quiz:
      - q: "nginx 이미지로 Pod 를 만드는 YAML 을 파일로 뽑는 명령은?"
        a: "kubectl run nginx --image=nginx --dry-run=client -o yaml > pod.yaml"
      - q: "replicas 3 인 Deployment YAML 을 생성만 하려면?"
        a: "kubectl create deploy web --image=nginx --replicas=3 --dry-run=client -o yaml > deploy.yaml"

  - id: cka-02
    title: "쿠버네티스 리소스와 kubectl 기본"
    points:
      - "리소스 계층: Pod ← ReplicaSet ← Deployment. StatefulSet 은 순서·고정 이름·개별 PVC 가 필요할 때"
      - "kubectl explain <리소스>.<필드> --recursive 로 필드 구조를 확인한다. 문서를 못 찾을 때 빠르다"
      - "kubectl get <리소스> -A -o wide / -o jsonpath 로 필요한 값만 뽑는다"
      - "kubectl edit 은 즉시 반영되지만 되돌리기 어렵다. 중요한 변경은 YAML 수정 후 apply"
      - "kubectl apply(선언형)와 create(명령형)의 차이: apply 는 기존 리소스를 병합, create 는 이미 있으면 실패"
      - "네임스페이스를 빠뜨리는 실수가 가장 흔하다. -n 을 습관으로 붙인다"
    quiz:
      - q: "모든 네임스페이스에서 Running 이 아닌 파드만 보려면?"
        a: "kubectl get pods -A --field-selector=status.phase!=Running"
      - q: "Deployment 의 strategy 필드 구조를 확인하는 명령은?"
        a: "kubectl explain deployment.spec.strategy --recursive"

  - id: cka-03
    title: "ConfigMap 과 Secret"
    points:
      - "ConfigMap 생성: kubectl create cm <이름> --from-literal=k=v 또는 --from-file=<경로>"
      - "Secret 생성: kubectl create secret generic <이름> --from-literal=pw=1234. 값은 base64 인코딩일 뿐 암호화가 아니다"
      - "주입 방식 두 가지: envFrom/env(환경변수)와 volumeMounts(파일). 파일로 마운트하면 ConfigMap 변경이 반영되지만 환경변수는 안 된다"
      - "환경변수로 넣은 ConfigMap 을 바꾸면 파드를 재시작해야 적용된다 — 시험 문제로 자주 나온다"
      - "kubectl rollout restart deploy <이름> 으로 재시작"
    quiz:
      - q: "ConfigMap 을 환경변수로 주입한 Deployment 에서 ConfigMap 값을 바꿨다. 적용하려면?"
        a: "kubectl rollout restart deploy <이름> — 환경변수 주입은 파드 재생성 시에만 반영된다"
      - q: "파일 두 개를 담은 ConfigMap 을 만드는 명령은?"
        a: "kubectl create cm app-conf --from-file=a.conf --from-file=b.conf"

  - id: cka-04
    title: "리소스 요청·제한과 HPA"
    points:
      - "requests 는 스케줄러가 노드를 고를 때 쓰는 예약량, limits 는 넘지 못하는 상한. 스케줄링은 requests 로만 판단한다"
      - "CPU limits 초과는 스로틀링(느려짐), 메모리 limits 초과는 OOMKilled(즉시 종료). 동작이 다르다"
      - "QoS: requests==limits 면 Guaranteed, requests<limits 면 Burstable, 미설정이면 BestEffort. 노드 메모리 부족 시 BestEffort 부터 퇴출"
      - "HPA: kubectl autoscale deploy <이름> --min=2 --max=10 --cpu-percent=70"
      - "HPA 가 동작하려면 metrics-server 가 있어야 하고, 대상 파드에 CPU requests 가 설정되어 있어야 한다"
      - "PriorityClass: 값이 큰 쪽이 우선. preemptionPolicy: Never 면 다른 파드를 쫓아내지 않는다"
    quiz:
      - q: "HPA 를 만들었는데 TARGETS 가 <unknown> 으로 나온다. 원인 두 가지는?"
        a: "metrics-server 가 없거나, 대상 파드에 CPU requests 가 설정되어 있지 않음"
      - q: "파드가 OOMKilled 되었는지 확인하는 명령은?"
        a: "kubectl describe pod <이름> 의 Last State 항목, 또는 kubectl get pod <이름> -o jsonpath='{.status.containerStatuses[*].lastState.terminated.reason}'"

  - id: cka-05
    title: "스토리지 — PV·PVC·StorageClass"
    points:
      - "PV 는 실제 저장 공간, PVC 는 요청, StorageClass 는 동적 프로비저닝 규칙"
      - "accessModes: ReadWriteOnce(한 노드), ReadOnlyMany, ReadWriteMany(여러 노드 쓰기 — NFS 등만 지원)"
      - "persistentVolumeReclaimPolicy: Retain(남김) / Delete(삭제). 운영 데이터는 Retain"
      - "PVC 가 Pending 이면 조건이 안 맞는 것: storageClassName 불일치, 용량 부족, accessModes 불일치 순으로 본다"
      - "기본 StorageClass 지정: annotation storageclass.kubernetes.io/is-default-class: \"true\""
      - "Retain 으로 해제된 PV 는 Released 상태로 남아 재사용이 안 된다. claimRef 를 지워야 Available 로 돌아간다"
    quiz:
      - q: "PVC 가 계속 Pending 이다. 확인 순서는?"
        a: "kubectl describe pvc 의 Events → storageClassName 일치 여부 → 요청 용량과 PV 용량 → accessModes 일치 여부"
      - q: "Released 상태 PV 를 다시 쓰려면?"
        a: "kubectl patch pv <이름> -p '{\"spec\":{\"claimRef\":null}}' 로 claimRef 를 제거하면 Available 이 된다"

  - id: cka-06
    title: "Service 와 Ingress"
    points:
      - "ClusterIP(내부), NodePort(노드 포트 30000~32767), LoadBalancer(외부 LB), ExternalName(CNAME)"
      - "kubectl expose deploy <이름> --port=80 --target-port=8080 --type=ClusterIP"
      - "port 는 서비스가 받는 포트, targetPort 는 파드가 듣는 포트. 헷갈리면 연결이 안 된다"
      - "Service 가 파드를 못 찾으면 selector 와 파드 label 이 다른 것이다. kubectl get endpoints <서비스> 가 비어 있으면 확정"
      - "Ingress 는 L7 라우팅. ingressClassName 을 지정해야 컨트롤러가 처리한다"
      - "Ingress 경로 타입: Prefix(접두사), Exact(정확히 일치), ImplementationSpecific"
    quiz:
      - q: "Service 를 만들었는데 접속이 안 된다. 가장 먼저 볼 것은?"
        a: "kubectl get endpoints <서비스> — 비어 있으면 selector 와 파드 label 불일치"
      - q: "8080 포트를 듣는 파드를 80 으로 노출하는 Service 명령은?"
        a: "kubectl expose deploy app --port=80 --target-port=8080"

  - id: cka-07
    title: "Gateway API"
    points:
      - "Ingress 의 후속 표준. 역할이 분리된다: GatewayClass(인프라 제공자) → Gateway(클러스터 운영자) → HTTPRoute(앱 개발자)"
      - "Gateway 는 리스너(포트·프로토콜·호스트)를 정의하고, HTTPRoute 가 parentRefs 로 그 Gateway 를 참조한다"
      - "HTTPRoute 의 rules: matches(경로·헤더·메서드) + backendRefs(대상 서비스·가중치)"
      - "가중치 기반 트래픽 분할이 표준으로 들어있다 — Ingress 는 컨트롤러 애노테이션으로만 가능했다"
      - "allowedRoutes 로 어느 네임스페이스의 Route 가 붙을 수 있는지 제한한다"
      - "CRD 라서 클러스터에 Gateway API CRD 가 설치되어 있어야 한다"
    quiz:
      - q: "HTTPRoute 가 Gateway 에 붙지 않는다. 확인할 것은?"
        a: "parentRefs 의 이름·네임스페이스, Gateway 의 allowedRoutes 설정, 리스너의 hostname 과 HTTPRoute hostnames 일치 여부"
      - q: "Gateway API 에서 트래픽을 v1 80%, v2 20% 로 나누려면?"
        a: "HTTPRoute 의 backendRefs 에 각 서비스를 넣고 weight 를 80, 20 으로 준다"

  - id: cka-08
    title: "NetworkPolicy"
    points:
      - "기본은 전부 허용. NetworkPolicy 가 하나라도 붙으면 그 파드는 명시된 것만 허용된다(화이트리스트)"
      - "podSelector: {} 는 네임스페이스 내 모든 파드를 뜻한다. 전체 차단 정책의 기본형"
      - "policyTypes 에 Ingress/Egress 를 명시한다. Egress 를 빠뜨리면 나가는 트래픽은 제한되지 않는다"
      - "from/to 의 podSelector, namespaceSelector, ipBlock 은 하나의 항목(-) 안에 같이 쓰면 AND, 따로 쓰면 OR 이다 — 가장 자주 틀리는 부분"
      - "DNS(53/UDP, 53/TCP)를 Egress 에서 막으면 이름 해석이 안 돼 전부 실패한다. 반드시 열어준다"
      - "CNI 가 NetworkPolicy 를 지원해야 동작한다(Calico, Cilium 등). flannel 단독은 미지원"
    quiz:
      - q: "네임스페이스의 모든 파드에 대해 들어오는 트래픽을 전부 막는 정책은?"
        a: "podSelector: {} 에 policyTypes: [Ingress] 만 두고 ingress 규칙을 비워 둔다"
      - q: "Egress 정책을 걸었더니 통신이 전부 실패한다. 빠뜨린 것은?"
        a: "DNS. kube-system 의 CoreDNS 로 가는 53/UDP·53/TCP 를 허용해야 한다"

  - id: cka-09
    title: "스케줄링 — 노드 배치 제어"
    points:
      - "nodeSelector: 가장 단순한 label 기반 배치. nodeAffinity: required(필수)와 preferred(선호)를 구분"
      - "Taint 는 노드가 밀어내는 것, Toleration 은 파드가 견디는 것. 둘이 맞아야 배치된다"
      - "taint effect: NoSchedule(새로 배치 안 함), PreferNoSchedule(가급적), NoExecute(기존 파드도 쫓아냄)"
      - "kubectl taint node <노드> key=value:NoSchedule / 제거는 끝에 - 를 붙인다"
      - "kubectl cordon(새 배치 금지) → kubectl drain(기존 파드 이동) 순서. drain 은 --ignore-daemonsets 가 보통 필요하다"
      - "podAffinity/podAntiAffinity 로 파드끼리 모으거나 떨어뜨린다. topologyKey 가 기준 단위"
    quiz:
      - q: "노드를 점검하려고 파드를 모두 비우는 명령은?"
        a: "kubectl drain <노드> --ignore-daemonsets --delete-emptydir-data"
      - q: "drain 이 끝나지 않고 멈춰 있다. 흔한 원인은?"
        a: "PodDisruptionBudget 이 너무 빡빡해서 파드를 뺄 수 없는 경우. minAvailable 이 레플리카 수와 같으면 영영 비워지지 않는다"

  - id: cka-10
    title: "컴포넌트 구조와 Pod 디자인 패턴"
    points:
      - "컨트롤 플레인: kube-apiserver(모든 요청의 입구), etcd(상태 저장), kube-scheduler(배치 결정), kube-controller-manager(상태 조정)"
      - "노드: kubelet(파드 실행·상태 보고), kube-proxy(서비스 네트워킹), 컨테이너 런타임(CRI)"
      - "kubeadm 클러스터의 컨트롤 플레인은 static pod 로 뜬다. 매니페스트는 /etc/kubernetes/manifests/ 에 있고, 파일을 고치면 kubelet 이 자동 재시작한다"
      - "사이드카: 같은 파드 안에서 보조 역할(로그 수집, 프록시). 볼륨을 공유해 로그 파일을 읽는 구성이 전형"
      - "initContainer: 본 컨테이너보다 먼저 완료되어야 하는 준비 작업. 순차 실행된다"
      - "emptyDir 은 파드 수명과 함께 사라진다. 사이드카 로그 공유에 쓰인다"
    quiz:
      - q: "apiserver 설정을 바꾸려면 어느 파일을 고치고, 어떻게 적용되나?"
        a: "/etc/kubernetes/manifests/kube-apiserver.yaml 을 수정하면 kubelet 이 감지해 static pod 를 자동 재시작한다"
      - q: "애플리케이션이 파일로 남기는 로그를 표준출력으로 내보내는 구성은?"
        a: "emptyDir 볼륨을 두 컨테이너가 공유하고, 사이드카가 그 파일을 tail 해 stdout 으로 출력한다"

  - id: cka-11
    title: "etcd 백업과 복구 ★ 강의 외 보강"
    points:
      - "시험 단골이고 배점이 크다. AKS 같은 매니지드만 다뤘다면 경험이 없는 영역이라 반드시 손으로 해봐야 한다"
      - "백업: ETCDCTL_API=3 etcdctl snapshot save /opt/backup.db --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key"
      - "확인: etcdctl snapshot status /opt/backup.db --write-out=table"
      - "복구: etcdctl snapshot restore /opt/backup.db --data-dir=/var/lib/etcd-restore (새 디렉터리로 복원한다)"
      - "복구 후 /etc/kubernetes/manifests/etcd.yaml 의 hostPath 를 새 data-dir 로 바꾼다. kubelet 이 재시작하며 적용된다"
      - "인증서 경로는 etcd.yaml 의 --cert-file, --key-file, --trusted-ca-file 에서 확인할 수 있다. 외우지 말고 거기서 본다"
      - "복구 중에는 apiserver 가 멈춘다. 매니페스트를 잠시 옮겨 두고 작업하는 방법도 쓴다"
    quiz:
      - q: "etcd 백업에 필요한 세 가지 인증 옵션과, 그 경로를 어디서 확인하나?"
        a: "--cacert, --cert, --key. /etc/kubernetes/manifests/etcd.yaml 의 --trusted-ca-file, --cert-file, --key-file 에서 확인한다"
      - q: "복구할 때 기존 data-dir 에 덮어쓰지 않고 새 디렉터리로 복원하는 이유는?"
        a: "실패했을 때 원본으로 돌아갈 수 있어야 하기 때문. 복원 후 etcd.yaml 의 hostPath 를 새 경로로 바꿔 적용한다"

  - id: cka-12
    title: "kubeadm 클러스터 업그레이드 ★ 강의 외 보강"
    points:
      - "순서가 정해져 있다. 컨트롤 플레인 → 나머지 컨트롤 플레인 → 워커. 마이너 버전은 건너뛸 수 없다"
      - "1) kubeadm 먼저 업그레이드: apt-mark unhold kubeadm && apt-get install -y kubeadm=1.35.x-* && apt-mark hold kubeadm"
      - "2) 계획 확인: kubeadm upgrade plan"
      - "3) 적용(첫 컨트롤 플레인): kubeadm upgrade apply v1.35.x / 나머지 노드는 kubeadm upgrade node"
      - "4) 노드 비우기: kubectl drain <노드> --ignore-daemonsets"
      - "5) kubelet·kubectl 업그레이드 후 systemctl daemon-reload && systemctl restart kubelet"
      - "6) kubectl uncordon <노드>"
      - "apt-mark hold 를 빠뜨리면 다음 apt upgrade 때 의도치 않게 올라간다"
    quiz:
      - q: "kubeadm 업그레이드에서 kubeadm 패키지를 먼저 올리는 이유는?"
        a: "kubeadm 이 업그레이드 계획을 만들고 실행하는 도구이므로, 대상 버전을 아는 kubeadm 이 먼저 있어야 한다"
      - q: "워커 노드 업그레이드의 전체 순서를 쓰시오."
        a: "kubeadm 업그레이드 → kubeadm upgrade node → drain → kubelet·kubectl 업그레이드 → daemon-reload·restart kubelet → uncordon"

  - id: cka-13
    title: "Troubleshooting — 컨트롤 플레인과 노드 (30%)"
    points:
      - "배점이 가장 큰 도메인. 증상에서 계층을 좁히는 훈련이 핵심이다"
      - "kubectl 이 아예 안 되면 apiserver 문제: /etc/kubernetes/manifests/ 의 YAML 오타, 인증서 만료, etcd 다운 순으로 본다"
      - "static pod 는 kubectl 로 로그를 못 볼 수 있다. crictl ps -a / crictl logs <id> 로 컨테이너 단에서 본다"
      - "노드가 NotReady 면 그 노드에서 systemctl status kubelet 과 journalctl -u kubelet -n 100 을 본다"
      - "kubelet 이 안 뜨는 흔한 원인: /var/lib/kubelet/config.yaml 오류, 스왑 활성화, CRI 소켓 경로 불일치, 디스크 가득 참"
      - "파드가 Pending 이면 스케줄 문제(리소스·taint·affinity), ImagePullBackOff 면 이미지·레지스트리 인증, CrashLoopBackOff 면 애플리케이션"
      - "kubectl describe 의 Events 를 먼저 읽는다. 대부분 답이 거기 있다"
    quiz:
      - q: "kubectl 명령이 전부 connection refused 로 실패한다. 점검 순서는?"
        a: "컨트롤 플레인 노드에서 crictl ps 로 apiserver 컨테이너 상태 → /etc/kubernetes/manifests/kube-apiserver.yaml 문법 → journalctl -u kubelet → etcd 상태 순"
      - q: "노드가 NotReady 인데 kubelet 이 계속 죽는다. 자주 보는 원인 세 가지는?"
        a: "스왑이 켜져 있음, /var/lib/kubelet/config.yaml 오류, 디스크 가득 참(또는 CRI 소켓 경로 불일치)"

  - id: cka-14
    title: "Troubleshooting — 애플리케이션과 네트워크"
    points:
      - "파드 로그: kubectl logs <파드> -c <컨테이너> --previous (--previous 는 죽기 전 로그 — 재시작 반복 시 필수)"
      - "컨테이너 안에서 확인: kubectl exec -it <파드> -- sh. 셸이 없는 이미지는 kubectl debug 로 임시 컨테이너를 붙인다"
      - "서비스 연결 확인 3단계: endpoints 존재 → 파드 포트 일치 → NetworkPolicy 차단 여부"
      - "DNS 확인: kubectl run tmp --image=busybox:1.28 --rm -it -- nslookup <서비스>.<네임스페이스>.svc.cluster.local"
      - "CoreDNS 가 죽어 있으면 이름 해석이 전부 실패한다. kubectl -n kube-system get pods 로 먼저 본다"
      - "kube-proxy 가 죽은 노드에서는 서비스 IP 로 접근이 안 된다"
    quiz:
      - q: "CrashLoopBackOff 인 파드의 원인을 보려면?"
        a: "kubectl logs <파드> --previous 로 죽기 직전 로그를 본다. 그다음 kubectl describe 의 Events 와 종료 코드"
      - q: "서비스 이름으로 접속이 안 될 때 DNS 를 확인하는 방법은?"
        a: "임시 파드에서 nslookup <서비스>.<네임스페이스>.svc.cluster.local 을 실행하고, 안 되면 kube-system 의 CoreDNS 파드 상태를 본다"

  - id: cka-15
    title: "CRI·CNI 설치와 CRD"
    points:
      - "CRI: containerd 가 표준. 설정은 /etc/containerd/config.toml, SystemdCgroup = true 가 kubeadm 기본 요구사항"
      - "crictl 은 /etc/crictl.yaml 에 runtime-endpoint 를 지정해야 쓸 수 있다: unix:///run/containerd/containerd.sock"
      - "crictl ps / crictl logs / crictl images — kubelet 이 안 뜰 때 쓰는 도구"
      - "CNI: 설치 전에는 노드가 NotReady 이고 CoreDNS 가 Pending 이다. 이게 정상이다"
      - "CNI 설치는 보통 매니페스트 apply 한 줄. Pod CIDR 이 kubeadm init 의 --pod-network-cidr 과 맞아야 한다"
      - "CRD 확인: kubectl get crd / kubectl api-resources | grep <그룹> / kubectl explain <커스텀리소스> --recursive"
    quiz:
      - q: "kubeadm init 후 노드가 NotReady 이고 CoreDNS 가 Pending 이다. 원인은?"
        a: "CNI 플러그인이 아직 설치되지 않았다. CNI 를 배포하면 Ready 로 바뀐다"
      - q: "crictl 명령이 endpoint 오류를 낸다. 어떻게 해결하나?"
        a: "/etc/crictl.yaml 에 runtime-endpoint: unix:///run/containerd/containerd.sock 를 지정하거나 --runtime-endpoint 로 넘긴다"

  - id: cka-16
    title: "Helm 과 Kustomize"
    points:
      - "Helm: helm repo add <이름> <URL> → helm repo update → helm install <릴리스> <차트> -n <네임스페이스> --create-namespace"
      - "설치 전 확인: helm template <릴리스> <차트> 로 실제 생성될 매니페스트를 본다"
      - "값 지정: --set key=value 또는 -f values.yaml. 중첩은 점으로 표기(--set controller.replicas=2)"
      - "helm list -A / helm get values <릴리스> / helm uninstall <릴리스>"
      - "Kustomize: kubectl apply -k <디렉터리>. kustomization.yaml 에 resources 와 patches 를 둔다"
      - "kubectl kustomize <디렉터리> 로 결과를 먼저 확인한 뒤 적용한다"
    quiz:
      - q: "Helm 차트가 실제로 무엇을 만드는지 설치 전에 보려면?"
        a: "helm template <릴리스> <차트> (또는 helm install --dry-run --debug)"
      - q: "kustomize 결과를 적용 전에 확인하는 명령은?"
        a: "kubectl kustomize <디렉터리> — 적용은 kubectl apply -k <디렉터리>"
