<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>학습 · toriyong</title>
  <script src="../assets/theme.js"></script>
  <link rel="stylesheet" href="../assets/style.css">
</head>
</head>
<body data-root="../" data-tab="study">
  <main>
    <div class="wrap">
      <h1>학습</h1>
      <p class="lead">자격증 시험 일정과 공부 스케줄.</p>

      <div id="content">
        <div id="banner-est" class="banner warn hidden"></div>
        <section class="panel">
          <div class="panel-head">
            <h2>D-day</h2>
            <span class="meta"><span id="updated"></span></span>
          </div>
          <div class="dday-grid" id="dday"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>공부 스케줄</h2>
            <div class="cal-nav">
              <button type="button" id="cal-prev" aria-label="이전 달">‹</button>
              <span class="cal-title" id="cal-title"></span>
              <button type="button" id="cal-next" aria-label="다음 달">›</button>
              <button type="button" id="cal-today">오늘</button>
            </div>
          </div>
          <div class="progress-bar-row">
            <div class="progress-row" id="progress"></div>
            <button type="button" class="more" id="reset-done">완료 체크 초기화</button>
          </div>
          <div class="cal cal7" id="calendar"></div>
          <ul class="agenda" id="agenda" aria-label="이번 달 공부 일정"></ul>
          <p class="meta">과제 이름을 누르면 그날 공부할 내용(핵심 정리·연습문제)이 열립니다. ○ 를 누르면 완료 체크(이 브라우저에 저장). <a href="unit/">전체 단원 목록</a></p>
        </section>

        <section class="panel">
          <h2>시험 일정</h2>
          <div id="exams"></div>
        </section>
      </div>
    </div>
  </main>
  <script src="../assets/common.js"></script>
  <script src="study.js"></script>
</body>
</html>
