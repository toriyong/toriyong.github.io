<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 검색 색인 차단. 공개하려면 아래 한 줄을 지우세요(내용을 검토한 뒤에). -->
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>소개 · toriyong</title>
  <script src="../assets/theme.js"></script>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-root="../" data-tab="about" data-nav="none">
  <main>
    <div class="wrap">
      <header class="pf-head">
        <h1 id="pf-name">소개</h1>
        <p class="pf-headline" id="pf-headline"></p>
        <p class="pf-summary" id="pf-summary"></p>
        <div class="pf-links" id="pf-links"></div>
      </header>

      <section class="panel">
        <div class="panel-head">
          <h2>경력</h2>
          <span class="meta" id="pf-career-note"></span>
        </div>
        <div id="pf-career"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>보유 기술</h2></div>
        <div id="pf-skills"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>자격증</h2>
          <span class="meta" id="pf-cert-note"></span>
        </div>
        <div id="pf-certs"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>학습 현황</h2>
          <span class="meta" id="pf-study-note"></span>
        </div>
        <div id="pf-study"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>주요 프로젝트</h2></div>
        <div id="pf-projects"></div>
      </section>

      <section class="panel" id="pf-edu-panel">
        <div class="panel-head"><h2>학력</h2></div>
        <div id="pf-edu"></div>
      </section>

      <section class="panel" id="pf-train-panel">
        <div class="panel-head"><h2>교육·훈련</h2></div>
        <div id="pf-train"></div>
      </section>
    </div>
  </main>
  <script src="../assets/common.js"></script>
  <script src="about.js"></script>
</body>
</html>
