projects:
  - title: AKS 클러스터 버전 업그레이드
    period: 2026
    role: 설계·작업계획 수립·수행
    summary: >-
      운영 중인 AKS 클러스터를 상위 버전으로 올리는 작업을 맡았습니다.
      API 변경으로 깨질 리소스를 먼저 조사하고, 노드 풀을 순차 교체해 서비스 중단 없이 올리는
      절차를 작업계획서로 정리한 뒤 수행했습니다.
    stack: [AKS, Kubernetes, Azure CLI, kubectl]

  - title: Azure Arc 온보딩과 Defender for Servers 적용
    period: 2026
    role: 설계·구축
    summary: >-
      온프레미스 IDC 와 OCI 에 흩어져 있던 서버를 Azure Arc 로 한곳에서 관리하도록 온보딩하고,
      Defender for Servers 를 적용해 취약점·위협 탐지 체계를 붙였습니다.
      구독을 나눠 회사별로 비용이 구분되도록 구성했습니다.
    stack: [Azure Arc, Defender for Cloud, Azure Policy, 하이브리드 인프라]

  - title: Kubernetes 접근제어 체계 구축
    period: 2026
    role: 설계·구축
    summary: >-
      서버 접근제어에만 쓰던 접근제어 솔루션의 적용 범위를 Kubernetes 까지 넓혔습니다.
      누가 어떤 클러스터에 어떤 권한으로 들어갈 수 있는지를 한곳에서 통제하고
      접속 기록이 남도록 구성했습니다.
    stack: [Kubernetes, RBAC, 접근제어 솔루션, 감사 로그]

  - title: 인프라·증시 정보 자동 수집 사이트
    period: 2026
    role: 기획·개발·운영
    url: https://toriyong.github.io
    summary: >-
      보안 공지와 CVE, 공모주 일정, 자격증 학습 진도를 자동으로 모아 보여 주는 정적 사이트입니다.
      GitHub Actions 가 하루 여섯 번 공개 API 와 RSS 를 수집해 JSON 으로 떨구고,
      브라우저는 그 JSON 만 읽습니다. 서버가 없으니 운영 비용이 들지 않고,
      수집에 실패해도 직전 데이터를 그대로 보여 주도록 만들었습니다.
    stack: [GitHub Actions, Python, 정적 웹, OpenDART, 공공데이터포털]

# 학습 현황은 config/exams.yml 과 학습 단원 수에서 자동으로 계산합니다(여기서 쓸 것 없음).
