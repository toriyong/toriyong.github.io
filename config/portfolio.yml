profile:
  name: 이윤성
  headline: 하이브리드 인프라 아키텍트
  summary: >-
    온프레미스(IDC)와 퍼블릭 클라우드를 함께 운영하는 하이브리드 환경을 10년 이상 다뤄 왔습니다.
    서버 가상화와 OS 운영에서 출발해 Azure·OCI 기반의 클라우드 전환과 Kubernetes 운영,
    그리고 접근제어·취약점 대응 같은 보안 영역까지 범위를 넓혀 왔습니다.
    장애를 끝까지 파고들어 원인을 찾고, 같은 일이 반복되지 않도록 절차와 문서로 남기는 것을 중요하게 생각합니다.
  # 공개 범위에 맞춰 지우거나 채우세요. 이메일은 수집 봇의 표적이 되므로 권장하지 않습니다.
