profile:
  name: 이윤성
  headline: IDC 운영부터 멀티클라우드 구축·보안까지 다루는 서버 인프라 엔지니어
  summary: >-
    경력 10년 10개월 동안 백업과 유지보수, IDC 서버 운영, 가상화, 멀티클라우드 구축과 이관,
    그리고 보안 운영까지 인프라의 여러 층을 현장에서 다뤄 왔습니다.
    물리 장비를 직접 설치하고 빼 본 사람이면서 클라우드 랜딩존과 쿠버네티스도 함께 보는 쪽에 가깝습니다.
    랙 55개를 44개로 통합하는 IDC 이전, 서버 20대와 DB 7대 규모의 AWS to OCI 이관,
    Azure·OCI 하이브리드 구축을 맡아 수행했고, 지금은 AKS 12대와 NGINX Plus 운영,
    서버 360대 규모의 엔드포인트 보안 운영을 담당하고 있습니다.
    금융권 고객사 통합 유지보수로 시작한 덕에 점검과 감사, 이슈 조율처럼 운영을 지탱하는 일의 무게도 알고 있습니다.
    장애 이력과 처리 내역이 관리되지 않아 인수인계가 어려웠던 경험을 계기로 기록 양식을 직접 만들어
    정착시킨 적이 있습니다. 운영은 사람이 바뀌어도 같은 품질이 나와야 한다고 생각합니다.
  links:
    - { label: GitHub, url: https://github.com/toriyong }

