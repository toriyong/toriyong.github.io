profile:
  name: 이윤성
  headline: 하이브리드 인프라 아키텍트
  summary: >-
    IDC 현장에서 물리 서버와 가상화 인프라를 직접 운영해 온 10년 이상의 경험을 바탕으로,
    지금은 온프레미스와 퍼블릭 클라우드를 함께 쓰는 하이브리드 환경을 설계하고 운영합니다.
    랙 단위의 서버 증설과 OS·가상화 운영, 서버 접근제어와 계정 권한 체계,
    장비 이전과 재구성 같은 현장 작업에서 출발해 Azure·OCI 전환과 Kubernetes 운영까지 범위를 넓혀 왔습니다.
    클라우드만 아는 사람과 장비만 아는 사람 사이에서 양쪽을 모두 설명할 수 있다는 것이 강점이라고 생각합니다.
    장애는 끝까지 파고들어 원인을 찾고, 같은 일이 반복되지 않도록 절차와 문서로 남깁니다.
