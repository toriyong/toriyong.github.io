# 관심종목 설정 — 이 파일만 고치면 다음 자동 수집부터 반영됩니다.
#
# name        : 종목명(뉴스 검색어로도 사용)
# stock_code  : 6자리 종목코드 (따옴표로 감싸기)
# news_query  : (선택) 뉴스 검색어를 따로 지정할 때
# targets     : 증권사 목표가를 직접 입력 (최근 90일 값의 평균으로 도달률 계산)
#               - { broker: 증권사명, price: 목표가(원), date: YYYY-MM-DD }
#
# ※ 증권사 목표가는 공개 API가 없어 직접 입력합니다(리포트 무단 수집은 하지 않음).
# ※ 아래 삼성전자는 화면 확인용 예시입니다. 목표가는 비워 두었으니 실제 관심종목으로 바꿔 주세요.

stocks:
  - name: 삼성전자
    stock_code: "005930"
    targets: []
  - name: 삼성전자우
    stock_code: "005935"
    targets: []
  - name: 삼성생명
    stock_code: "032830"
    targets: []
