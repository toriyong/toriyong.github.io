# 자격증 시험 일정 — 공개 정보(공고 기준). 학습 페이지(비밀번호)에서 사용.
#
# 2027년 일정은 공식 공고 기준(2026-11-28 반영)입니다.
#   - 정보처리기사: 고용노동부 공고 제2026-518호 「2027년도 국가기술자격 검정시행계획」(2026-11-23)
#   - 정보보안기사: KCA 2027년도 국가기술자격검정 연간시험일정 (cq.or.kr)
#   공고 확인 전 값은 estimated: true 로 두면 화면에 '임시' 배지가 붙습니다.
#
# 항목: written_apply(필기 접수) · written(필기 시험, CBT는 기간) · written_result(필기 발표)
#       practical_apply(실기 접수) · practical(실기 시험) · final_result(최종 발표)
#       날짜는 YYYY-MM-DD, 기간은 [시작, 끝]

exams:
  - id: eip
    name: 정보처리기사
    org: 한국산업인력공단 (큐넷)
    url: https://www.q-net.or.kr
    note: 실기는 기간 중 하루(필답형). 최종 발표는 2차(정보처리기사 해당) 발표일
    rounds:
      - { round: 2027-1, estimated: false,
          written_apply: [2027-01-18, 2027-01-21], written: [2027-02-12, 2027-03-02], written_result: 2027-03-10,
          practical_apply: [2027-03-22, 2027-03-25], practical: [2027-04-17, 2027-05-04], final_result: 2027-06-11 }
      - { round: 2027-2, estimated: false,
          written_apply: [2027-04-12, 2027-04-15], written: [2027-05-07, 2027-05-26], written_result: 2027-06-02,
          practical_apply: [2027-06-15, 2027-06-18], practical: [2027-07-10, 2027-07-28], final_result: 2027-09-10 }
      # 3회 최종 발표일(12-31)은 공고 원문으로 재확인 필요 — 교육기관 정리 기준
      - { round: 2027-3, estimated: false,
          written_apply: [2027-07-20, 2027-07-23], written: [2027-08-13, 2027-09-01], written_result: 2027-09-08,
          practical_apply: [2027-09-21, 2027-09-24], practical: [2027-10-30, 2027-11-19], final_result: 2027-12-31 }

  - id: eis
    name: 정보보안기사
    org: 한국방송통신전파진흥원 (KCA)
    url: https://www.cq.or.kr
    note: 정보보안 분야는 제1·2·4회 시행. 실기(필답형)는 실기 기간 첫 토요일 전국 동시 시행
    rounds:
      - { round: 2027-1, estimated: false,
          written_apply: [2027-01-25, 2027-01-28], written: [2027-02-10, 2027-03-05], written_result: 2027-03-12,
          practical_apply: [2027-03-15, 2027-03-18], practical: 2027-04-10, final_result: 2027-05-07 }
      - { round: 2027-2, estimated: false,
          written_apply: [2027-05-10, 2027-05-14], written: [2027-05-24, 2027-06-14], written_result: 2027-06-18,
          practical_apply: [2027-06-21, 2027-06-24], practical: 2027-07-24, final_result: 2027-08-27 }
      - { round: 2027-4, estimated: false,
          written_apply: [2027-08-30, 2027-09-02], written: [2027-09-13, 2027-10-08], written_result: 2027-10-15,
          practical_apply: [2027-10-18, 2027-10-21], practical: 2027-11-13, final_result: 2027-12-10 }

  - id: cka
    name: CKA (Certified Kubernetes Administrator)
    org: CNCF / Linux Foundation
    url: https://training.linuxfoundation.org/certification/certified-kubernetes-administrator-cka/
    ondemand: true          # 상시 시험 — 필기/실기 구분이 없어 화면에 '응시'로 표시된다
    note: 상시 응시(원격 감독). 120분 실습형, 합격 66%, 무료 재응시 1회 포함
    rounds:
      # 상시 시험이라 '회차'가 없다. 응시 예정일을 practical 에 넣어 쓴다.
      - { round: 2026-11, practical: 2026-11-29 }
