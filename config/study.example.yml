# 공부 스케줄 설정 예시 (공개 파일 — 실제 개인 계획은 GitHub Secret STUDY_PLAN 에 같은 형식으로 넣으세요)
# STUDY_PLAN 이 없으면 이 예시로 화면을 만듭니다. 어느 쪽이든 배포 파일은 STUDY_PASSWORD 로 암호화됩니다.

start: 2026-11-16            # 공부 시작일(월요일 권장)
hours: { weekday: 1.5, weekend: 3 }   # 하루 공부 시간(시간)
past_days: 14               # 시험 직전 며칠을 기출문제 풀이로 할지
rest_days: []                # 쉬는 요일: mon tue wed thu fri sat sun
weekend_review: true         # 토·일은 그 주 단원 복습(이틀 한 묶음). false 면 주말에도 진도

# 목표 시험: exams.yml 의 id · round, 응시 단계(written=필기부터, practical=실기만)
# start 를 주면 그날부터 일정표에 나온다. 없으면 위 start 를 따른다.
targets:
  - { exam: cka, round: 2026-11, from: practical }
  - { exam: eis, round: 2027-1, from: practical, start: 2026-12-15 }
  - { exam: eip, round: 2027-1, from: practical, start: 2026-12-15 }

# 단계별 비중(기간 배분) — 합이 1이 아니어도 비율로 나눔
# CKA 처럼 상시 시험이면서 기간이 짧은 경우를 위한 단계 구성
phases:
  written:   [ { name: 이론 정리, weight: 6 }, { name: 기출 회독, weight: 3 }, { name: 모의고사·오답, weight: 1 } ]
  # 12주 커리큘럼(개념) + 문제 풀이 3주 + 실전 점검 1주 + 기출 2주(past_days)
  practical: [ { name: 개념, weight: 12, kind: concept }, { name: 문제 풀이, weight: 3, kind: quiz }, { name: 실전 점검, weight: 1, kind: review } ]
