# 보안·인프라 페이지 수집 설정
# 원칙: 공식 기관 발표를 우선(KISA·금융보안원·CISA), 언론 보도는 신뢰 매체의 대형 사고만 소량.
# 실패한 출처는 건너뛰고 직전 데이터를 유지합니다. 제목·링크·날짜만 저장합니다(본문 저장 안 함).

days: 7                 # 최근 며칠치 보관

# ---------------------------------------------------------------- 1. 공식 보안 공지
official:
  - { org: KISA,       name: "KISA 보안공지",       type: rss,  url: "https://knvd.krcert.or.kr/rss/security/notice" }
  - { org: 금융보안원,  name: "금융보안원 보도자료",   type: fsec, menu: 69,   base: "https://www.fsec.or.kr" }
  - { org: 금융보안원,  name: "금융보안원 취약점 정보", type: fsec, menu: 1009, base: "https://www.fsec.or.kr" }
  - { org: CISA,       name: "CISA Advisories",    type: rss,  url: "https://www.cisa.gov/cybersecurity-advisories/all.xml" }
official_max: 40

# ---------------------------------------------------------------- 2. 최근 CVE
cve:
  kr:       # KISA 사이버 보안 취약점 정보 포털(KNVD) — 국내 공개 취약점(한글 제목)
    url: "https://knvd.krcert.or.kr/rss/security/info"
    max: 20
  global:   # NVD — 최근 N일 공개된 Critical(CVSS 9.0+) CVE
    url: "https://services.nvd.nist.gov/rest/json/cves/2.0"
    days: 7
    severity: CRITICAL
    max: 25

# CISA KEV(실제 악용 확인 취약점) — 미국 정부 공개 데이터
kev:
  url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
  days: 14

# ---------------------------------------------------------------- 3. 주요 사고 보도(언론)
media:
  hours: 72
  max_clusters: 12      # 같은 사건은 하나로 묶고, 보도 매체 수가 많은 순(=대형 사고)으로 최대 N개
  feeds:
    - { name: "국내 주요 언론", url: "https://news.google.com/rss/search?q=%ED%95%B4%ED%82%B9%20OR%20%EB%9E%9C%EC%84%AC%EC%9B%A8%EC%96%B4%20OR%20%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4%20%EC%9C%A0%EC%B6%9C%20OR%20%EC%A0%9C%EB%A1%9C%EB%8D%B0%EC%9D%B4%20OR%20%EC%B9%A8%ED%95%B4%EC%82%AC%EA%B3%A0%20when%3A3d&hl=ko&gl=KR&ceid=KR:ko", region: kr }
    - { name: 보안뉴스,   url: "https://www.boannews.com/rss/allArticle.xml",  region: kr, outlet: 보안뉴스 }
    - { name: 데일리시큐, url: "https://www.dailysecu.com/rss/allArticle.xml", region: kr, outlet: 데일리시큐 }
    - { name: BleepingComputer, url: "https://www.bleepingcomputer.com/feed/",       region: global, outlet: BleepingComputer }
    - { name: The Hacker News,  url: "https://feeds.feedburner.com/TheHackersNews", region: global, outlet: The Hacker News }
  # 국내는 아래 신뢰 매체만 채택 (구글 뉴스의 출처 이름 기준)
  trusted_kr: [연합뉴스, 연합뉴스TV, KBS 뉴스, MBC 뉴스, SBS 뉴스, YTN, JTBC, 뉴시스, 뉴스1,
               한겨레, 경향신문, 동아일보, 조선일보, 중앙일보, 한국일보, 서울신문, 국민일보,
               한국경제, 매일경제, 서울경제, 머니투데이, 이데일리, 아시아경제, 헤럴드경제, 파이낸셜뉴스,
               전자신문, 지디넷코리아, 디지털데일리, 아이뉴스24, 보안뉴스, 데일리시큐, 블로터, 바이라인네트워크]
  min_severity: high      # 해외 매체는 High 이상만
  kr_min_severity: medium # 국내도 사고·취약점·악성코드 키워드가 있는 기사만 (제품 홍보·행사 기사 제외)
  global_max: 3           # 해외 사건은 최대 3개만, 국내 보도를 먼저 보여 줌
  summary_chars: 90       # 부제목(RSS 요약) 최대 글자 수 — 본문은 가져오지 않음
  exclude: ["[부고]", "부고", "[인사]", "인사]", "신간", "출간", "출시", "론칭", "세미나", "컨퍼런스", "콘퍼런스", "웨비나", "행사", "개최", "수상", "MOU", "업무협약", "채용", "모집", "선정", "인증 획득", "참가", "전시회", "포토", "[칼럼]", "[기고]", "인터뷰"]

# ---------------------------------------------------------------- 분류 규칙 (제목 기준, 대소문자 무시)
severity:
  critical: ["zero-day", "0-day", "actively exploited", "exploited in the wild", "제로데이", "긴급", "unauthenticated", "인증 없이", "원격 코드 실행", "remote code execution"]
  high:     ["ransomware", "랜섬웨어", "breach", "유출", "exploit", "rce", "해킹", "hacked", "stolen", "탈취", "침해", "명령어 삽입", "command injection", "인증 우회", "auth bypass"]
  medium:   ["cve-", "fve-", "vulnerab", "취약점", "patch", "패치", "보안 업데이트", "flaw", "malware", "malicious", "악성", "phishing", "피싱", "스미싱", "backdoor", "백도어"]

# 사이버 킬 체인(Lockheed Martin 7단계) — 항목이 어느 공격 단계와 관련 있는지 키워드로 분류
killchain:
  - { id: recon,    name: "정찰",      desc: "공격 대상 정보 수집·스캐닝",      keys: ["scan", "reconnaissance", "정찰", "스캐닝", "osint", "exposed", "노출"] }
  - { id: weapon,   name: "무기화",    desc: "익스플로잇·악성코드 제작",        keys: ["poc", "exploit kit", "익스플로잇", "builder", "공격 도구"] }
  - { id: delivery, name: "전달",      desc: "피싱 메일·악성 링크·공급망 유입",   keys: ["phishing", "피싱", "스미싱", "smishing", "malicious email", "악성 메일", "malvertising", "supply chain", "공급망", "npm", "pypi", "사칭"] }
  - { id: exploit,  name: "악용",      desc: "취약점을 이용해 실행 권한 획득",    keys: ["rce", "remote code", "원격 코드", "zero-day", "제로데이", "exploited", "악용", "injection", "삽입", "overflow", "오버플로", "bypass", "우회", "취약점", "vulnerab", "cve-", "fve-"] }
  - { id: install,  name: "설치",      desc: "백도어·웹셸·악성코드 설치",        keys: ["malware", "악성코드", "backdoor", "백도어", "webshell", "웹셸", "trojan", "트로이", "loader", "rootkit", "파일 업로드", "file upload"] }
  - { id: c2,       name: "명령·제어",  desc: "C2 서버와 통신, 원격 조종",       keys: ["c2 ", "command and control", "command-and-control", "botnet", "봇넷", "beacon", "rat "] }
  - { id: action,   name: "목적 달성",  desc: "정보 유출·암호화·서비스 마비",     keys: ["ransomware", "랜섬웨어", "breach", "유출", "leak", "exfiltrat", "stolen", "탈취", "wiper", "ddos", "디도스", "데이터 삭제"] }

# 제로트러스트 5대 영역(CISA Zero Trust Maturity Model) — 어느 통제 영역을 점검해야 하는지
zerotrust:
  - { id: identity, name: "아이덴티티",          check: "MFA 적용, 관리자 계정 최소화, 계정 탈취 탐지",        keys: ["credential", "password", "mfa", "2fa", "account", "authentication", "인증", "계정", "비밀번호", "로그인", "탈취", "sso", "token", "토큰"] }
  - { id: device,   name: "디바이스",            check: "엔드포인트 패치·EDR, 미승인 기기 차단",              keys: ["endpoint", "windows", "android", "ios", "macos", "router", "공유기", "firmware", "펌웨어", "iot", "edr", "office"] }
  - { id: network,  name: "네트워크",            check: "VPN·방화벽 패치, 내부망 분리(마이크로 세그멘테이션)",  keys: ["vpn", "firewall", "방화벽", "gateway", "게이트웨이", "dns", "network", "네트워크", "nac", "ztna", "ssl", "proxy"] }
  - { id: app,      name: "애플리케이션·워크로드", check: "웹·API 취약점 점검, 컨테이너·서버 패치",            keys: ["web", "웹", "plugin", "플러그인", "wordpress", "apache", "nginx", "php", "api", "server", "서버", "kubernetes", "container", "컨테이너", "그룹웨어", "메신저", "node.js", "java"] }
  - { id: data,     name: "데이터",              check: "개인정보 암호화·접근 로그, 유출 모니터링",             keys: ["data", "데이터", "개인정보", "유출", "breach", "leak", "database", "db ", "exfiltrat", "backup", "백업"] }

# ---------------------------------------------------------------- 4. 인프라
eol:
  warn_days: 180
  max_cycles: 3
  products:
    - { id: windows-server,           name: Windows Server }
    - { id: rhel,                     name: RHEL }
    - { id: rocky-linux,              name: Rocky Linux }
    - { id: ubuntu,                   name: Ubuntu }
    - { id: kubernetes,               name: Kubernetes }
    - { id: azure-kubernetes-service, name: AKS }
    - { id: nginx,                    name: NGINX }
    - { id: php,                      name: PHP }

cloud_status:
  feeds:
    - { name: Azure, url: "https://rssfeed.azure.status.microsoft/en-us/status/feed/" }
  links:
    - { name: Azure 상태,  url: "https://azure.status.microsoft/" }
    - { name: OCI 상태,    url: "https://ocistatus.oraclecloud.com/" }
    - { name: NCP 공지,    url: "https://www.ncloud.com/support/notice" }
    - { name: AWS 상태,    url: "https://health.aws.amazon.com/health/status" }
    - { name: GitHub 상태, url: "https://www.githubstatus.com/" }
